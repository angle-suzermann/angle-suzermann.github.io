<script>


const VOCAB = {
  "fresh water": {pos:"noun phrase", def:"water with no salt in it, like the water in lakes and rivers", example:"The water in a river is fresh water.", icon:"🏞️"},
  "salt water": {pos:"noun phrase", def:"water with salt in it, like the water in seas and oceans", example:"The water in the ocean is salt water.", icon:"🌊"},
  "cools": {pos:"verb", def:"becomes colder", example:"The water cools in the fridge.", icon:"🧊"},
  "freezes": {pos:"verb", def:"changes from liquid to solid ice", example:"Water freezes and becomes an ice cube.", icon:"❄️"},
  "heats": {pos:"verb", def:"becomes hotter", example:"The water heats in the microwave.", icon:"🔥"},
  "melts": {pos:"verb", def:"changes from solid back to liquid", example:"The snow melts in the sun.", icon:"☀️"},
  "dissolves": {pos:"verb", def:"mixes completely into a liquid and disappears", example:"Salt dissolves in water.", icon:"🧂"},
  "floats": {pos:"verb", def:"stays on top of the water", example:"A feather floats on water.", icon:"🪶"},
  "sinks": {pos:"verb", def:"goes down to the bottom of the water", example:"A stone sinks in water.", icon:"🪨"},
  "heavy": {pos:"adjective", def:"weighs a lot", example:"A tractor is heavy.", icon:"🚜"},
  "light": {pos:"adjective", def:"doesn't weigh much", example:"A feather is light.", icon:"🪶"}
};

const QUIZ_A = [
  {id:'a1', text:'The water in a lake is', options:['fresh water','salt water'], answer:'fresh water'},
  {id:'a2', text:'The water in a river is', options:['fresh water','salt water'], answer:'fresh water'},
  {id:'a3', text:'The water in the sea is', options:['fresh water','salt water'], answer:'salt water'},
  {id:'a4', text:'The water in the ocean is', options:['fresh water','salt water'], answer:'salt water'},
  {id:'a5', text:'The water in an iceberg is', options:['fresh water','salt water'], answer:'fresh water'},
  {id:'a6', text:'The water in rain is', options:['fresh water','salt water'], answer:'fresh water'}
];

const QUIZ_B = [
  {id:'b1', text:'You put water in the fridge. The water', options:['cools','freezes','heats','melts'], answer:'cools'},
  {id:'b2', text:'You make an ice cube from water. The water', options:['cools','freezes','heats','melts'], answer:'freezes'},
  {id:'b3', text:'You put the ice cube in a drink. The ice cube', options:['cools','freezes','heats','melts'], answer:'melts'},
  {id:'b4', text:'You put water in the microwave. The water', options:['cools','freezes','heats','melts'], answer:'heats'},
  {id:'b5', text:'It snows and then it is sunny. The snow', options:['cools','freezes','heats','melts'], answer:'melts'},
  {id:'b6', text:'You jump into cold water. Your body', options:['cools','freezes','heats','melts'], answer:'cools'}
];

const QUIZ_C = [
  {id:'c1', text:'Salt in water', options:['dissolves','floats','sinks'], answer:'dissolves'},
  {id:'c2', text:'A coin in water', options:['dissolves','floats','sinks'], answer:'sinks'},
  {id:'c3', text:'A feather in water', options:['dissolves','floats','sinks'], answer:'floats'},
  {id:'c4', text:'A stone in water', options:['dissolves','floats','sinks'], answer:'sinks'},
  {id:'c5', text:'A leaf in water', options:['dissolves','floats','sinks'], answer:'floats'},
  {id:'c6', text:'Sugar in water', options:['dissolves','floats','sinks'], answer:'dissolves'}
];

const HEAVY_LIGHT = [
  {id:'hl1', icon:'💻', label:'Computer', answer:'heavy'},
  {id:'hl2', icon:'🪶', label:'Feather', answer:'light'},
  {id:'hl3', icon:'🎧', label:'Headphones', answer:'light'},
  {id:'hl4', icon:'🌀', label:'Washing machine', answer:'heavy'},
  {id:'hl5', icon:'🦟', label:'Mosquito', answer:'light'},
  {id:'hl6', icon:'🚜', label:'Tractor', answer:'heavy'}
];

const PLACEMENTS = {};
let selectedChipId = null;

let cachedVoices = [];
function loadVoices(){
  cachedVoices = speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(lang){
  if(!cachedVoices.length) return null;
  return cachedVoices.find(v=>v.lang===lang)
      || cachedVoices.find(v=>v.lang && v.lang.startsWith('en'))
      || cachedVoices[0];
}

function speak(text, lang='en-GB', rate=0.9){
  if(!('speechSynthesis' in window)){
    alert('Sorry, this browser doesn\'t support spoken audio.');
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = rate;
  const voice = pickVoice(lang);
  if(voice) u.voice = voice;

  if(speechSynthesis.speaking || speechSynthesis.pending){
    // Something's already queued - clear it, but Chrome needs a short delay
    // after cancel() before it will accept a new speak() call.
    speechSynthesis.cancel();
    setTimeout(()=>speechSynthesis.speak(u), 120);
  } else {
    // Nothing playing - speak immediately and synchronously in the click
    // handler. Calling cancel() here too (even on an idle queue) is what
    // causes Chrome to silently drop the very next speak() call.
    speechSynthesis.speak(u);
  }
}

function renderWarmup(){
  return `
    <div class="page-inner">
      <h2>Before we start...</h2>
      <p class="lead">Look at these pictures. Talk with a partner: which ones are heavy? Which ones have water in them?</p>
      <div class="warmup-grid">
        <div class="warmup-item"><span class="big-icon">🌊</span><span>Ocean</span></div>
        <div class="warmup-item"><span class="big-icon">🚜</span><span>Tractor</span></div>
        <div class="warmup-item"><span class="big-icon">🪶</span><span>Feather</span></div>
        <div class="warmup-item"><span class="big-icon">🧊</span><span>Ice</span></div>
      </div>

}

function renderVocab(){
  const cards = Object.entries(VOCAB).map(([word,v])=>`
    <div class="vocab-card">
      <div class="vocab-icon">${v.icon}</div>
      <div class="vocab-word">${word}</div>
      <div class="vocab-pos">${v.pos}</div>
      <div class="vocab-def">${v.def}</div>
      <div class="vocab-example">"${v.example}"</div>
      <button class="speak-btn" onclick="speak('${word}')">Listen</button>
    </div>`).join('');
  return `
    <div class="page-inner">
      <h2>New words</h2>
      <p class="lead">Look at each word. Tap "Listen" to hear it.</p>
      <div class="vocab-grid">${cards}</div>
    </div>`;
}

function renderQuizSection(sectionLetter, title, lead, items){
  const rows = items.map(item=>{
    const opts = item.options.map(opt=>
      `<label><input type="radio" name="${item.id}" value="${opt}"> ${opt}</label>`
    ).join('');
    return `<div class="item" data-type="mc" data-answer="${item.answer}" id="item-${item.id}">
      <p>${item.text} ___</p>
      <div class="options">${opts}</div>
    </div>`;
  }).join('');
  return `<div class="section-block"><h3>${sectionLetter}. ${title}</h3><p class="lead-small">${lead}</p>${rows}</div>`;
}

function renderPracticeA(){
  return `<div class="page-inner"><h2>Water Quiz</h2>
    ${renderQuizSection('a','Fresh water or salt water?','Choose the correct answer for each sentence.', QUIZ_A)}
  </div>`;
}

function renderPracticeBC(){
  return `<div class="page-inner"><h2>Water Quiz</h2>
    ${renderQuizSection('b','Cools, freezes, heats or melts?','Choose the correct word for each sentence.', QUIZ_B)}
    ${renderQuizSection('c','Dissolves, floats or sinks?','Choose the correct word for each sentence.', QUIZ_C)}
  </div>`;
}

function renderHeavyLight(){
  const chips = HEAVY_LIGHT.map(it=>
    `<button class="chip" id="chip-${it.id}" onclick="selectChip('${it.id}')"><span class="chip-icon">${it.icon}</span><span>${it.label}</span></button>`
  ).join('');
  return `<div class="page-inner">
    <h2>Heavy or light?</h2>
    <p class="lead">Tap a picture, then tap "Heavy" or "Light".</p>
    <div class="chip-bank" id="chipBank">${chips}</div>
    <div class="buckets">
      <div class="bucket" id="bucket-heavy" onclick="dropInto('heavy')"><h3>Heavy</h3><div class="bucket-items" id="bucket-heavy-items"></div></div>
      <div class="bucket" id="bucket-light" onclick="dropInto('light')"><h3>Light</h3><div class="bucket-items" id="bucket-light-items"></div></div>
    </div>
  </div>`;
}

function renderResults(){
  return `<div class="page-inner results-page">
    <h2>Well done!</h2>
    <p class="lead">Tap the button to see your score.</p>
    <button class="check-btn" onclick="showResults()">Check my answers</button>
    <div id="resultsBox"></div>
    <button class="submit-btn" id="submitBtn" onclick="sendCompletion()" style="display:none;">Submit to teacher</button>
    <p class="submit-status" id="submitStatus"></p>
  </div>`;
}

const pages = [
  {label:'Warm-up', render: renderWarmup},
  {label:'Vocabulary', render: renderVocab},
  {label:'Quiz A', render: renderPracticeA},
  {label:'Quiz B&C', render: renderPracticeBC},
  {label:'Heavy/Light', render: renderHeavyLight},
  {label:'Results', render: renderResults}

let current = 0;

function buildNavDots(){
  document.getElementById('navDots').innerHTML = pages.map((p,i)=>
    `<button class="nav-dot" onclick="goTo(${i})">${p.label}</button>`
  ).join('');

function renderPage(){
  document.getElementById('stage').innerHTML = pages[current].render();
  document.querySelectorAll('.nav-dot').forEach((b,i)=>b.classList.toggle('active', i===current));
  document.getElementById('progressFill').style.width = `${(current+1)/pages.length*100}%`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').style.visibility = current===pages.length-1 ? 'hidden' : 'visible';
  if(current===4) restoreBuckets();
  window.scrollTo(0,0);
}

function goTo(n){ current=n; renderPage(); }
function nextPage(){ if(current<pages.length-1){ current++; renderPage(); } }
function prevPage(){ if(current>0){ current--; renderPage(); } }

function selectChip(id){
  const chip = document.getElementById(`chip-${id}`);
  if(chip.classList.contains('placed')) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  chip.classList.add('selected');
  selectedChipId = id;
}

function dropInto(bucket){
  if(!selectedChipId) return;
  const chip = document.getElementById(`chip-${selectedChipId}`);
  const item = HEAVY_LIGHT.find(h=>h.id===selectedChipId);
  const isCorrect = item.answer === bucket;
  chip.classList.remove('selected');
  chip.classList.add('placed', isCorrect ? 'correct' : 'wrong');
  document.getElementById(`bucket-${bucket}-items`).appendChild(chip);
  PLACEMENTS[selectedChipId] = {bucket, correct:isCorrect};
  selectedChipId = null;
}

function restoreBuckets(){
  Object.keys(PLACEMENTS).forEach(id=>{
    const p = PLACEMENTS[id];
    const chip = document.getElementById(`chip-${id}`);
    if(chip){
      chip.classList.add('placed', p.correct ? 'correct' : 'wrong');
      document.getElementById(`bucket-${p.bucket}-items`).appendChild(chip);
    }
  });
}

function showResults(){
  const allQuizItems = document.querySelectorAll('.item[data-type="mc"]');
  // Score only works reliably for the currently-rendered quiz page, so we
  // walk each quiz page's data directly instead of relying on live DOM state.
  const allQuiz = [...QUIZ_A, ...QUIZ_B, ...QUIZ_C];
  let mcqCorrect = 0;
  const mistakes = [];
  allQuiz.forEach(q=>{
    const stored = ANSWERS[q.id];
    if(stored === q.answer){
      mcqCorrect++;
    } else {
      mistakes.push(q.text + ' ___ → answered "' + (stored || '(not answered)') + '", correct "' + q.answer + '"');
    }
  });
  const mcqTotal = allQuiz.length;

  const hlTotal = HEAVY_LIGHT.length;
  let hlCorrect = 0;
  HEAVY_LIGHT.forEach(item=>{
    const placed = PLACEMENTS[item.id];
    if(placed && placed.correct){
      hlCorrect++;
    } else {
      mistakes.push(item.label + ' (heavy or light?) → answered "' + (placed ? placed.bucket : '(not answered)') + '", correct "' + item.answer + '"');
    }
  });

  const totalCorrect = mcqCorrect + hlCorrect;
  const totalItems = mcqTotal + hlTotal;
  const pct = Math.round((totalCorrect/totalItems)*100);

  document.getElementById('resultsBox').innerHTML = `
    <div class="score-circle">${pct}%</div>
    <p class="score-detail">${totalCorrect} / ${totalItems} correct</p>
    <div class="score-breakdown">
      <p>Water Quiz: ${mcqCorrect} / ${mcqTotal}</p>
      <p>Heavy or Light: ${hlCorrect} / ${hlTotal}</p>
    </div>
    <div class="completion-stickers" id="completionStickers">
      <img class="completion-sticker" data-tier="eggcellent-a" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="eggcellent-b" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="perfect" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="excellent" hidden alt="">
      <img class="completion-sticker" data-tier="amazing_work" hidden alt="">
      <img class="completion-sticker" data-tier="i_love_it" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="awesome" hidden alt="">
      <img class="completion-sticker" data-tier="too_cool-a" hidden alt="">
      <img class="completion-sticker" data-tier="too_cool-b" hidden alt="">
      <img class="completion-sticker" data-tier="vzhukh" hidden alt="">
      <img class="completion-sticker" data-tier="fire" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="great_work" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="good_job" hidden alt="">
      <img class="completion-sticker" data-tier="good_vibes" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="nice" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="not_bad" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="strawberry-a" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="strawberry-b" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="keep_going" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="you_tried" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="plain" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="strawberry-full" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="no_luck" alt="" hidden>
      <img class="completion-sticker completion-sticker--medium" data-tier="still_lost" alt="" hidden>
    </div>
    <p id="resultCaption" class="result-caption"></p>
  `;
  renderResultSticker(pct);

  lastSummary = { mcqCorrect, mcqTotal, hlCorrect, hlTotal, totalCorrect, totalItems, pct, mistakes };
  document.getElementById('submitBtn').style.display = 'block';
}

let lastSummary = null;

function getStudentName(){
  const v = document.getElementById('studentName').value.trim();
  return v || '(no name entered)';
}

async function sendCompletion(){
  if(!lastSummary){ return; }
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('submitStatus');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  const fd = new FormData();
  fd.append('access_key', '8af30ecf-0d8b-4e1f-aa4b-2b3b76fe8234');
  fd.append('course', 'Academy Stars 4');
  fd.append('subject', ('Academy Stars 4 — ' + document.title) + ' — ' + (getStudentName()));
  fd.append('lesson', document.title);
  fd.append('student', getStudentName());
  fd.append('timestamp', new Date().toISOString());
  fd.append('score', lastSummary.totalCorrect + ' / ' + lastSummary.totalItems + ' (' + lastSummary.pct + '%)');
  fd.append('result_tier', getResultTier(lastSummary.pct).label);
  fd.append('summary', JSON.stringify(lastSummary));
  fd.append('mistakes', lastSummary.mistakes.length ? lastSummary.mistakes.join('\n') : 'No mistakes — all items correct.');

  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: {'Accept': 'application/json'},
      body: fd
    });
    if(res.ok){
      btn.textContent = 'Submitted';
      status.textContent = 'Result sent to your teacher.';
    } else {
      btn.disabled = false;
      btn.textContent = 'Submit to teacher';
      status.textContent = 'Sending failed — please try again.';
    }
  } catch(err){
    btn.disabled = false;
    btn.textContent = 'Submit to teacher';
    status.textContent = 'Sending failed — please try again.';
  }
}

// Track radio answers globally since pages 2 and 3 get replaced in the DOM

<script>
(function(){
  var canvas = document.getElementById('inkCanvas');
  var ctx = canvas.getContext('2d');
  var laserCanvas = document.getElementById('laserCanvas');
  var lctx = laserCanvas.getContext('2d');
  var toggle = document.getElementById('inkToggle');
  var panel = document.getElementById('inkPanel');
  var undoBtn = document.getElementById('inkUndo');
  var redoBtn = document.getElementById('inkRedo');
  var activeTool = 'pen';
  var activeColor = '#2D2926';
  var activeStamp = null;
  var activeTextInput = null;
  var drawing = false;
  var current = null;
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  var hostEl = document.querySelector('.scroll-area') || document.body;
  if(canvas.parentElement !== hostEl) hostEl.appendChild(canvas);
  if(laserCanvas.parentElement !== hostEl) hostEl.appendChild(laserCanvas);

  var STORE_KEY = 'angle_ink::' + location.pathname;
  var allStrokes = {};
  var redoStacks = {};
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) allStrokes = JSON.parse(raw) || {};
  }catch(e){}

  function pageKey(){
    var p = document.querySelector('.page.active[data-page]');
    return p ? ('p' + p.getAttribute('data-page')) : 'single';
  }
  function strokesFor(key){
    if(!allStrokes[key]) allStrokes[key] = [];
    return allStrokes[key];
  }
  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(allStrokes)); }catch(e){}
  }
  function updateUndoRedoButtons(){
    var key = pageKey();
    undoBtn.disabled = !(allStrokes[key] && allStrokes[key].length);
    redoBtn.disabled = !(redoStacks[key] && redoStacks[key].length);
  }

  function hostSize(){
    return { w: hostEl.scrollWidth, h: hostEl.scrollHeight };
  }

  function resizeCanvas(){
    var size = hostSize();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    [canvas, laserCanvas].forEach(function(cv){
      cv.style.width = size.w + 'px';
      cv.style.height = size.h + 'px';
      cv.width = Math.round(size.w * dpr);
      cv.height = Math.round(size.h * dpr);
    });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawInk();
    updateUndoRedoButtons();
  }

  function strokeStyleFor(tool){
    if(tool === 'highlighter') return { width: 16, alpha: .35, cap: 'butt', comp: 'source-over' };
    if(tool === 'eraser') return { width: 22, alpha: 1, cap: 'round', comp: 'destination-out' };
    return { width: 3, alpha: 1, cap: 'round', comp: 'source-over' };
  }

  function drawPath(s){
    if(!s.points || s.points.length < 2) return;
    var st = strokeStyleFor(s.tool);
    ctx.save();
    ctx.globalCompositeOperation = st.comp;
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = st.width;
    ctx.lineCap = st.cap;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i][0], s.points[i][1]); }
    ctx.stroke();
    ctx.restore();
  }

  function drawShape(s){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(s.tool === 'rect'){
      var x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
      var w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      ctx.strokeRect(x, y, w, h);
    } else if(s.tool === 'ellipse'){
      var cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
      var rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(rx,1), Math.max(ry,1), 0, 0, Math.PI*2);
      ctx.stroke();
    } else if(s.tool === 'line' || s.tool === 'arrow'){
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
      if(s.tool === 'arrow'){
        var ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        var ah = 12;
        ctx.beginPath();
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang - Math.PI/7), s.y2 - ah*Math.sin(ang - Math.PI/7));
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang + Math.PI/7), s.y2 - ah*Math.sin(ang + Math.PI/7));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  var stickerImageCache = {};
  function getStickerImage(key){
    if(stickerImageCache[key]) return stickerImageCache[key];
    if(typeof STICKER_DATA === 'undefined' || !STICKER_DATA[key]) return null;
    var im = new Image();
    im.onload = function(){ redrawInk(); };
    im.src = STICKER_DATA[key];
    stickerImageCache[key] = im;
    return im;
  }
  function drawStamp(s){
    ctx.save();
    if(s.img){
      var im = getStickerImage(s.img);
      if(im && im.complete && im.naturalWidth){
        var k = Math.min(s.size/im.naturalWidth, s.size/im.naturalHeight), dw = im.naturalWidth*k, dh = im.naturalHeight*k;
        ctx.drawImage(im, s.x - dw/2, s.y - dh/2, dw, dh);
      }
    } else if(s.emoji){
      ctx.font = Math.round(s.size*0.9) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.emoji, s.x, s.y);
    }
    ctx.restore();
  }

  function drawText(s){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = s.color;
    var size = s.size || 20;
    ctx.font = size + 'px "Apercu Pro","Helvetica Neue",Arial,sans-serif';
    ctx.textBaseline = 'top';
    var lines = String(s.text || '').split('\n');
    var lh = Math.round(size * 1.25);
    lines.forEach(function(line, i){ ctx.fillText(line, s.x, s.y + i*lh); });
    ctx.restore();
  }

  function commitTextInput(ta, p, save){
    if(activeTextInput !== ta) return;
    activeTextInput = null;
    var val = ta.value;
    if(ta.parentNode) ta.parentNode.removeChild(ta);
    if(!save || !val.trim()) { redrawInk(); return; }
    strokesFor(pageKey()).push({ type:'text', x:p[0], y:p[1], text:val, color:activeColor, size:20 });
    redoStacks[pageKey()] = [];
    redrawInk();
    persist();
    updateUndoRedoButtons();
  }
  function startTextInput(p){
    if(activeTextInput) commitTextInput(activeTextInput, activeTextInput.__pt, true);
    var ta = document.createElement('textarea');
    ta.className = 'ink-text-input';
    ta.rows = 1;
    ta.style.cssText = 'position:absolute;left:' + p[0] + 'px;top:' + p[1] + 'px;min-width:120px;max-width:60vw;' +
      'font:20px \"Apercu Pro\",\"Helvetica Neue\",Arial,sans-serif;color:' + activeColor + ';background:rgba(255,255,255,.85);' +
      'border:1.5px dashed ' + activeColor + ';border-radius:4px;padding:2px 4px;z-index:600;resize:none;overflow:hidden;line-height:1.25;';
    ta.__pt = p;
    hostEl.appendChild(ta);
    activeTextInput = ta;
    function autosize(){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
    ta.addEventListener('input', autosize);
    ta.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ e.preventDefault(); commitTextInput(ta, p, false); }
      else if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commitTextInput(ta, p, true); }
    });
    ta.addEventListener('blur', function(){ commitTextInput(ta, p, true); });
    autosize();
    /* defer focus to a macrotask: the pointerdown's own default handling can
       otherwise blur a textarea focused synchronously inside this handler */
    setTimeout(function(){ ta.focus(); }, 0);
  }

  function redrawInk(){
    var size = hostSize();
    ctx.clearRect(0, 0, size.w, size.h);
    var list = strokesFor(pageKey());
    list.forEach(function(s){
      if(s.type === 'path') drawPath(s);
      else if(s.type === 'stamp') drawStamp(s);
      else if(s.type === 'text') drawText(s);
      else drawShape(s);
    });
    if(current){
      if(current.type === 'path') drawPath(current);
      else drawShape(current);
    }
  }
  window.redrawInk = redrawInk;

  function pt(e){
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  function onDown(e){
    if(canvas.style.pointerEvents === 'none') return;
    if(activeTool === 'laser') return;
    var p = pt(e);
    if(activeTool === 'sticker'){
      if(!activeStamp) return;
      var stamp = { type:'stamp', x:p[0], y:p[1], size:40 };
      if(activeStamp.emoji) stamp.emoji = activeStamp.emoji; else stamp.img = activeStamp.img;
      strokesFor(pageKey()).push(stamp);
      redoStacks[pageKey()] = [];
      redrawInk();
      persist();
      updateUndoRedoButtons();
      return;
    }
    if(activeTool === 'text'){
      startTextInput(p);
      return;
    }
    drawing = true;
    if(activeTool === 'pen' || activeTool === 'highlighter' || activeTool === 'eraser'){
      current = { type:'path', tool:activeTool, color:activeColor, points:[p] };
    } else {
      current = { type:'shape', tool:activeTool, color:activeColor, x1:p[0], y1:p[1], x2:p[0], y2:p[1] };
    }
    redrawInk();
  }
  function onMove(e){
    if(activeTool === 'laser' && canvas.style.pointerEvents !== 'none'){
      var lp = pt(e);
      laserTrail.push({x:lp[0], y:lp[1], t:Date.now()});
    }
    if(!drawing || !current) return;
    var p = pt(e);
    if(current.type === 'path'){ current.points.push(p); }
    else { current.x2 = p[0]; current.y2 = p[1]; }
    redrawInk();
  }
  function onUp(){
    if(!drawing || !current) return;
    drawing = false;
    strokesFor(pageKey()).push(current);
    redoStacks[pageKey()] = [];
    current = null;
    redrawInk();
    persist();
    updateUndoRedoButtons();
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  var laserTrail = [];
  function laserLoop(){
    var size = hostSize();
    lctx.clearRect(0, 0, size.w, size.h);
    var now = Date.now();
    laserTrail = laserTrail.filter(function(p){ return now - p.t < 450; });
    laserTrail.forEach(function(p){
      var age = (now - p.t) / 450;
      var alpha = 1 - age;
      var r = Math.max(8 * (1 - age * 0.5), 1);
      lctx.beginPath();
      lctx.fillStyle = 'rgba(214,52,44,' + (alpha * 0.85) + ')';
      lctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      lctx.fill();
    });
    requestAnimationFrame(laserLoop);
  }
  requestAnimationFrame(laserLoop);

  function setToolActive(on){
    if(!on && activeTextInput) commitTextInput(activeTextInput, activeTextInput.__pt, true);
    canvas.style.pointerEvents = on ? 'auto' : 'none';
    toggle.classList.toggle('active', on);
    panel.hidden = !on;
    if(on) positionPanel();
  }

  var dragging = false, dragMoved = false, dragStartX = 0, dragStartY = 0, dragOrigLeft = 0, dragOrigTop = 0;
  function clampPos(left, top, w, h){
    left = Math.max(4, Math.min(window.innerWidth - w - 4, left));
    top = Math.max(4, Math.min(window.innerHeight - h - 4, top));
    return [left, top];
  }
  function positionPanel(){
    var r = toggle.getBoundingClientRect();
    var pw = panel.offsetWidth || 110;
    var ph = panel.offsetHeight || 200;
    var left = r.right + 8;
    if(left + pw > window.innerWidth - 8) left = r.left - pw - 8;
    var top = r.top + r.height / 2 - ph / 2;
    var clamped = clampPos(left, top, pw, ph);
    panel.style.left = clamped[0] + 'px';
    panel.style.top = clamped[1] + 'px';
    panel.style.transform = 'none';
  }
  toggle.addEventListener('pointerdown', function(e){
    dragging = true; dragMoved = false;
    dragStartX = e.clientX; dragStartY = e.clientY;
    var r = toggle.getBoundingClientRect();
    dragOrigLeft = r.left; dragOrigTop = r.top;
    try{ toggle.setPointerCapture(e.pointerId); }catch(err){}
  });
  toggle.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if(dragMoved){
      var pos = clampPos(dragOrigLeft + dx, dragOrigTop + dy, toggle.offsetWidth, toggle.offsetHeight);
      toggle.style.left = pos[0] + 'px';
      toggle.style.top = pos[1] + 'px';
      toggle.style.transform = 'none';
      if(!panel.hidden) positionPanel();
    }
  });
  function endDrag(){ dragging = false; }
  toggle.addEventListener('pointerup', endDrag);
  toggle.addEventListener('pointercancel', endDrag);
  toggle.addEventListener('click', function(e){
    if(dragMoved){ dragMoved = false; e.preventDefault(); return; }
    setToolActive(panel.hidden);
  });
  window.addEventListener('resize', function(){ if(!panel.hidden) positionPanel(); });

  document.getElementById('inkDone').addEventListener('click', function(){ setToolActive(false); });
  document.getElementById('inkClear').addEventListener('click', function(){
    if(!confirm('Стереть пометки на этой странице?')) return;
    if(activeTextInput) commitTextInput(activeTextInput, activeTextInput.__pt, false);
    allStrokes[pageKey()] = [];
    redoStacks[pageKey()] = [];
    redrawInk();
    persist();
    updateUndoRedoButtons();
  });
  undoBtn.addEventListener('click', function(){
    var key = pageKey();
    var list = strokesFor(key);
    if(!list.length) return;
    var popped = list.pop();
    if(!redoStacks[key]) redoStacks[key] = [];
    redoStacks[key].push(popped);
    redrawInk();
    persist();
    updateUndoRedoButtons();
  });
  redoBtn.addEventListener('click', function(){
    var key = pageKey();
    var rs = redoStacks[key];
    if(!rs || !rs.length) return;
    strokesFor(key).push(rs.pop());
    redrawInk();
    persist();
    updateUndoRedoButtons();
  });

  document.querySelectorAll('.ink-tool').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(activeTextInput && btn.dataset.tool !== 'text') commitTextInput(activeTextInput, activeTextInput.__pt, true);
      document.querySelectorAll('.ink-tool').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.ink-sticker-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeTool = btn.dataset.tool;
    });
  });
  document.querySelectorAll('.ink-color').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.ink-color').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeColor = btn.dataset.color;
    });
  });

  function selectSticker(stamp, btnEl){
    activeTool = 'sticker';
    activeStamp = stamp;
    document.querySelectorAll('.ink-tool').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.ink-sticker-btn').forEach(function(b){ b.classList.remove('active'); });
    if(btnEl) btnEl.classList.add('active');
  }
  document.querySelectorAll('.ink-sticker-btn[data-sticker-emoji]').forEach(function(btn){
    btn.addEventListener('click', function(){ selectSticker({ emoji: btn.dataset.stickerEmoji }, btn); });
  });

  (function loadEggdogStickers(){
    var EGGDOG_KEYS = ['strawberry-sparkle', 'vzhukh', 'nice', 'not_bad', 'angle-flower', 'angle-stars', 'fire'];
    function populate(){
      if(typeof STICKER_DATA === 'undefined') return;
      var row = document.getElementById('inkStickers');
      EGGDOG_KEYS.forEach(function(key){
        if(!STICKER_DATA[key]) return;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ink-sticker-btn';
        b.title = 'eggdog';
        b.style.backgroundImage = 'url(' + STICKER_DATA[key] + ')';
        b.addEventListener('click', function(){ selectSticker({ img: key }, b); });
        row.appendChild(b);
      });
    }
    if(typeof STICKER_DATA !== 'undefined'){ populate(); return; }
    var s = document.createElement('script');
    s.src = '/assets/sticker-data.js';
    s.onload = populate;
    document.head.appendChild(s);
  })();

  var resizeTimer = null;
  function scheduleResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeCanvas, 150); }
  window.addEventListener('resize', scheduleResize);
  if(window.ResizeObserver){ new ResizeObserver(scheduleResize).observe(hostEl); }

  var pageObserver = new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      if(muts[i].attributeName === 'class'){ scheduleResize(); return; }
    }
  });
  pageObserver.observe(hostEl, { attributes:true, attributeFilter:['class'], subtree:true });

  resizeCanvas();
})();
</script>
<script>
(function(){
  var toggle = document.getElementById('noteToggle');
  var panel = document.getElementById('notePanel');
  var closeBtn = document.getElementById('noteClose');
  var clearBtn = document.getElementById('noteClear');
  var textEl = document.getElementById('noteText');
  var savedEl = document.getElementById('noteSaved');
  if(!toggle || !panel) return;

  var KEY = 'angle_notes::' + location.pathname;
  try{
    var saved = localStorage.getItem(KEY);
    if(saved) textEl.value = saved;
  }catch(e){}

  var saveTimer = null, hideTimer = null;
  function scheduleSaveNote(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{ localStorage.setItem(KEY, textEl.value); }catch(e){}
      savedEl.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){ savedEl.classList.remove('show'); }, 1500);
    }, 400);
  }
  textEl.addEventListener('input', scheduleSaveNote);

  function clampPos(left, top, w, h){
    left = Math.max(4, Math.min(window.innerWidth - w - 4, left));
    top = Math.max(4, Math.min(window.innerHeight - h - 4, top));
    return [left, top];
  }
  function positionPanel(){
    var r = toggle.getBoundingClientRect();
    var pw = panel.offsetWidth || 220;
    var ph = panel.offsetHeight || 200;
    var left = r.right + 8;
    if(left + pw > window.innerWidth - 8) left = r.left - pw - 8;
    var top = r.top + r.height / 2 - ph / 2;
    var clamped = clampPos(left, top, pw, ph);
    panel.style.left = clamped[0] + 'px';
    panel.style.top = clamped[1] + 'px';
    panel.style.transform = 'none';
  }
  function setOpen(on){
    panel.hidden = !on;
    toggle.classList.toggle('active', on);
    if(on){ positionPanel(); textEl.focus(); }
  }

  var dragging = false, dragMoved = false, dsx = 0, dsy = 0, dol = 0, dot = 0;
  toggle.addEventListener('pointerdown', function(e){
    dragging = true; dragMoved = false;
    dsx = e.clientX; dsy = e.clientY;
    var r = toggle.getBoundingClientRect();
    dol = r.left; dot = r.top;
    try{ toggle.setPointerCapture(e.pointerId); }catch(err){}
  });
  toggle.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - dsx, dy = e.clientY - dsy;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if(dragMoved){
      var pos = clampPos(dol + dx, dot + dy, toggle.offsetWidth, toggle.offsetHeight);
      toggle.style.left = pos[0] + 'px';
      toggle.style.top = pos[1] + 'px';
      toggle.style.transform = 'none';
      if(!panel.hidden) positionPanel();
    }
  });
  function endDrag(){ dragging = false; }
  toggle.addEventListener('pointerup', endDrag);
  toggle.addEventListener('pointercancel', endDrag);
  toggle.addEventListener('click', function(e){
    if(dragMoved){ dragMoved = false; e.preventDefault(); return; }
    setOpen(panel.hidden);
  });
  closeBtn.addEventListener('click', function(){ setOpen(false); });
  clearBtn.addEventListener('click', function(){
    if(!confirm('Удалить все заметки на этой странице?')) return;
    textEl.value = '';
    try{ localStorage.removeItem(KEY); }catch(e){}
    textEl.focus();
  });
  window.addEventListener('resize', function(){ if(!panel.hidden) positionPanel(); });
})();
</script>
</body>
</html>
