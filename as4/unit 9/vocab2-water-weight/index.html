<script>
const VOCAB = {
  "fresh water": {pos:"noun phrase", def:"water with no salt in it, like the water in lakes and rivers", example:"The water in a river is fresh water.", icon:"🏞️"},
  "salt water": {pos:"noun phrase", def:"water with salt in it, like the water in seas and oceans", example:"The water in the ocean is salt water.", icon:"🌊"},
  "cools": {pos:"verb", def:"becomes colder", example:"The water cools in the fridge.", icon:"🧊"},
  "freezes": {pos:"verb", def:"changes from liquid to solid ice", example:"Water freezes and becomes an ice cube.", icon:"❄️"},
  "heats": {pos:"verb", def:"becomes hotter", example:"The water heats in the microwave.", icon:"🔥"},
  "melts": {pos:"verb", def:"changes from solid back to liquid", example:"The snow melts in the sun.", icon:"☀️"},
  "dissolves": {pos:"verb", def:"mixes completely into a liquid and disappears", example:"Salt dissolves in water.", icon:"🧂"},
  "floats": {pos:"verb", def:"stays on top of the water", example:"A feather floats on water.", icon:"🪶"},
  "sinks": {pos:"verb", def:"goes down to the bottom of the water", example:"A stone sinks in water.", icon:"🪨"},
  "heavy": {pos:"adjective", def:"weighs a lot", example:"A tractor is heavy.", icon:"🚜"},
  "light": {pos:"adjective", def:"doesn't weigh much", example:"A feather is light.", icon:"🪶"}
};

const QUIZ_A = [
  {id:'a1', text:'The water in a lake is', options:['fresh water','salt water'], answer:'fresh water'},
  {id:'a2', text:'The water in a river is', options:['fresh water','salt water'], answer:'fresh water'},
  {id:'a3', text:'The water in the sea is', options:['fresh water','salt water'], answer:'salt water'},
  {id:'a4', text:'The water in the ocean is', options:['fresh water','salt water'], answer:'salt water'},
  {id:'a5', text:'The water in an iceberg is', options:['fresh water','salt water'], answer:'fresh water'},
  {id:'a6', text:'The water in rain is', options:['fresh water','salt water'], answer:'fresh water'}
];

const QUIZ_B = [
  {id:'b1', text:'You put water in the fridge. The water', options:['cools','freezes','heats','melts'], answer:'cools'},
  {id:'b2', text:'You make an ice cube from water. The water', options:['cools','freezes','heats','melts'], answer:'freezes'},
  {id:'b3', text:'You put the ice cube in a drink. The ice cube', options:['cools','freezes','heats','melts'], answer:'melts'},
  {id:'b4', text:'You put water in the microwave. The water', options:['cools','freezes','heats','melts'], answer:'heats'},
  {id:'b5', text:'It snows and then it is sunny. The snow', options:['cools','freezes','heats','melts'], answer:'melts'},
  {id:'b6', text:'You jump into cold water. Your body', options:['cools','freezes','heats','melts'], answer:'cools'}
];

const QUIZ_C = [
  {id:'c1', text:'Salt in water', options:['dissolves','floats','sinks'], answer:'dissolves'},
  {id:'c2', text:'A coin in water', options:['dissolves','floats','sinks'], answer:'sinks'},
  {id:'c3', text:'A feather in water', options:['dissolves','floats','sinks'], answer:'floats'},
  {id:'c4', text:'A stone in water', options:['dissolves','floats','sinks'], answer:'sinks'},
  {id:'c5', text:'A leaf in water', options:['dissolves','floats','sinks'], answer:'floats'},
  {id:'c6', text:'Sugar in water', options:['dissolves','floats','sinks'], answer:'dissolves'}
];

const HEAVY_LIGHT = [
  {id:'hl1', icon:'💻', label:'Computer', answer:'heavy'},
  {id:'hl2', icon:'🪶', label:'Feather', answer:'light'},
  {id:'hl3', icon:'🎧', label:'Headphones', answer:'light'},
  {id:'hl4', icon:'🌀', label:'Washing machine', answer:'heavy'},
  {id:'hl5', icon:'🦟', label:'Mosquito', answer:'light'},
  {id:'hl6', icon:'🚜', label:'Tractor', answer:'heavy'}
];

const PLACEMENTS = {};
let selectedChipId = null;

let cachedVoices = [];
function loadVoices(){
  cachedVoices = speechSynthesis.getVoices();
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice(lang){
  if(!cachedVoices.length) return null;
  return cachedVoices.find(v=>v.lang===lang)
      || cachedVoices.find(v=>v.lang && v.lang.startsWith('en'))
      || cachedVoices[0];
}

function speak(text, lang='en-GB', rate=0.9){
  if(!('speechSynthesis' in window)){
    alert('Sorry, this browser doesn\'t support spoken audio.');
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = rate;
  const voice = pickVoice(lang);
  if(voice) u.voice = voice;

  if(speechSynthesis.speaking || speechSynthesis.pending){
    // Something's already queued - clear it, but Chrome needs a short delay
    // after cancel() before it will accept a new speak() call.
    speechSynthesis.cancel();
    setTimeout(()=>speechSynthesis.speak(u), 120);
  } else {
    // Nothing playing - speak immediately and synchronously in the click
    // handler. Calling cancel() here too (even on an idle queue) is what
    // causes Chrome to silently drop the very next speak() call.
    speechSynthesis.speak(u);
  }
}

function renderWarmup(){
  return `
    <div class="page-inner">
      <h2>Before we start...</h2>
      <p class="lead">Look at these pictures. Talk with a partner: which ones are heavy? Which ones have water in them?</p>
      <div class="warmup-grid">
        <div class="warmup-item"><span class="big-icon">🌊</span><span>Ocean</span></div>
        <div class="warmup-item"><span class="big-icon">🚜</span><span>Tractor</span></div>
        <div class="warmup-item"><span class="big-icon">🪶</span><span>Feather</span></div>
        <div class="warmup-item"><span class="big-icon">🧊</span><span>Ice</span></div>
      </div>
      <p class="hint">There are no right or wrong answers here — just think and talk!</p>
    </div>`;
}

function renderVocab(){
  const cards = Object.entries(VOCAB).map(([word,v])=>`
    <div class="vocab-card">
      <div class="vocab-icon">${v.icon}</div>
      <div class="vocab-word">${word}</div>
      <div class="vocab-pos">${v.pos}</div>
      <div class="vocab-def">${v.def}</div>
      <div class="vocab-example">"${v.example}"</div>
      <button class="speak-btn" onclick="speak('${word}')">Listen</button>
    </div>`).join('');
  return `
    <div class="page-inner">
      <h2>New words</h2>
      <p class="lead">Look at each word. Tap "Listen" to hear it.</p>
      <div class="vocab-grid">${cards}</div>
    </div>`;
}

function renderQuizSection(sectionLetter, title, lead, items){
  const rows = items.map(item=>{
    const opts = item.options.map(opt=>
      `<label><input type="radio" name="${item.id}" value="${opt}"> ${opt}</label>`
    ).join('');
    return `<div class="item" data-type="mc" data-answer="${item.answer}" id="item-${item.id}">
      <p>${item.text} ___</p>
      <div class="options">${opts}</div>
    </div>`;
  }).join('');
  return `<div class="section-block"><h3>${sectionLetter}. ${title}</h3><p class="lead-small">${lead}</p>${rows}</div>`;
}

function renderPracticeA(){
  return `<div class="page-inner"><h2>Water Quiz</h2>
    ${renderQuizSection('a','Fresh water or salt water?','Choose the correct answer for each sentence.', QUIZ_A)}
  </div>`;
}

function renderPracticeBC(){
  return `<div class="page-inner"><h2>Water Quiz</h2>
    ${renderQuizSection('b','Cools, freezes, heats or melts?','Choose the correct word for each sentence.', QUIZ_B)}
    ${renderQuizSection('c','Dissolves, floats or sinks?','Choose the correct word for each sentence.', QUIZ_C)}
  </div>`;
}

function renderHeavyLight(){
  const chips = HEAVY_LIGHT.map(it=>
    `<button class="chip" id="chip-${it.id}" onclick="selectChip('${it.id}')"><span class="chip-icon">${it.icon}</span><span>${it.label}</span></button>`
  ).join('');
  return `<div class="page-inner">
    <h2>Heavy or light?</h2>
    <p class="lead">Tap a picture, then tap "Heavy" or "Light".</p>
    <div class="chip-bank" id="chipBank">${chips}</div>
    <div class="buckets">
      <div class="bucket" id="bucket-heavy" onclick="dropInto('heavy')"><h3>Heavy</h3><div class="bucket-items" id="bucket-heavy-items"></div></div>
      <div class="bucket" id="bucket-light" onclick="dropInto('light')"><h3>Light</h3><div class="bucket-items" id="bucket-light-items"></div></div>
    </div>
  </div>`;
}

function renderResults(){
  return `<div class="page-inner results-page">
    <h2>Well done!</h2>
    <p class="lead">Tap the button to see your score.</p>
    <button class="check-btn" onclick="showResults()">Check my answers</button>
    <div id="resultsBox"></div>
    <button class="submit-btn" id="submitBtn" onclick="sendCompletion()" style="display:none;">Submit to teacher</button>
    <p class="submit-status" id="submitStatus"></p>
  </div>`;
}

const pages = [
  {label:'Warm-up', render: renderWarmup},
  {label:'Vocabulary', render: renderVocab},
  {label:'Quiz A', render: renderPracticeA},
  {label:'Quiz B&C', render: renderPracticeBC},
  {label:'Heavy/Light', render: renderHeavyLight},
  {label:'Results', render: renderResults}
];
let current = 0;

function buildNavDots(){
  document.getElementById('navDots').innerHTML = pages.map((p,i)=>
    `<button class="nav-dot" onclick="goTo(${i})">${p.label}</button>`
  ).join('');
}

function renderPage(){
  document.getElementById('stage').innerHTML = pages[current].render();
  document.querySelectorAll('.nav-dot').forEach((b,i)=>b.classList.toggle('active', i===current));
  document.getElementById('progressFill').style.width = `${(current+1)/pages.length*100}%`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').style.visibility = current===pages.length-1 ? 'hidden' : 'visible';
  if(current===4) restoreBuckets();
  window.scrollTo(0,0);
}

function goTo(n){ current=n; renderPage(); }
function nextPage(){ if(current<pages.length-1){ current++; renderPage(); } }
function prevPage(){ if(current>0){ current--; renderPage(); } }

function selectChip(id){
  const chip = document.getElementById(`chip-${id}`);
  if(chip.classList.contains('placed')) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
  chip.classList.add('selected');
  selectedChipId = id;
}

function dropInto(bucket){
  if(!selectedChipId) return;
  const chip = document.getElementById(`chip-${selectedChipId}`);
  const item = HEAVY_LIGHT.find(h=>h.id===selectedChipId);
  const isCorrect = item.answer === bucket;
  chip.classList.remove('selected');
  chip.classList.add('placed', isCorrect ? 'correct' : 'wrong');
  document.getElementById(`bucket-${bucket}-items`).appendChild(chip);
  PLACEMENTS[selectedChipId] = {bucket, correct:isCorrect};
  selectedChipId = null;
}

function restoreBuckets(){
  Object.keys(PLACEMENTS).forEach(id=>{
    const p = PLACEMENTS[id];
    const chip = document.getElementById(`chip-${id}`);
    if(chip){
      chip.classList.add('placed', p.correct ? 'correct' : 'wrong');
      document.getElementById(`bucket-${p.bucket}-items`).appendChild(chip);
    }
  });
}

function showResults(){
  const allQuizItems = document.querySelectorAll('.item[data-type="mc"]');
  // Score only works reliably for the currently-rendered quiz page, so we
  // walk each quiz page's data directly instead of relying on live DOM state.
  const allQuiz = [...QUIZ_A, ...QUIZ_B, ...QUIZ_C];
  let mcqCorrect = 0;
  allQuiz.forEach(q=>{
    const stored = ANSWERS[q.id];
    if(stored === q.answer) mcqCorrect++;
  });
  const mcqTotal = allQuiz.length;

  const hlTotal = HEAVY_LIGHT.length;
  let hlCorrect = 0;
  Object.values(PLACEMENTS).forEach(p=>{ if(p.correct) hlCorrect++; });

  const totalCorrect = mcqCorrect + hlCorrect;
  const totalItems = mcqTotal + hlTotal;
  const pct = Math.round((totalCorrect/totalItems)*100);

  document.getElementById('resultsBox').innerHTML = `
    <div class="score-circle">${pct}%</div>
    <p class="score-detail">${totalCorrect} / ${totalItems} correct</p>
    <div class="score-breakdown">
      <p>Water Quiz: ${mcqCorrect} / ${mcqTotal}</p>
      <p>Heavy or Light: ${hlCorrect} / ${hlTotal}</p>
    </div>
  `;

  lastSummary = { mcqCorrect, mcqTotal, hlCorrect, hlTotal, totalCorrect, totalItems, pct };
  document.getElementById('submitBtn').style.display = 'block';
}

let lastSummary = null;

function getStudentName(){
  const v = document.getElementById('studentName').value.trim();
  return v || '(no name entered)';
}

async function sendCompletion(){
  if(!lastSummary){ return; }
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('submitStatus');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  const fd = new FormData();
  fd.append('access_key', '8af30ecf-0d8b-4e1f-aa4b-2b3b76fe8234');
  fd.append('course', 'Academy Stars 4');
  fd.append('lesson', document.title);
  fd.append('student', getStudentName());
  fd.append('timestamp', new Date().toISOString());
  fd.append('score', lastSummary.totalCorrect + ' / ' + lastSummary.totalItems + ' (' + lastSummary.pct + '%)');
  fd.append('summary', JSON.stringify(lastSummary));

  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: {'Accept': 'application/json'},
      body: fd
    });
    if(res.ok){
      btn.textContent = 'Submitted';
      status.textContent = 'Result sent to your teacher.';
    } else {
      btn.disabled = false;
      btn.textContent = 'Submit to teacher';
      status.textContent = 'Sending failed — please try again.';
    }
  } catch(err){
    btn.disabled = false;
    btn.textContent = 'Submit to teacher';
    status.textContent = 'Sending failed — please try again.';
  }
}

// Track radio answers globally since pages 2 and 3 get replaced in the DOM
// when navigating away, so we can't just query the live DOM at results time.
const ANSWERS = {};
document.addEventListener('change', function(e){
  if(e.target && e.target.type === 'radio'){
    ANSWERS[e.target.name] = e.target.value;
  }
});

buildNavDots();
renderPage();
</script>
