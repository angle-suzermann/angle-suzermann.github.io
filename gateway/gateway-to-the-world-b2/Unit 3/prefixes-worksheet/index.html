<body>

<h1>Prefixes practice worksheet</h1>
<p class="subtitle">Positive, modifying and negative prefixes &middot; B2 level</p>

<div class="instructions">
  Complete each sentence by adding a prefix (<b>mis-, over-, under-, re-, co-, un-, in-/il-/im-/ir-, dis-</b>) to the root word shown in capital letters. Type your answer in the gap, then press <b>Check my answers</b>.
</div>

<div class="restore-note" id="restoreNote" hidden>
  <span id="restoreNoteText"></span>
  <button type="button" onclick="clearProgress()">Start over (clear saved answers)</button>
</div>

<ol id="worksheet"></ol>

<div class="buttons">
  <button onclick="checkAnswers()">Check my answers</button>
  <button class="secondary" onclick="resetWorksheet()">Reset</button>
  <span class="save-indicator" id="saveIndicator"></span>
</div>
<div id="score"></div>

<script>
const items = [
  { sentence: "It is completely __________ to expect the project to be finished by tomorrow with so little staff.", root: "REALISTIC", answer: "unrealistic" },
  { sentence: "Parking your car here is strictly __________. You will get a fine.", root: "LEGAL", answer: "illegal" },
  { sentence: "I think you __________ the difficulty of the exam; it was much harder than you thought.", root: "ESTIMATED", answer: "underestimated" },
  { sentence: "His signature was completely __________. I couldn't read his name at all.", root: "LEGIBLE", answer: "illegible" },
  { sentence: "The company was accused of trying to __________ consumers about the safety of their products.", root: "LEAD", answer: "mislead" },
  { sentence: "The waiter was so __________ that we decided not to leave a tip.", root: "PLEASANT", answer: "unpleasant" },
  { sentence: "Mary is so __________ when it comes to waiting in lines; she always complains.", root: "PATIENT", answer: "impatient" },
  { sentence: "The soup was completely __________; it tasted like warm water and needed a lot of salt.", root: "COOKED", answer: "undercooked" },
  { sentence: "I have no idea why she is so __________ with her current job; she has great pay and benefits.", root: "SATISFIED", answer: "dissatisfied" },
  { sentence: "Leaving young children unattended near the pool is highly __________.", root: "RESPONSIBLE", answer: "irresponsible" },
  { sentence: "It was very __________ of Tim to arrive 30 minutes late for the job interview.", root: "POLITE", answer: "impolite" },
  { sentence: "The restaurant staff are severely __________, which explains why the service is so slow.", root: "PAID", answer: "underpaid" },
  { sentence: "Don't worry, the instructions are quite simple and __________.", root: "COMPLICATED", answer: "uncomplicated" },
  { sentence: "Don't throw away that box; we can __________ it to store your old books.", root: "USE", answer: "reuse" },
  { sentence: "His excuse for being absent sounded completely __________ to the manager.", root: "LOGICAL", answer: "illogical" },
  { sentence: "You need to __________ your essay before submitting it because there are too many typos.", root: "WRITE", answer: "rewrite" },
  { sentence: "The actors had to __________ the final scene several times until the director was happy.", root: "PLAY", answer: "replay" },
  { sentence: "The airline __________ the flight, so three passengers had to be moved to a later plane.", root: "BOOKED", answer: "overbooked" },
  { sentence: "He had to __________ with his former business rival to launch the new tech startup.", root: "OPERATE", answer: "cooperate" }
];

const list = document.getElementById('worksheet');
items.forEach((item, i) => {
  const li = document.createElement('li');
  const parts = item.sentence.split('__________');
  li.innerHTML = `${parts[0]}<input type="text" class="gap" id="gap${i}" autocomplete="off">${parts[1]} <span class="root">(${item.root})</span><span class="answer-hint" id="hint${i}"></span>`;
  list.appendChild(li);
});

function checkAnswers() {
  let correctCount = 0;
  items.forEach((item, i) => {
    const input = document.getElementById(`gap${i}`);
    const hint = document.getElementById(`hint${i}`);
    const userAnswer = input.value.trim().toLowerCase();
    const isCorrect = userAnswer === item.answer.toLowerCase();
    input.classList.remove('correct', 'incorrect');
    if (isCorrect) {
      input.classList.add('correct');
      hint.style.display = 'none';
      correctCount++;
    } else {
      input.classList.add('incorrect');
      hint.textContent = `correct answer: ${item.answer}`;
      hint.style.display = 'inline';
    }
  });
  const scoreDiv = document.getElementById('score');
  scoreDiv.style.display = 'block';
  scoreDiv.textContent = `Score: ${correctCount} / ${items.length}`;
  awardSticker(items.length ? Math.round(correctCount/items.length*100) : 0, scoreDiv);
}

function resetWorksheet() {
  items.forEach((item, i) => {
    const input = document.getElementById(`gap${i}`);
    const hint = document.getElementById(`hint${i}`);
    input.value = '';
    input.classList.remove('correct', 'incorrect');
    hint.style.display = 'none';
  });
  document.getElementById('score').style.display = 'none';
  if(typeof clearAwardSticker==='function') clearAwardSticker();
  try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){}
}

/* Progress persistence — save & resume */
const PROGRESS_KEY = 'angle_progress::gateway-to-the-world-b2-unit3-prefixes-worksheet';
let isRestoring = false;

function saveProgress(){
  if(isRestoring) return;
  try{
    const state = { savedAt: new Date().toISOString() };
    state.gaps = [...document.querySelectorAll('.gap')].map(el=>el.value);
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
    showSavedIndicator();
  } catch(e){ /* localStorage unavailable — fail silently */ }
}
let saveTimer = null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveProgress, 400); }
function showSavedIndicator(){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  el.textContent = '✓ Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  el.classList.add('show');
  clearTimeout(showSavedIndicator._t);
  showSavedIndicator._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

function restoreProgress(){
  let raw; try{ raw = localStorage.getItem(PROGRESS_KEY); } catch(e){ return; }
  if(!raw) return;
  let state; try{ state = JSON.parse(raw); } catch(e){ return; }
  isRestoring = true;

  const gaps = document.querySelectorAll('.gap');
  let hasContent = false;
  (state.gaps||[]).forEach((v,i)=>{ if(gaps[i] && v){ gaps[i].value = v; hasContent = true; } });

  if(hasContent){
    const note = document.getElementById('restoreNote');
    if(note){
      const when = state.savedAt ? new Date(state.savedAt).toLocaleString() : '';
      document.getElementById('restoreNoteText').textContent = `We found saved answers from ${when || 'an earlier session'} — they've been filled back in.`;
      note.hidden = false;
    }
  }
  isRestoring = false;
}

function clearProgress(){
  if(!confirm('This will erase all your saved answers on this device. Continue?')) return;
  try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){}
  location.reload();
}

document.addEventListener('input', e=>{ if(e.target.matches('input.gap')) scheduleSave(); });

// call restoreProgress() as the LAST line of Init, after the worksheet items have been rendered
restoreProgress();
</script>

<canvas id="inkCanvas"></canvas>
<button type="button" class="ink-toggle" id="inkToggle" title="Рисование">✏️</button>
<div class="ink-panel" id="inkPanel" hidden>
  <div class="ink-row">
    <button type="button" class="ink-tool active" data-tool="pen" title="Ручка">✏️</button>
    <button type="button" class="ink-tool" data-tool="highlighter" title="Маркер">🖍️</button>
    <button type="button" class="ink-tool" data-tool="line" title="Линия">╱</button>
    <button type="button" class="ink-tool" data-tool="arrow" title="Стрелка">➔</button>
    <button type="button" class="ink-tool" data-tool="rect" title="Прямоугольник">▭</button>
    <button type="button" class="ink-tool" data-tool="ellipse" title="Овал">◯</button>
    <button type="button" class="ink-tool" data-tool="eraser" title="Ластик">🧹</button>
  </div>
  <div class="ink-row">
    <button type="button" class="ink-color active" data-color="#2D2926" style="background:#2D2926" title="Чёрный"></button>
    <button type="button" class="ink-color" data-color="#d6342c" style="background:#d6342c" title="Красный"></button>
    <button type="button" class="ink-color" data-color="#2e6fd6" style="background:#2e6fd6" title="Синий"></button>
    <button type="button" class="ink-color" data-color="#3fa66b" style="background:#3fa66b" title="Зелёный"></button>
    <button type="button" class="ink-color" data-color="#FED500" style="background:#FED500" title="Жёлтый"></button>
    <button type="button" class="ink-color" data-color="#5E4877" style="background:#5E4877" title="Фиолетовый"></button>
    <button type="button" class="ink-color" data-color="#e8578c" style="background:#e8578c" title="Розовый"></button>
    <button type="button" class="ink-color" data-color="#1f9e94" style="background:#1f9e94" title="Бирюзовый"></button>
    <button type="button" class="ink-color" data-color="#e8762c" style="background:#e8762c" title="Оранжевый"></button>
    <button type="button" class="ink-color" data-color="#8a5a3f" style="background:#8a5a3f" title="Коричневый"></button>
  </div>
  <div class="ink-row">
    <button type="button" id="inkClear" class="ink-action">🗑️ Очистить</button>
    <button type="button" id="inkDone" class="ink-action">✓ Готово</button>
  </div>
</div>
<script>
(function(){
  var canvas = document.getElementById('inkCanvas');
  var ctx = canvas.getContext('2d');
  var toggle = document.getElementById('inkToggle');
  var panel = document.getElementById('inkPanel');
  var activeTool = 'pen';
  var activeColor = '#2D2926';
  var drawing = false;
  var current = null;
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  var hostEl = document.querySelector('.scroll-area') || document.body;
  if(canvas.parentElement !== hostEl) hostEl.appendChild(canvas);

  var STORE_KEY = 'angle_ink::' + location.pathname;
  var allStrokes = {};
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) allStrokes = JSON.parse(raw) || {};
  }catch(e){}

  function pageKey(){
    var p = document.querySelector('.page.active[data-page]');
    return p ? ('p' + p.getAttribute('data-page')) : 'single';
  }
  function strokesFor(key){
    if(!allStrokes[key]) allStrokes[key] = [];
    return allStrokes[key];
  }
  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(allStrokes)); }catch(e){}
  }

  function hostSize(){
    return { w: hostEl.scrollWidth, h: hostEl.scrollHeight };
  }

  function resizeCanvas(){
    var size = hostSize();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.style.width = size.w + 'px';
    canvas.style.height = size.h + 'px';
    canvas.width = Math.round(size.w * dpr);
    canvas.height = Math.round(size.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawInk();
  }

  function strokeStyleFor(tool){
    if(tool === 'highlighter') return { width: 16, alpha: .35, cap: 'butt', comp: 'source-over' };
    if(tool === 'eraser') return { width: 22, alpha: 1, cap: 'round', comp: 'destination-out' };
    return { width: 3, alpha: 1, cap: 'round', comp: 'source-over' };
  }

  function drawPath(s){
    if(!s.points || s.points.length < 2) return;
    var st = strokeStyleFor(s.tool);
    ctx.save();
    ctx.globalCompositeOperation = st.comp;
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = st.width;
    ctx.lineCap = st.cap;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i][0], s.points[i][1]); }
    ctx.stroke();
    ctx.restore();
  }

  function drawShape(s){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(s.tool === 'rect'){
      var x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
      var w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      ctx.strokeRect(x, y, w, h);
    } else if(s.tool === 'ellipse'){
      var cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
      var rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(rx,1), Math.max(ry,1), 0, 0, Math.PI*2);
      ctx.stroke();
    } else if(s.tool === 'line' || s.tool === 'arrow'){
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
      if(s.tool === 'arrow'){
        var ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        var ah = 12;
        ctx.beginPath();
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang - Math.PI/7), s.y2 - ah*Math.sin(ang - Math.PI/7));
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang + Math.PI/7), s.y2 - ah*Math.sin(ang + Math.PI/7));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function redrawInk(){
    var size = hostSize();
    ctx.clearRect(0, 0, size.w, size.h);
    var list = strokesFor(pageKey());
    list.forEach(function(s){
      if(s.type === 'path') drawPath(s);
      else drawShape(s);
    });
    if(current){
      if(current.type === 'path') drawPath(current);
      else drawShape(current);
    }
  }
  window.redrawInk = redrawInk;

  function pt(e){
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  function onDown(e){
    if(canvas.style.pointerEvents === 'none') return;
    drawing = true;
    var p = pt(e);
    if(activeTool === 'pen' || activeTool === 'highlighter' || activeTool === 'eraser'){
      current = { type:'path', tool:activeTool, color:activeColor, points:[p] };
    } else {
      current = { type:'shape', tool:activeTool, color:activeColor, x1:p[0], y1:p[1], x2:p[0], y2:p[1] };
    }
    redrawInk();
  }
  function onMove(e){
    if(!drawing || !current) return;
    var p = pt(e);
    if(current.type === 'path'){ current.points.push(p); }
    else { current.x2 = p[0]; current.y2 = p[1]; }
    redrawInk();
  }
  function onUp(){
    if(!drawing || !current) return;
    drawing = false;
    strokesFor(pageKey()).push(current);
    current = null;
    redrawInk();
    persist();
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  function setToolActive(on){
    canvas.style.pointerEvents = on ? 'auto' : 'none';
    toggle.classList.toggle('active', on);
    panel.hidden = !on;
  }

  toggle.addEventListener('click', function(){ setToolActive(panel.hidden); });
  document.getElementById('inkDone').addEventListener('click', function(){ setToolActive(false); });
  document.getElementById('inkClear').addEventListener('click', function(){
    if(!confirm('Стереть пометки на этой странице?')) return;
    allStrokes[pageKey()] = [];
    redrawInk();
    persist();
  });
  document.querySelectorAll('.ink-tool').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.ink-tool').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeTool = btn.dataset.tool;
    });
  });
  document.querySelectorAll('.ink-color').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.ink-color').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeColor = btn.dataset.color;
    });
  });

  var resizeTimer = null;
  function scheduleResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeCanvas, 150); }
  window.addEventListener('resize', scheduleResize);
  if(window.ResizeObserver){ new ResizeObserver(scheduleResize).observe(hostEl); }

  var pageObserver = new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      if(muts[i].attributeName === 'class'){ scheduleResize(); return; }
    }
  });
  pageObserver.observe(hostEl, { attributes:true, attributeFilter:['class'], subtree:true });

  resizeCanvas();
})();
</script>
