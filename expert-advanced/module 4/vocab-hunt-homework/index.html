<style>
      :root{
    --purple:#5E4877; --black:#2D2926; --yellow:#FED500;
    --correct:#3d7a3f; --wrong:#b23a3a;
    --neutral-bg:#f7f6f4; --neutral-card:#ffffff; --neutral-border:#e4e0e8;
    --shadow: 0 4px 14px rgba(45,41,38,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Apercu Pro','Circe','Proxima Nova','Inter',Arial,sans-serif; color:var(--black); min-height:100vh; position:relative; background:var(--black);}
  #bg-layer{position:fixed; inset:0; background-image:url('img/bg-photo.jpg'); background-size:cover; background-position:center; opacity:0.7; z-index:0;}
  #bg-tint{position:fixed; inset:0; background:linear-gradient(180deg, rgba(45,41,38,0.5) 0%, rgba(45,41,38,0.72) 45%, rgba(45,41,38,0.88) 100%); z-index:1;}

  .angle-header{position:relative; z-index:3; background:transparent; color:#ffffff; padding:22px 24px 18px;}
  .angle-header-inner{max-width:900px; margin:0 auto; display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .title-block{flex:1 1 320px; min-width:0;}
  .title-block .unit-kicker{font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin:0 0 4px;}
  .title-block h1{font-size:1.7em; font-weight:800; text-transform:uppercase; letter-spacing:.4px; margin:0;}

  .progress-strip{position:relative; z-index:3; background:var(--black); padding:12px 24px 14px;}
  .progress-inner{max-width:900px; margin:0 auto;}
  .progress-track{height:6px; background:rgba(255,255,255,0.18); overflow:hidden;}
  .progress-fill{height:100%; background:var(--yellow); width:12%; transition:width .35s ease;}
  .dots{display:flex; justify-content:space-between; margin-top:8px; gap:4px; flex-wrap:wrap;}
  .dot-btn{flex:1; min-width:64px; background:none; border:none; cursor:pointer; color:#fff; opacity:.55; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; font-family:'Apercu Pro',sans-serif; font-weight:700; padding:6px 2px; text-align:center;}
  .dot-btn.active{opacity:1; color:var(--yellow);}
  .dot-btn .num{display:block; width:20px; height:20px; line-height:20px; border-radius:50%; background:rgba(255,255,255,0.16); margin:0 auto 4px; font-size:11px; color:#fff;}
  .dot-btn.active .num{background:var(--yellow); color:var(--black);}

  #app{position:relative; z-index:2; max-width:900px; margin:0 auto; padding:26px 18px 60px;}
  .card{background:var(--neutral-card); border:1px solid var(--neutral-border); border-left:6px solid var(--purple); border-radius:0; box-shadow:var(--shadow); padding:26px 28px 28px; margin-bottom:20px;}
  h1.page-title{font-weight:800; font-size:24px; margin:0 0 10px; color:var(--black); text-transform:uppercase; letter-spacing:.3px; display:flex; align-items:center; gap:10px;}
  h1.page-title::before{content:""; display:inline-block; width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-bottom:19px solid var(--yellow); transform:rotate(90deg); margin-left:2px;}
  .kicker{text-transform:uppercase; letter-spacing:.12em; font-size:12px; color:var(--purple); font-weight:800; margin-bottom:8px;}
  .lede{color:#5a544e; font-size:15px; margin:0 0 18px; line-height:1.55;}
  .book-instruction{font-style:italic; color:#3a3530; background:#faf7f2; border-left:3px solid var(--yellow); padding:10px 14px; margin:10px 0 16px; font-size:14.5px;}
  .gap-item{border:1.5px solid var(--neutral-border); border-radius:0; padding:12px 14px; margin-bottom:12px; background:#fff;}
  .gap-item p{margin:0 0 8px; font-size:14.5px; line-height:1.55;}
  .gap-item .qnum{color:var(--purple); font-weight:800; margin-right:4px;}
  .gap-item input{width:100%; max-width:320px; border:1.5px solid var(--neutral-border); border-radius:0; padding:8px 10px; font-family:'Apercu Pro',sans-serif; font-size:14px;}
  .gap-item input.correct{border-color:var(--correct); background:#eaf5ea;}
  .gap-item input.incorrect{border-color:var(--wrong); background:#fbeaea;}
  .gap-fb{font-size:12.5px; font-weight:700; margin-top:6px; min-height:14px;}
  .btn{display:inline-block; background:var(--black); color:var(--yellow); border:none; border-radius:0; padding:13px 24px; font-weight:800; font-size:13.5px; cursor:pointer; font-family:'Apercu Pro',sans-serif; text-transform:uppercase; letter-spacing:.4px;}
  .btn.accent{background:var(--purple); color:#fff;}
  .btn.ghost{background:transparent; color:var(--black); border:1.5px solid var(--black);}
  .btn:hover{background:var(--purple); color:#fff;}
  .score-pill{display:inline-block; background:#faf7f2; border:1.5px solid var(--yellow); border-radius:0; padding:6px 16px; font-weight:800; font-size:13.5px; margin-left:8px;}
  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:14px; gap:10px; flex-wrap:wrap;}
  footer.credit{text-align:center; color:#fff; opacity:.65; font-size:12px; margin-top:10px; padding-bottom:10px;}
  .reflect-box{margin-top:16px;}
  .reflect-box label{display:block; font-weight:700; font-size:14.5px; margin-bottom:6px;}
  textarea, input[type=text]{width:100%; border:1.5px solid var(--neutral-border); border-radius:0; padding:10px 12px; font-family:'Apercu Pro',sans-serif; font-size:14px; resize:vertical; background:#fff; color:var(--black);}
  .send-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  #sendStatus{font-size:13.5px; font-weight:700; margin-top:8px;}
  .hint-toggle{font-size:12px; color:var(--purple); cursor:pointer; font-weight:700; margin-left:8px;}
  .hint-text{font-size:12.5px; color:#5a544e; display:none; margin-top:4px;}
  .hint-text.show{display:block;}

  .angle-badge{
    position:fixed; left:28px; bottom:24px; z-index:9999;
    pointer-events:none;
    display:flex; flex-direction:column; align-items:flex-start;
    transition:color 0.15s ease;
  }
  .angle-badge .wordmark{ width:130px; height:auto; display:block; }
  .angle-badge .credit{
    margin-top:4px; margin-left:3px;
    font-family:'Apercu Pro','Circe','Proxima Nova','Inter',Arial,sans-serif;
    font-weight:400; font-size:11px; letter-spacing:0.3px;
  }
  .angle-badge.on-dark{ color:#fff; }
  .angle-badge.on-light{ color:#2D2926; }
</style>

<script>
/* Each item: sentence with ___ placeholder, target word/phrase, list of acceptable answers, short definition hint */
const ITEMS = [
  {n:1, s:"After a heavy lunch, I like to ___ for about 15 minutes to recharge.", acc:["doze"], hint:"to sleep lightly for a short time"},
  {n:2, s:"I'll take a ___ in the afternoon to be more alert during my night shift.", acc:["nap"], hint:"a short sleep, especially during the day"},
  {n:3, s:"The dog was ___ with half an eye open.", acc:["snoozing"], hint:"having a short, light sleep (-ing form)"},
  {n:4, s:"I just want to go home and ___.", acc:["crash out"], hint:"go to sleep very quickly because you're exhausted"},
  {n:5, s:"The gentle rocking of the boat made me ___ to sleep.", acc:["drift off"], hint:"to gradually fall asleep"},
  {n:6, s:"I was practically ___ in that meeting.", acc:["nodding off"], hint:"briefly lowering your head from drowsiness (-ing form)"},
  {n:7, s:"I envy my husband because he's such a ___; he never hears the early morning construction noise.", acc:["heavy sleeper"], hint:"a person who sleeps deeply"},
  {n:8, s:"I must have been really tired because I managed to ___ this morning.", acc:["sleep through my alarm","sleep through the alarm"], hint:"keep sleeping without waking when the alarm rings"},
  {n:9, s:"I didn't mean to ___ during the boring lecture.", acc:["drop off"], hint:"to fall asleep suddenly / unintentionally"},
  {n:10, s:"My roommate is a ___, so I have to be very quiet when I come back late at night.", acc:["light sleeper"], hint:"a person who wakes up easily"},
  {n:11, s:"She ___ the upcoming exam, so she studied late into the night.", acc:["lost sleep over"], hint:"was unable to sleep because of worry (past tense)"},
  {n:12, s:"After a big meal, I always ___ and struggle to keep my eyes open.", acc:["feel drowsy"], hint:"feel sleepy, on the verge of falling asleep"},
  {n:13, s:"It's the weekend, so I plan to ___ and enjoy a leisurely morning.", acc:["sleep in"], hint:"sleep later than usual"},
  {n:14, s:"Even after that strong coffee, I'm still ___ and ready to work all night.", acc:["wide awake"], hint:"fully alert, not sleepy at all"},
  {n:15, s:"After a long day of hiking, I was ___ as soon as I hit the bed.", acc:["fast asleep"], hint:"in a deep sleep"},
  {n:16, s:"It's my birthday next weekend, and I'm planning to ___ with my closest friends.", acc:["have a sleepover"], hint:"spend the night at someone's house for fun"},
  {n:17, s:"The meeting turned into a ___ as team members debated the best approach to the project.", acc:["heated discussion"], hint:"an intense, passionate argument"},
  {n:18, s:"After the long hike, I ___ and didn't wake up until morning.", acc:["slept like a log"], hint:"slept very deeply and soundly (past tense)"},
  {n:19, s:"Due to their different work schedules, the couple often ___ during the week.", acc:["sleep apart"], hint:"sleep in different beds/locations"},
  {n:20, s:"I'm meeting with my boss this morning and I'm going to ___ some extra workers since we have several new clients.", acc:["make a case for"], hint:"give strong arguments supporting an idea"},
  {n:21, s:"She decided to ___ her old car because it still ran well, even if it was a bit outdated.", acc:["hang on to"], hint:"keep / retain possession of something"},
  {n:22, s:"How much money has been ___ to us?", acc:["allotted"], hint:"given as a share of what's available (past participle)"},
  {n:23, s:"Sales have ___ this year.", acc:["slumped"], hint:"fallen suddenly by a large amount (past participle)"},
  {n:24, s:"She was then ___ to the role of assistant.", acc:["relegated"], hint:"given a lower/less important position (past participle)"},
  {n:25, s:"I don't want to be a ___, so tell me if you want to be alone.", acc:["nuisance"], hint:"an annoying person / thing / situation"},
  {n:26, s:"Working irregular hours is all ___ of being a journalist.", acc:["part and parcel"], hint:"a necessary feature of something"},
  {n:27, s:"Despite all the obstacles they faced, the couple stayed together ___, proving the strength of their love.", acc:["through thick and thin"], hint:"in spite of any difficulties"},
  {n:28, s:"You can access the training materials online ___ you want to review them.", acc:["as and when"], hint:"whenever"},
  {n:29, s:"He's been smoking for ten years now, ___.", acc:["off and on","on and off"], hint:"for short periods, not regularly, over a long time"},
  {n:30, s:"___, the conference was a success, with most attendees finding the presentations informative and engaging.", acc:["by and large"], hint:"in general"},
  {n:31, s:"The patient's condition was ___ after the surgery, and the medical team closely monitored their progress.", acc:["touch and go"], hint:"the result of a situation is uncertain"}
];

function normalise(s){ return s.trim().toLowerCase().replace(/['"’]/g,'').replace(/\s+/g,' '); }
function fuzzyMatch(value, acceptableList){
  const v = normalise(value);
  if(!v) return false;
  return acceptableList.some(a => v === normalise(a));
}

/* split into 4 sets of ~8 */
const SETS = [ITEMS.slice(0,8), ITEMS.slice(8,16), ITEMS.slice(16,23), ITEMS.slice(23,31)];

let current = 0;
const PAGES = [
  {label:"Start", render: pageIntro},
  {label:"Set 1", render: ()=>pageSet(0)},
  {label:"Set 2", render: ()=>pageSet(1)},
  {label:"Set 3", render: ()=>pageSet(2)},
  {label:"Set 4", render: ()=>pageSet(3)},
  {label:"Finish", render: pageFinish}
];

function pageIntro(){
  return `
  <div class="card" data-badge-contrast="light">
    <div class="kicker">Homework · Module 4</div>
    <h1 class="page-title">Vocabulary revision</h1>
    <p class="lede">31 words and phrases from Module 4 (sleep vocabulary, phrasal verbs, and idiomatic expressions). Complete each gap with the correct word or phrase, then check your answers. Use the hint if you get stuck.</p>
    <div class="nav-row">
      <span></span>
      <button class="btn accent" onclick="goTo(1)">Start →</button>
    </div>
  </div>`;
}

function pageSet(setIdx){
  const items = SETS[setIdx];
  return `
  <div class="card" data-badge-contrast="light">
    <div class="kicker">Set ${setIdx+1} of 4</div>
    <h1 class="page-title">Complete the sentences</h1>
    <div id="setItems">
      ${items.map(it=>`
        <div class="gap-item" data-n="${it.n}" data-acc='${JSON.stringify(it.acc)}'>
          <p><span class="qnum">${it.n}.</span>${it.s.replace('___','<input type="text" data-input="'+it.n+'" autocomplete="off">')}
          <span class="hint-toggle" onclick="toggleHint(${it.n})">hint</span></p>
          <div class="hint-text" id="hint-${it.n}">${it.hint}</div>
          <div class="gap-fb" id="fb-${it.n}"></div>
        </div>`).join('')}
    </div>
    <div class="nav-row">
      <button class="btn accent" onclick="checkSet(${setIdx})">Check this set</button>
      <span class="score-pill" id="setScore-${setIdx}" style="display:none;"></span>
    </div>
    <div class="nav-row">
      <button class="btn ghost" onclick="goTo(${setIdx})">← Back</button>
      <button class="btn accent" onclick="goTo(${setIdx+2})">Next →</button>
    </div>
  </div>`;
}

function pageFinish(){
  return `
  <div class="card" data-badge-contrast="light">
    <div class="kicker">Wrap-up</div>
    <h1 class="page-title">All done!</h1>
    <p class="lede">Total score across all four sets: <b id="totalScoreText">not checked yet</b>. Make sure you've pressed "Check this set" on every page before sending.</p>
    <div class="reflect-box">
      <label>Your name</label>
      <input type="text" id="studentName" placeholder="First name / group">
    </div>
    <div class="send-row">
      <button class="btn accent" onclick="sendCompletion()">Send my results to my teacher</button>
    </div>
    <div id="sendStatus"></div>
    <div class="nav-row">
      <button class="btn ghost" onclick="goTo(4)">← Back</button>
      <span></span>
    </div>
  </div>`;
}

function renderDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = PAGES.map((p,i)=>`
    <button class="dot-btn ${i===current?'active':''}" onclick="goTo(${i})">
      <span class="num">${i+1}</span>${p.label}
    </button>`).join('');
}
function renderPage(){
  document.getElementById('stage').innerHTML = PAGES[current].render();
  document.getElementById('progressFill').style.width = ((current+1)/PAGES.length*100)+'%';
  renderDots();
  window.scrollTo(0,0);
}
function goTo(n){ current = n; renderPage(); }

window.setScores = {};

function toggleHint(n){
  document.getElementById('hint-'+n).classList.toggle('show');
}

function checkSet(setIdx){
  const items = SETS[setIdx];
  let correct = 0;
  items.forEach(it=>{
    const input = document.querySelector('[data-input="'+it.n+'"]');
    const fb = document.getElementById('fb-'+it.n);
    const ok = fuzzyMatch(input.value, it.acc);
    input.classList.toggle('correct', ok);
    input.classList.toggle('incorrect', !ok);
    if(ok){ correct++; fb.textContent = 'Correct!'; fb.style.color = 'var(--correct)'; }
    else { fb.textContent = 'Not quite — correct answer: ' + it.acc[0]; fb.style.color = 'var(--wrong)'; }
  });
  window.setScores[setIdx] = correct;
  const pill = document.getElementById('setScore-'+setIdx);
  pill.style.display = 'inline-block';
  pill.textContent = correct + ' / ' + items.length + ' correct';
}

function sendCompletion(){
  const total = Object.values(window.setScores).reduce((a,b)=>a+b,0);
  const totalItems = ITEMS.length;
  const totalText = document.getElementById('totalScoreText');
  if(totalText) totalText.textContent = total + ' / ' + totalItems;
  doSend(total, totalItems);
}

async function doSend(total, totalItems){
  const status = document.getElementById('sendStatus');
  const name = document.getElementById('studentName').value.trim();
  if(!name){
    status.style.color = 'var(--wrong)';
    status.textContent = 'Please enter your name first.';
    return;
  }
  status.style.color = 'var(--black)';
  status.textContent = 'Sending...';
  try{
    const fd = new FormData();
    fd.append('lesson', document.title);
    fd.append('student', name);
    fd.append('score', total + '/' + totalItems);
    fd.append('sets_checked', Object.keys(window.setScores).length + '/4');
    fd.append('timestamp', new Date().toISOString());
    const res = await fetch('https://formspree.io/f/mdaqrvdd', {
      method:'POST',
      headers:{'Accept':'application/json'},
      body: fd
    });
    if(res.ok){
      status.style.color = 'var(--correct)';
      status.textContent = 'Sent! Thank you, ' + name + '.';
    } else {
      status.style.color = 'var(--wrong)';
      status.textContent = 'Something went wrong — please try again or tell your teacher directly.';
    }
  } catch(err){
    status.style.color = 'var(--wrong)';
    status.textContent = 'Could not send — check your connection and try again.';
  }
}

renderPage();

(function(){
  var badge = document.querySelector('.angle-badge');
  function update(){
    var r = badge.getBoundingClientRect();
    var probeY = r.top + r.height/2;
    var zones = document.querySelectorAll('[data-badge-contrast]');
    var current = null;
    for (var i = 0; i < zones.length; i++){
      var zr = zones[i].getBoundingClientRect();
      if (probeY >= zr.top && probeY <= zr.bottom){ current = zones[i]; }
    }
    if (current){
      var mode = current.getAttribute('data-badge-contrast');
      badge.classList.toggle('on-light', mode === 'light');
      badge.classList.toggle('on-dark', mode === 'dark');
    }
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  var stage = document.getElementById('stage');
  if (stage && window.MutationObserver){
    new MutationObserver(update).observe(stage, {childList:true, subtree:true});
  }
  update();
})();
</script>
</body>
