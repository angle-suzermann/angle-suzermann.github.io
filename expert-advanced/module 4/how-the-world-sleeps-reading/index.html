<style>
      :root{
    --purple:#5E4877;
    --black:#2D2926;
    --yellow:#FED500;
    --correct:#3d7a3f;
    --wrong:#b23a3a;
    --neutral-bg:#f7f6f4;
    --neutral-card:#ffffff;
    --neutral-border:#e4e0e8;
    --shadow: 0 4px 14px rgba(45,41,38,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Apercu Pro','Circe','Proxima Nova','Inter',Arial,sans-serif;
    color:var(--black);
    min-height:100vh;
    position:relative;
    background:var(--black);
  }
  #bg-layer{
    position:fixed; inset:0;
    background-image:url('img/bg-photo.jpg');
    background-size:cover;
    background-position:center;
    opacity:0.7;
    z-index:0;
  }
  #bg-tint{
    position:fixed; inset:0;
    background:linear-gradient(180deg, rgba(45,41,38,0.5) 0%, rgba(45,41,38,0.72) 45%, rgba(45,41,38,0.88) 100%);
    z-index:1;
  }
  .angle-header{
    position:relative;
    z-index:3;
    background:transparent;
    color:#ffffff;
    padding:22px 24px 18px;
  }
  .angle-header-inner{
    max-width:980px; margin:0 auto;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .title-block{flex:1 1 320px; min-width:0;}
  .title-block .unit-kicker{font-size:12px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin:0 0 4px;}
  .title-block h1{font-size:1.7em; font-weight:800; text-transform:uppercase; letter-spacing:.4px; margin:0;}
  .progress-strip{
    position:relative; z-index:3; background:var(--black); padding:12px 24px 14px;
  }
  .progress-inner{max-width:980px; margin:0 auto;}
  .progress-track{height:6px; background:rgba(255,255,255,0.18); overflow:hidden;}
  .progress-fill{height:100%; background:var(--yellow); width:12%; transition:width .35s ease;}
  .dots{display:flex; justify-content:space-between; margin-top:8px; gap:4px; flex-wrap:wrap;}
  .dot-btn{
    flex:1; min-width:64px; background:none; border:none; cursor:pointer;
    color:#fff; opacity:.55; font-size:10.5px; letter-spacing:.04em; text-transform:uppercase;
    font-family:'Apercu Pro',sans-serif; font-weight:700; padding:6px 2px; text-align:center;
  }
  .dot-btn.active{opacity:1; color:var(--yellow);}
  .dot-btn .num{
    display:block; width:20px; height:20px; line-height:20px; border-radius:50%;
    background:rgba(255,255,255,0.16); margin:0 auto 4px; font-size:11px; color:#fff;
  }
  .dot-btn.active .num{background:var(--yellow); color:var(--black);}

  #app{position:relative; z-index:2; max-width:980px; margin:0 auto; padding:26px 18px 60px;}
  .card{
    background:var(--neutral-card);
    border:1px solid var(--neutral-border);
    border-left:6px solid var(--purple);
    border-radius:0;
    box-shadow:var(--shadow);
    padding:26px 28px 28px;
    margin-bottom:20px;
  }
  .card.soft{background:#faf7f2;}
  h1.page-title{
    font-weight:800; font-size:26px; margin:0 0 10px; color:var(--black);
    text-transform:uppercase; letter-spacing:.3px;
    display:flex; align-items:center; gap:10px;
  }
  h1.page-title::before{
    content:""; display:inline-block; width:0; height:0;
    border-left:11px solid transparent; border-right:11px solid transparent; border-bottom:19px solid var(--yellow);
    transform:rotate(90deg); margin-left:2px;
  }
  .kicker{text-transform:uppercase; letter-spacing:.12em; font-size:12px; color:var(--purple); font-weight:800; margin-bottom:8px;}
  .lede{color:#5a544e; font-size:15px; margin:0 0 18px; line-height:1.55;}
  h2.section-h{
    font-size:19px; font-weight:800; margin:26px 0 12px; color:var(--black);
    text-transform:uppercase; letter-spacing:.3px;
    border-bottom:3px solid var(--yellow); padding-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }
  h2.section-h::before{
    content:""; display:inline-block; width:0; height:0;
    border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:12px solid var(--yellow);
    transform:rotate(90deg);
  }
  h2.section-h:first-of-type{margin-top:4px;}
  p{line-height:1.6;}
  .book-instruction{
    font-style:italic; color:#3a3530; background:#faf7f2;
    border-left:3px solid var(--yellow); padding:10px 14px; margin:10px 0 16px; font-size:14.5px;
  }
  .strategy-box, .help-box{
    border:1.5px dashed var(--purple); background:#f5f1f8; border-radius:0;
    padding:12px 16px; margin:14px 0; font-size:14px;
  }
  .strategy-box .tag, .help-box .tag{
    font-weight:800; letter-spacing:.06em; color:var(--purple); font-size:12px; text-transform:uppercase; display:block; margin-bottom:4px;
  }
  .help-note{margin:6px 0; padding-left:8px; border-left:2px solid var(--purple);}
  .rate-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--neutral-border); flex-wrap:wrap;
  }
  .rate-row:last-child{border-bottom:none;}
  .rate-label{flex:1; min-width:220px; font-size:14.5px;}
  .rate-chips{display:flex; gap:6px;}
  .rate-chip{
    width:30px; height:30px; border-radius:0; border:1.5px solid var(--neutral-border);
    background:#fff; cursor:pointer; font-weight:800; font-size:13px; color:#8a8378;
    font-family:'Apercu Pro',sans-serif;
  }
  .rate-chip.selected{background:var(--purple); border-color:var(--purple); color:#fff;}
  .scale-key{font-size:12px; color:#8a8378; margin:6px 0 4px;}
  .reflect-box{margin-top:16px;}
  .reflect-box label{display:block; font-weight:700; font-size:14.5px; margin-bottom:6px;}
  textarea, input[type=text]{
    width:100%; border:1.5px solid var(--neutral-border); border-radius:0; padding:10px 12px;
    font-family:'Apercu Pro',sans-serif; font-size:14px; resize:vertical; background:#fff; color:var(--black);
  }
  .two-col{display:grid; grid-template-columns:1.15fr 1fr; gap:22px;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;}}
  .article-box{
    background:#faf7f2; padding:20px 22px; max-height:640px; overflow-y:auto; border:1px solid var(--neutral-border);
  }
  .article-title{font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--purple); font-weight:800;}
  .article-h1{font-size:24px; font-weight:800; margin:2px 0 4px; text-transform:uppercase;}
  .article-sub{font-style:italic; color:#5a544e; font-size:14px; margin-bottom:16px;}
  .sec-block{margin-bottom:16px;}
  .sec-letter{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    background:var(--black); color:var(--yellow); border-radius:0; font-weight:800; font-size:13px; margin-right:8px;
  }
  .sec-text{font-size:14.5px; line-height:1.62;}
  .match-item{border:1.5px solid var(--neutral-border); border-radius:0; padding:12px 14px; margin-bottom:10px; background:#fff;}
  .match-text{margin:0 0 8px; font-size:14.5px;}
  .match-text b{color:var(--purple); margin-right:4px;}
  .abcde-row{display:flex; gap:6px;}
  .abcde-chip{
    width:34px; height:34px; border-radius:0; border:1.5px solid var(--neutral-border); background:#fff;
    font-weight:800; cursor:pointer; color:var(--black); font-family:'Apercu Pro',sans-serif;
  }
  .abcde-chip.selected{background:var(--purple); color:#fff; border-color:var(--purple);}
  .abcde-chip.correct{background:var(--correct); color:#fff; border-color:var(--correct);}
  .abcde-chip.incorrect{background:var(--wrong); color:#fff; border-color:var(--wrong);}
  .match-feedback{font-size:12.5px; margin-top:6px; min-height:14px; font-weight:700;}
  .btn{
    display:inline-block; background:var(--black); color:var(--yellow); border:none; border-radius:0;
    padding:13px 24px; font-weight:800; font-size:13.5px; cursor:pointer; font-family:'Apercu Pro',sans-serif;
    text-transform:uppercase; letter-spacing:.4px;
  }
  .btn.accent{background:var(--purple); color:#fff;}
  .btn.ghost{background:transparent; color:var(--black); border:1.5px solid var(--black);}
  .btn:hover{background:var(--purple); color:#fff;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .score-pill{
    display:inline-block; background:#faf7f2; border:1.5px solid var(--yellow); border-radius:0;
    padding:6px 16px; font-weight:800; font-size:13.5px; margin-left:8px;
  }
  .discussion-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:700px){.discussion-grid{grid-template-columns:1fr;}}
  .disc-card{background:#faf7f2; padding:16px 18px; border:1px solid var(--neutral-border); border-top:4px solid var(--purple);}
  .disc-card h3{margin:0 0 6px; font-size:15px; text-transform:uppercase; letter-spacing:.2px; font-weight:800;}
  .disc-card p{margin:0 0 8px; font-size:13.5px; color:#5a544e;}
  .word-check-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .wc-chip{
    background:#fff; border:1.5px solid var(--purple); color:var(--purple); border-radius:0;
    padding:5px 12px; font-size:13px; font-weight:700; cursor:default;
  }
  .flash-wrap{display:flex; flex-direction:column; align-items:center; gap:16px;}
  .flip-card{width:100%; max-width:520px; height:230px; perspective:1200px; cursor:pointer;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-front, .flip-back{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:22px; box-shadow:0 6px 20px rgba(0,0,0,0.14);
  }
  .flip-front{background:var(--purple); color:#fff;}
  .flip-front .word{font-size:26px; font-weight:800; text-transform:uppercase;}
  .flip-front .pos{font-size:12px; color:var(--yellow); margin-top:8px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;}
  .flip-front .hint{position:absolute; bottom:14px; font-size:11px; opacity:.7;}
  .flip-back{background:#faf7f2; transform:rotateY(180deg); border:1.5px solid var(--yellow);}
  .flip-back .def{font-size:15px; font-weight:700; margin-bottom:8px;}
  .flip-back .ex{font-size:13.5px; font-style:italic; color:#5a544e;}
  .flash-controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center;}
  .flash-counter{font-size:13px; color:#5a544e; font-weight:700;}
  .bank{display:flex; flex-wrap:wrap; gap:8px; padding:12px; background:#faf7f2; border:1px dashed var(--neutral-border); min-height:56px; margin-bottom:16px;}
  .word-chip{
    background:#fff; border:1.5px solid var(--neutral-border); border-radius:0; padding:7px 14px; font-size:13.5px;
    cursor:pointer; font-weight:700; font-family:'Apercu Pro',sans-serif;
  }
  .word-chip.picked{border-color:var(--purple); background:#f5f1f8; color:var(--purple);}
  .buckets{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:700px){.buckets{grid-template-columns:1fr;}}
  .bucket{border:2px dashed var(--neutral-border); border-radius:0; padding:12px; min-height:120px; background:#fff;}
  .bucket h4{margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.2px; font-weight:800; color:var(--purple);}
  .bucket .chip-list{display:flex; flex-wrap:wrap; gap:6px; min-height:30px;}
  .bucket .chip-list .word-chip{cursor:default;}
  .bucket .chip-list .word-chip.right{border-color:var(--correct); background:#eaf5ea; color:var(--correct);}
  .bucket .chip-list .word-chip.wrong{border-color:var(--wrong); background:#fbeaea; color:var(--wrong);}
  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:10px; flex-wrap:wrap;}
  footer.credit{text-align:center; color:#fff; opacity:.65; font-size:12px; margin-top:10px; padding-bottom:10px;}
  ol.orig-list{padding-left:20px;}
  ol.orig-list li{margin-bottom:6px; font-size:14.5px;}
  .send-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  #sendStatus{font-size:13.5px; font-weight:700; margin-top:8px;}

  .angle-badge{
    position:fixed; left:28px; bottom:24px; z-index:9999;
    pointer-events:none;
    display:flex; flex-direction:column; align-items:flex-start;
    transition:color 0.15s ease;
  }
  .angle-badge .wordmark{ width:130px; height:auto; display:block; }
  .angle-badge .credit{
    margin-top:4px; margin-left:3px;
    font-family:'Apercu Pro','Circe','Proxima Nova','Inter',Arial,sans-serif;
    font-weight:400; font-size:11px; letter-spacing:0.3px;
  }
  .angle-badge.on-dark{ color:#fff; }
  .angle-badge.on-light{ color:#2D2926; }
</style>

body{
  margin:0;
  font-family:'Apercu Pro', system-ui, sans-serif !important;

}

}

.badge{

  color:var(--black);
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}

button{
  background:var(--primary);
  color:white;
  border:none;
  border-radius:10px;
  padding:10px 16px;
}

input, textarea{
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
}

  A:"It's a familiar ritual in many parts of the world. You climb into bed, stifling a yawn. Maybe a little reading or television to loosen you up for slumber. After a while, you nod off and sleep until an alarm clock starts ringing. The twist, however, is that this ritual doesn't apply to people currently living outside the modern Western world or even to inhabitants of Western Europe 200 years ago. Yet, as anthropologist Carol Worthman discovered, sleep scarcely figures in the literature of either cross-cultural differences or human evolution. It is generally relegated to the sidelines, treated as a biological given with little potential for variation from one part of the world to another.",
  B:"Worthman contacted researchers who had intimate knowledge of one or more traditional societies, and uncovered a wide variety of customs, none of which bore any resemblance to what many modern Western people take for granted. She says that this finding raises profound questions for the research that is being done into our biological clock. Over the past 50 years, scientists have identified periods of rapid eye movement (REM) sleep, during which intense dreams often occur. Current efforts are examining genes involved in wakefulness and sleeping and have taken strides towards treating sleep disturbances. Although investigators assume that people sleep alone or with a partner for a solid chunk of the night, most studies take place in laboratories where individuals have naps while being hooked up to brain and body monitors. However, the distinctive sleep styles of non-Western, more traditional groups may shape the biology of sleep in ways undreamed of in sleep labs, which is why Worthman was keen to initiate relevant research.",
  C:"Worthman assembled a preliminary picture of sleep practices in 10 non-Western populations. Having observed how sleepers in traditional societies recline on skins, mats, wooden platforms, the ground, or just about anything except a springy mattress, she says it brought it home to her just how odd the Western concept is of layers of bedding piled on a 'giant sleep machine'. Furthermore, unlike most Western bedrooms, sleep typically takes place in spaces that feature constant background noise emanating from other sleepers and various domestic animals. Communal space equates to safe space, invaluable in the event of a threat or emergency.",
  D:"Virtually no-one in traditional societies, including children, keeps a regular bedtime. In these worlds without artificial light, activity is limited and affects the time allotted to sleep; individuals tend to slip in and out of slumber several times during the night, rather than sleeping in a solid block of time. In traditional settings, variable sleep cycles among individuals and age groups are useful so that someone can be awake or easily roused at all times. Whereas, as Worthman points out, the natural tendency of teenagers in the Western world to go to sleep late and wake up late is seen as a nuisance or as a sign of rebellion. Equally, extreme early birds get diagnosed as sleep disordered.",
  E:"Some cultures, such as the Gebusi rainforest dwellers, are of the opinion that a person's spirit may wander off too far and fail to return if they sleep too heavily; dreaming makes this more likely. Whether or not one believes this, a quick nap may be preferable and has crucial effects on the body and mind. As an example, Balinese infants are carried about and held continuously by caregivers so that they learn to fall asleep even in hectic and noisy situations. This trains them to exhibit what the Balinese call 'fear sleep' later in life. Adults and children enter fear sleep by suddenly slumping over in a deep slumber when they or family members confront intense anxiety or an unexpected fright. They are literally scared into sleep. Conversely, it is possible that infants who sleep alone in the Western world may find it difficult to relax, fall asleep, wake up or concentrate because of the contrast between the sensory overload of the waking world and the dark quiet bedroom. Only cross-cultural studies of children's sleep and behaviour may be able to clarify such issues."

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];

}

        <p>What times do people eat, and how formal or relaxed are mealtimes in different cultures?</p>
        <textarea rows="3" placeholder="Your ideas..."></textarea>
      </div>
      <div class="disc-card">
        <h3>Family life</h3>
        <p>What role does extended family play day-to-day? How much do generations mix?</p>
        <textarea rows="3" placeholder="Your ideas..."></textarea>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn ghost" onclick="goTo(3)">← Back</button>
      <button class="btn accent" onclick="goTo(5)">Go to vocabulary →</button>
    </div>
  </div>`;
}

function pageFlashcards(){
  return `
  <div class="card" data-badge-contrast="light">
    <div class="kicker">Vocabulary retrieval</div>
    <h1 class="page-title">Flashcards</h1>
    <p class="lede">Click a card to flip it. Try to recall the meaning before you flip!</p>
    <div class="flash-wrap">
      <div class="flip-card" id="flipCard" onclick="flipCard()">
        <div class="flip-inner" id="flipInner"></div>
      </div>
      <div class="flash-controls">
        <button class="btn ghost" onclick="prevCard()">← Prev</button>
        <span class="flash-counter" id="flashCounter"></span>
        <button class="btn ghost" onclick="nextCard()">Next →</button>
        <button class="btn accent" onclick="shuffleDeck()">Shuffle</button>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn ghost" onclick="goTo(4)">← Back</button>
      <button class="btn accent" onclick="goTo(6)">Practice activity →</button>
    </div>
  </div>`;
}

function pageReinforce(){
  return `
  <div class="card" data-badge-contrast="light">
    <div class="kicker">Vocabulary reinforcement</div>
    <h1 class="page-title">Sort it out</h1>
    <p class="lede">Click a word or phrase in the bank, then click the box it belongs in. When every chip has a home, press Check.</p>
    <div class="bank" id="bank">
      ${shuffle(VOCAB.map((v,i)=>i)).map(i=>`<button class="word-chip" data-idx="${i}" data-cat="${VOCAB[i].cat}">${VOCAB[i].word}</button>`).join('')}
    </div>
    <div class="buckets" id="buckets">
      ${BUCKETS.map(b=>`
        <div class="bucket" data-cat="${b.id}">
          <h4>${b.label}</h4>
          <div class="chip-list" data-cat-list="${b.id}"></div>
        </div>`).join('')}
    </div>
    <div class="nav-row">
      <button class="btn accent" onclick="checkBuckets()">Check</button>
      <span class="score-pill" id="bucketScore" style="display:none;"></span>
    </div>
    <div class="nav-row">
      <button class="btn ghost" onclick="goTo(5)">← Back</button>
      <button class="btn accent" onclick="goTo(7)">Finish →</button>
    </div>
  </div>`;
}

function pageFinish(){
  return `
  <div class="card" data-badge-contrast="light">
    <div class="kicker">Wrap-up</div>
    <h1 class="page-title">Well done!</h1>
    <p class="lede">Before you go, tell your teacher how the lesson went.</p>
    <div class="reflect-box">
      <label>Your name</label>
      <input type="text" id="studentName" placeholder="First name / group">
    </div>
    <div class="reflect-box">
      <label>One new word or phrase you'll try to use this week</label>
      <input type="text" id="newWord" placeholder="e.g. touch and go">
    </div>
    <div class="reflect-box">
      <label>Anything you found difficult?</label>
      <textarea rows="2" id="difficulty" placeholder="Optional"></textarea>
    </div>
    <div class="send-row">
      <button class="btn accent" onclick="sendCompletion()">Send to my teacher</button>
    </div>
    <div id="sendStatus"></div>
    <div class="nav-row">
      <button class="btn ghost" onclick="goTo(6)">← Back</button>
      <span></span>
    </div>
  </div>`;
}

/* ===================== RENDER / NAV ===================== */
function renderDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = PAGES.map((p,i)=>`
    <button class="dot-btn ${i===current?'active':''}" onclick="goTo(${i})">
      <span class="num">${i+1}</span>${p.label}
    </button>`).join('');
}

function renderPage(){
  document.getElementById('stage').innerHTML = PAGES[current].render();
  document.getElementById('progressFill').style.width = ((current+1)/PAGES.length*100)+'%';
  renderDots();
  if(PAGES[current].label==="Vocabulary"){ cardIndex=0; cardFlipped=false; renderCard(); }
  window.scrollTo(0,0);
}

function goTo(n){ current = n; renderPage(); }

/* ===================== WARM-UP RATING ===================== */
document.addEventListener('click', function(e){
  const chip = e.target.closest('.rate-chip');
  if(chip){
    const row = chip.closest('.rate-chips');
    row.querySelectorAll('.rate-chip').forEach(c=>c.classList.remove('selected'));
    chip.classList.add('selected');
  }
});

/* ===================== MATCHING TASK ===================== */
document.addEventListener('click', function(e){
  const abc = e.target.closest('.abcde-chip');
  if(abc && !abc.classList.contains('correct') && !abc.classList.contains('incorrect')){
    const row = abc.closest('.abcde-row');
    row.querySelectorAll('.abcde-chip').forEach(c=>c.classList.remove('selected'));
    abc.classList.add('selected');
  }
});

function checkMatching(){
  let correctCount = 0;
  document.querySelectorAll('.match-item').forEach(item=>{
    const answer = item.dataset.answer;
    const selected = item.querySelector('.abcde-chip.selected');
    const fb = item.querySelector('.match-feedback');
    item.querySelectorAll('.abcde-chip').forEach(c=>{
      c.classList.remove('selected');
      if(c.dataset.val===answer) c.classList.add('correct');
    });
    if(selected && selected.dataset.val===answer){
      correctCount++;
      fb.textContent = 'Correct!';
      fb.style.color = 'var(--correct)';
    } else if(selected){
      selected.classList.add('incorrect');
      fb.textContent = 'Not quite — correct answer highlighted in green.';
      fb.style.color = 'var(--wrong)';
    } else {
      fb.textContent = 'No answer selected — correct answer highlighted in green.';
      fb.style.color = 'var(--wrong)';
    }
  });
  const pill = document.getElementById('matchScore');
  pill.style.display = 'inline-block';
  pill.textContent = correctCount + ' / ' + MATCHING.length + ' correct';
  window.lastReadingScore = correctCount + '/' + MATCHING.length;
}

/* ===================== FLASHCARDS ===================== */
function renderCard(){
  const idx = deckOrder[cardIndex];
  const v = VOCAB[idx];
  const inner = document.getElementById('flipInner');
  if(!inner) return;
  cardFlipped = false;
  document.getElementById('flipCard').classList.remove('flipped');
  inner.innerHTML = `
    <div class="flip-front">
      <div class="word">${v.word}</div>
      <div class="pos">${v.pos}</div>
      <div class="hint">click to flip</div>
    </div>
    <div class="flip-back">
      <div class="def">${v.def}</div>
      <div class="ex">&ldquo;${v.example}&rdquo;</div>
    </div>`;
  document.getElementById('flashCounter').textContent = 'Card ' + (cardIndex+1) + ' / ' + deckOrder.length;
}
function flipCard(){
  cardFlipped = !cardFlipped;
  document.getElementById('flipCard').classList.toggle('flipped', cardFlipped);
}
function nextCard(){ cardIndex = (cardIndex+1) % deckOrder.length; renderCard(); }
function prevCard(){ cardIndex = (cardIndex-1+deckOrder.length) % deckOrder.length; renderCard(); }
function shuffleDeck(){ deckOrder = shuffle(VOCAB.map((v,i)=>i)); cardIndex = 0; renderCard(); }

/* ===================== REINFORCEMENT (CATEGORIZE) ===================== */
document.addEventListener('click', function(e){
  const chip = e.target.closest('.word-chip');
  if(chip && chip.closest('#bank, .bucket')){
    if(chip.closest('.bucket')) return; // already placed, ignore
    document.querySelectorAll('#bank .word-chip').forEach(c=>c.classList.remove('picked'));
    chip.classList.add('picked');
    pickedChip = chip;
    return;
  }
  const bucket = e.target.closest('.bucket');
  if(bucket && pickedChip){
    bucket.querySelector('.chip-list').appendChild(pickedChip);
    pickedChip.classList.remove('picked');
    pickedChip = null;
  }
});

function checkBuckets(){
  let correct = 0, total = VOCAB.length;
  document.querySelectorAll('.bucket').forEach(b=>{
    const cat = b.dataset.cat;
    b.querySelectorAll('.chip-list .word-chip').forEach(chip=>{
      chip.classList.remove('right','wrong');
      if(chip.dataset.cat===cat){ chip.classList.add('right'); correct++; }
      else { chip.classList.add('wrong'); }
    });
  });
  const placed = document.querySelectorAll('.bucket .word-chip').length;
  const pill = document.getElementById('bucketScore');
  pill.style.display = 'inline-block';
  pill.textContent = correct + ' / ' + total + ' correct (' + placed + ' placed)';
  window.lastPracticeScore = correct + '/' + total;
}

/* ===================== SEND TO TEACHER ===================== */
async function sendCompletion(){
  const status = document.getElementById('sendStatus');
  const name = document.getElementById('studentName').value.trim();
  if(!name){
    status.style.color = 'var(--wrong)';
    status.textContent = 'Please enter your name first.';
    return;
  }
  status.style.color = 'var(--black)';
  status.textContent = 'Sending...';
  try{
    const fd = new FormData();
    fd.append('lesson', document.title);
    fd.append('student', name);
    fd.append('new_word', document.getElementById('newWord').value.trim());
    fd.append('difficulty', document.getElementById('difficulty').value.trim());
    fd.append('reading_score', window.lastReadingScore || 'not attempted');
    fd.append('practice_score', window.lastPracticeScore || 'not attempted');
    fd.append('timestamp', new Date().toISOString());
    const res = await fetch('https://formspree.io/f/mdaqrvdd', {
      method:'POST',
      headers:{'Accept':'application/json'},
      body: fd
    });
    if(res.ok){
      status.style.color = 'var(--correct)';
      status.textContent = 'Sent! Thank you, ' + name + '.';
    } else {
      status.style.color = 'var(--wrong)';
      status.textContent = 'Something went wrong — please try again or tell your teacher directly.';
    }
  } catch(err){
    status.style.color = 'var(--wrong)';
    status.textContent = 'Could not send — check your connection and try again.';
  }
}

/* ===================== INIT ===================== */
renderPage();

(function(){
  var badge = document.querySelector('.angle-badge');
  function update(){
    var r = badge.getBoundingClientRect();
    var probeY = r.top + r.height/2;
    var zones = document.querySelectorAll('[data-badge-contrast]');
    var current = null;
    for (var i = 0; i < zones.length; i++){
      var zr = zones[i].getBoundingClientRect();
      if (probeY >= zr.top && probeY <= zr.bottom){ current = zones[i]; }
    }
    if (current){
      var mode = current.getAttribute('data-badge-contrast');
      badge.classList.toggle('on-light', mode === 'light');
      badge.classList.toggle('on-dark', mode === 'dark');
    }
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  var stage = document.getElementById('stage');
  if (stage && window.MutationObserver){
    new MutationObserver(update).observe(stage, {childList:true, subtree:true});
  }
  update();
})();
</script>
