name: Публикация сайта

# Срабатывает на каждый push в main
on:
  push:
    branches: [main]
  workflow_dispatch:      # ...и по кнопке «Run workflow» на вкладке Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Если запушили дважды подряд — публикуем последнее, предыдущее отменяем.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Собрать сайт
        run: node build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
