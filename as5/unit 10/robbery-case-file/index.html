  main#stage{

  .controls{display:flex; justify-content:space-between; margin-top:16px; gap:10px;}
  .btn{
    background:#fff; color:var(--purple); border:1px solid var(--purple);

  table.retrieval{width:100%; border-collapse:collapse; margin-top:14px;}

  table.retrieval select{padding:6px 8px; border-radius:0; border:1px solid var(--border); font-family:inherit; min-width:160px;}
  table.retrieval tr.ok select{border-color:var(--green); background:#eaf6ee;}
  table.retrieval tr.bad select{border-color:var(--red); background:#fbeceb;}

  .flash-wrap{display:flex; flex-direction:column; align-items:center; margin-top:10px;}

<script>


/* ============ DATA MODEL ============ */
const CHARACTERS = [
  {name:"Inspector Fox", role:"Police officer"},
  {name:"Pat Plump", role:"Businessman"},
  {name:"Lucy Specks", role:"University student"},
  {name:"Tim Tall", role:"School student"},
  {name:"Miss Pepper", role:"Tim's teacher"},
  {name:"Dr Green", role:"Doctor"},
  {name:"Sue Snaps", role:"Photographer"}
];

const VOCAB = [
  {word:"robbery", pos:"noun", def:"the crime of stealing something from a place", example:"There was a robbery at the museum yesterday evening."},
  {word:"suspect", pos:"noun", def:"a person who might have done a crime", example:"The six visitors were all suspects."},
  {word:"valuable", pos:"adjective", def:"worth a lot of money", example:"The dinosaur egg was very valuable."},
  {word:"statement", pos:"noun", def:"what a person says happened, told to the police", example:"Inspector Fox took statements from everyone."},
  {word:"hobby", pos:"noun", def:"something you enjoy doing in your free time", example:"Drawing hieroglyphics is Pat Plump's hobby."},
  {word:"crime", pos:"noun", def:"something illegal that a person does", example:"Stealing is a crime."},
  {word:"prove", pos:"verb", def:"to show with facts that something is true", example:"Lucy could prove she bought a present."},
  {word:"lying", pos:"verb (to lie)", def:"saying something that is not true", example:"Lucy thought Dr Green was lying."},
  {word:"borrow", pos:"verb", def:"to take something and plan to give it back", example:"Sue only borrowed the egg — she didn't steal it."},
  {word:"solve", pos:"verb", def:"to find the answer to a mystery or problem", example:"Inspector Fox solved the crime."}
];

const LOCATION_ANSWERS = {
  "Pat Plump":"Egyptian Room",
  "Lucy Specks":"Museum shop",
  "Tim Tall":"Chinese Room",
  "Miss Pepper":"Chinese Room",
  "Sue Snaps":"Restoration Room",
  "Dr Green":"Dinosaur Room"
};
const ROOMS = ["Egyptian Room","Chinese Room","Restoration Room","Dinosaur Room","Museum shop"];

const REASON_ANSWERS = {
  "Pat Plump":"drawing hieroglyphics",
  "Lucy Specks":"buying a birthday present",
  "Tim Tall":"looking for his school bag",
  "Miss Pepper":"looking for Tim",
  "Sue Snaps":"looking at old paintings",
  "Dr Green":"doing research on dinosaur eggs"
};

const TF_ITEMS = [
  {text:"A valuable dinosaur egg went missing from the museum.", answer:true},
  {text:"Drawing hieroglyphics is Pat Plump's only hobby.", answer:false},
  {text:"Lucy Specks could prove why she had a big bag.", answer:true},
  {text:"Tim Tall left the museum at four o'clock with his class.", answer:false},
  {text:"Miss Pepper found Tim in the Chinese Room.", answer:true},
  {text:"The museum guard saw Sue Snaps go into the Restoration Room.", answer:true},
  {text:"The dinosaur egg was in the Dinosaur Room at five o'clock.", answer:false},
  {text:"Sue Snaps wanted to sell the egg.", answer:false},
  {text:"Sue Snaps planned to put the egg back.", answer:true},
  {text:"Lucy Specks thought Dr Green was lying.", answer:true}
];

const ORDER_EVENTS = [
  {id:1, text:"The school trip to the museum ends at four o'clock."},
  {id:2, text:"Tim Tall loses his school bag and stays behind to look for it."},
  {id:3, text:"The museum guard sees Sue Snaps go into the Restoration Room."},
  {id:4, text:"The CCTV camera records Lucy Specks leaving the shop with a big bag."},
  {id:5, text:"Miss Pepper finds Tim in the Chinese Room."},
  {id:6, text:"The dinosaur egg disappears from the Restoration Room."},
  {id:7, text:"Inspector Fox takes statements from all six suspects."},
  {id:8, text:"Sue Snaps shows everyone the egg and explains why she took it."}
];

const QUIZ = [
  {q:"Dr Green was alone in the Dinosaur Room all afternoon. Why isn't he the thief?",
   opts:["He has an alibi from the guard","The egg wasn't in the Dinosaur Room at five o'clock","He proved dinosaur eggs aren't his hobby","Lucy Specks saw him somewhere else"], correct:1},
  {q:"How did Lucy Specks prove she wasn't the thief?",
   opts:["The guard saw her the whole time","She showed a receipt from the museum shop","Miss Pepper was standing with her","She wasn't in the museum at five o'clock"], correct:1},
  {q:"Why did Sue Snaps take the egg?",
   opts:["To sell it","To give it to Dr Green for his research","To take a photograph of it for a magazine","She didn't know it was valuable"], correct:2}
];

const CLOZE_TEXT = ["Yesterday there was a", "1", "at the museum. A", "2", "dinosaur egg went missing. The guard saw Sue Snaps go into the", "3", "at", "4", ". The egg was there for cleaning. Sue Snaps", "5", "the egg because she wanted a photo for a", "6", ". In the end, Inspector Fox", "7", "the case!"];
const CLOZE_ANSWERS = {"1":"robbery","2":"valuable","3":"Restoration Room","4":"quarter to five","5":"borrowed","6":"magazine","7":"solved"};
const CLOZE_BANK = ["robbery","valuable","Restoration Room","quarter to five","borrowed","magazine","solved","crime"];

/* ============ STATE ============ */
let current = 0;
let studentName = "";
let discuss1Text = "";
let discuss2Text = "";
const results = {
  roles:{correct:0,total:CHARACTERS.length,done:false},
  location:{correct:0,total:Object.keys(LOCATION_ANSWERS).length,done:false},
  reasons:{correct:0,total:Object.keys(REASON_ANSWERS).length,done:false},
  tf:{correct:0,total:TF_ITEMS.length,done:false},
  order:{correct:0,total:ORDER_EVENTS.length,done:false},
  quiz:{correct:0,total:QUIZ.length,done:false},
  cloze:{correct:0,total:Object.keys(CLOZE_ANSWERS).length,done:false}
};
// mistakeLog: human-readable wrong-answer lines per section, for the teacher's report.
// (The "Who's Who" matching game forces the student to retry until correct, so it
// never leaves a final wrong answer to report — it is intentionally not tracked here.)
const mistakeLog = { location:[], reasons:[], tf:[], order:[], quiz:[], cloze:[] };

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.9;
  speechSynthesis.speak(u);
}

/* ============ PAGES ============ */
const pages = [
  {label:"Case File", render: renderCover},
  {label:"Who's Who", render: renderRoles},
  {label:"Key Words", render: renderVocab},
  {label:"Where?", render: renderLocations},
  {label:"Alibis", render: renderReasons},
  {label:"True/False", render: renderTF},
  {label:"Timeline", render: renderOrder},
  {label:"Solve It", render: renderSolve},
  {label:"Verdict", render: renderVerdict}
];

function renderCover(){
  return `
    <span class="stamp">CONFIDENTIAL</span>
    <h2 class="page-title">Case File 10: The Museum Robbery</h2>
    <p class="lead">A valuable dinosaur egg has disappeared from the museum. Inspector Fox questioned six visitors who were all in the building at five o'clock yesterday. Read the play script "The Robbery" (Student's Book, pages 122–123) again, then work through this case file to find and prove who really took the egg.</p>
    <div class="card-box">
      <h3 style="margin-top:0;">Your mission</h3>
      <ul style="line-height:1.7; font-size:.92rem;">
        <li>Match each suspect to their job and their location</li>
        <li>Learn the key crime vocabulary</li>
        <li>Scan the text for exact details — true or false?</li>
        <li>Put the story events in order</li>
        <li>Solve the case and write your verdict</li>
      </ul>
    </div>
    <p class="lead">Click <b>Next</b> to open the file.</p>
  `;
}

function renderRoles(){
  const left = CHARACTERS.map((c,i)=>`<button class="match" data-role="left" data-id="${i}" onclick="pickRole(this)">${c.name}</button>`).join("");
  const shuffled = shuffle(CHARACTERS.map((c,i)=>({...c,id:i})));
  const right = shuffled.map(c=>`<button class="match" data-role="right" data-id="${c.id}" onclick="pickRole(this)">${c.role}</button>`).join("");
  return `
    <h2 class="page-title">1. Who's Who?</h2>
    <p class="lead">Match each character to their job in the story. Click a name, then click their job.</p>
    <div class="match-cols">
      <div class="match-col"><h4>Character</h4>${left}</div>
      <div class="match-col"><h4>Job</h4>${right}</div>
    </div>
    <div class="hint" id="rolesHint"></div>
  `;
}
let firstRolePick = null;
function pickRole(el){
  if(el.classList.contains('matched-correct')) return;
  if(!firstRolePick){ firstRolePick = el; el.classList.add('selected'); return; }
  if(firstRolePick === el){ el.classList.remove('selected'); firstRolePick=null; return; }
  const isMatch = firstRolePick.dataset.id === el.dataset.id && firstRolePick.dataset.role !== el.dataset.role;
  if(isMatch){
    firstRolePick.classList.remove('selected'); firstRolePick.classList.add('matched-correct');
    el.classList.add('matched-correct');
    if(!firstRolePick.dataset.counted){ firstRolePick.dataset.counted="1"; results.roles.correct++; updateScorePill(); }
  } else {
    el.classList.add('wrong-flash'); firstRolePick.classList.add('wrong-flash');
    setTimeout(()=>{ el.classList.remove('wrong-flash'); firstRolePick.classList.remove('selected','wrong-flash'); },550);
  }
  firstRolePick = null;
}

let deckIndex = 0;
function renderVocab(){
  const v = VOCAB[deckIndex];
  return `
    <h2 class="page-title">2. Key Words for the Case</h2>
    <p class="lead">Click the card to flip it. Use the arrows to go through all ${VOCAB.length} words.</p>
    <div class="flash-wrap">
      <div class="flip-card" id="flipCard" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-front"><div class="w">${v.word}</div><div style="font-size:.75rem; margin-top:8px; opacity:.8;">click to flip</div></div>

}
function changeCard(dir){
  deckIndex = (deckIndex + dir + VOCAB.length) % VOCAB.length;

}

function renderLocations(){
  const rows = Object.keys(LOCATION_ANSWERS).map((name,i)=>`
    <tr id="locRow${i}">
      <td><b>${name}</b></td>
      <td>
        <select id="locSel${i}" data-name="${name}">
          <option value="">-- choose a room --</option>
          ${ROOMS.map(r=>`<option value="${r}">${r}</option>`).join("")}
        </select>
      </td>
    </tr>`).join("");
  return `
    <h2 class="page-title">3. Where Were They at Five O'Clock?</h2>
    <p class="lead">Scan the play script again. Choose the correct room for each suspect.</p>
    <table class="retrieval">
      <tr><th>Suspect</th><th>Room at 5 o'clock</th></tr>
      ${rows}
    </table>
    <div class="controls" style="margin-top:16px;">
      <span></span>
      <button class="btn gold" onclick="checkLocations()">Check answers</button>
    </div>
  `;
}
function checkLocations(){
  let correctNow = 0;
  let localMistakes = [];
  Object.keys(LOCATION_ANSWERS).forEach((name,i)=>{
    const sel = document.getElementById('locSel'+i);
    const row = document.getElementById('locRow'+i);
    const ok = sel.value === LOCATION_ANSWERS[name];
    row.classList.toggle('ok', ok);
    row.classList.toggle('bad', !ok);
    if(ok) correctNow++;
    else localMistakes.push('Where Were They? — ' + name + ' → answered "' + (sel.value || '(blank)') + '", correct "' + LOCATION_ANSWERS[name] + '"');
  });
  results.location.correct = correctNow;
  results.location.done = true;
  mistakeLog.location = localMistakes;
  updateScorePill();
}

let selectedReasonToken = null;
function renderReasons(){
  const bank = shuffle(Object.values(REASON_ANSWERS));
  const rows = Object.keys(REASON_ANSWERS).map((name,i)=>`
    <div class="fill-row">
      <b>${name}:</b>
      <span class="blank" id="reasonBlank${i}" data-name="${name}" onclick="placeReason(${i})">click a reason below</span>
    </div>`).join("");
  const tokens = bank.map((phrase,i)=>`<button class="token" id="reasonToken${i}" onclick="selectReasonToken(this,'${phrase}')">${phrase}</button>`).join("");
  return `
    <h2 class="page-title">4. What Was Their Reason?</h2>
    <p class="lead">Click a phrase from the word bank, then click the correct suspect's blank to place it.</p>
    ${rows}
    <div class="bank">${tokens}</div>
    <div class="controls" style="margin-top:6px;">
      <span></span>
      <button class="btn gold" onclick="checkReasons()">Check answers</button>
    </div>
  `;
}
function selectReasonToken(el, phrase){
  if(el.classList.contains('used')) return;
  if(selectedReasonToken) selectedReasonToken.el.classList.remove('selected');
  selectedReasonToken = {el, phrase};
  el.classList.add('selected');
}
function placeReason(i){
  if(!selectedReasonToken) return;
  const blank = document.getElementById('reasonBlank'+i);
  blank.textContent = selectedReasonToken.phrase;
  blank.classList.add('filled');
  blank.dataset.filled = selectedReasonToken.phrase;
  selectedReasonToken.el.classList.add('used');
  selectedReasonToken.el.classList.remove('selected');
  selectedReasonToken = null;
}
function checkReasons(){
  let correctNow = 0;
  let localMistakes = [];
  Object.keys(REASON_ANSWERS).forEach((name,i)=>{
    const blank = document.getElementById('reasonBlank'+i);
    const filled = blank.dataset.filled || "";
    const ok = filled.toLowerCase() === REASON_ANSWERS[name].toLowerCase();
    blank.classList.toggle('ok', ok);
    blank.classList.toggle('bad', !ok);
    if(ok) correctNow++;
    else localMistakes.push('Alibis — ' + name + ' → answered "' + (filled || '(blank)') + '", correct "' + REASON_ANSWERS[name] + '"');
  });
  results.reasons.correct = correctNow;
  results.reasons.done = true;
  mistakeLog.reasons = localMistakes;
  updateScorePill();
}

function renderTF(){
  const items = TF_ITEMS.map((item,i)=>`
    <div class="qbox">
      <p class="prompt">${i+1}. ${item.text}</p>
      <div class="opts" data-correct="${item.answer}" id="tf${i}">
        <button class="opt" onclick="answerTF(${i}, true)">True</button>
        <button class="opt" onclick="answerTF(${i}, false)">False</button>
      </div>
    </div>`).join("");
  return `
    <h2 class="page-title">5. Scan for Details: True or False</h2>
    <p class="lead">Look back at the script for exact details. Click True or False for each sentence.</p>
    ${items}
  `;
}
function answerTF(i, chosen){
  const box = document.getElementById('tf'+i);
  if(box.dataset.done) return;
  box.dataset.done = "1";
  const correctAns = box.dataset.correct === "true";
  const btns = box.querySelectorAll('.opt');
  btns.forEach(b=>{
    const isTrueBtn = b.textContent.trim() === "True";
    if(isTrueBtn === correctAns) b.classList.add('correct');
    else if(isTrueBtn === chosen) b.classList.add('wrong');
  });
  if(chosen === correctAns){ results.tf.correct++; }
  else {
    mistakeLog.tf.push('True/False #' + (i+1) + ' "' + TF_ITEMS[i].text + '" → answered "' + (chosen ? 'True' : 'False') + '", correct "' + (correctAns ? 'True' : 'False') + '"');
  }
  results.tf.done = true;
  updateScorePill();
}

let orderClicks = [];
let orderShuffled = [];
function renderOrder(){
  orderClicks = [];
  orderShuffled = shuffle(ORDER_EVENTS);
  const items = orderShuffled.map(ev=>`
    <div class="order-item" id="orderItem${ev.id}" data-id="${ev.id}" onclick="orderClick(${ev.id})">
      <span class="order-num" id="orderNum${ev.id}"></span>
      <span>${ev.text}</span>
    </div>`).join("");
  return `
    <h2 class="page-title">6. Put the Story in Order</h2>
    <p class="lead">Click the events in the order they happened, from first to last.</p>
    <div class="order-list">${items}</div>
    <div class="controls" style="margin-top:16px;">
      <button class="btn small" onclick="resetOrder()">Reset</button>
      <button class="btn gold" onclick="checkOrder()">Check order</button>
    </div>
  `;
}
function orderClick(id){
  if(orderClicks.includes(id)) return;
  orderClicks.push(id);
  document.getElementById('orderItem'+id).classList.add('picked');
  document.getElementById('orderNum'+id).textContent = orderClicks.length;
}
function resetOrder(){
  orderClicks = [];
  ORDER_EVENTS.forEach(ev=>{
    const item = document.getElementById('orderItem'+ev.id);
    const num = document.getElementById('orderNum'+ev.id);
    if(item){ item.classList.remove('picked','correct-pos','wrong-pos'); }
    if(num){ num.textContent = ""; }
  });
}
function checkOrder(){
  if(orderClicks.length < ORDER_EVENTS.length) return;
  let correctNow = 0;
  let localMistakes = [];
  orderClicks.forEach((id, idx)=>{
    const item = document.getElementById('orderItem'+id);
    const ok = id === (idx+1);
    item.classList.toggle('correct-pos', ok);
    item.classList.toggle('wrong-pos', !ok);
    if(ok) correctNow++;
    else {
      const correctEvent = ORDER_EVENTS.find(ev=>ev.id === (idx+1));
      const chosenEvent = ORDER_EVENTS.find(ev=>ev.id === id);
      localMistakes.push('Timeline position ' + (idx+1) + ' → placed "' + (chosenEvent ? chosenEvent.text : id) + '", correct "' + (correctEvent ? correctEvent.text : (idx+1)) + '"');
    }
  });
  results.order.correct = correctNow;
  results.order.done = true;
  mistakeLog.order = localMistakes;
  updateScorePill();
}

function renderSolve(){
  const quizHtml = QUIZ.map((item,i)=>`
    <div class="qbox">
      <p class="prompt">${i+1}. ${item.q}</p>
      <div class="opts" id="quiz${i}" data-correct="${item.correct}">
        ${item.opts.map((o,oi)=>`<button class="opt" onclick="answerQuiz(${i},${oi})">${o}</button>`).join("")}
      </div>
    </div>`).join("");

  let blankCount = 0;
  const paragraph = CLOZE_TEXT.map(part=>{
    if(CLOZE_ANSWERS[part]){
      blankCount++;
      return `<span class="blank" id="clozeBlank${part}" data-key="${part}" onclick="placeCloze('${part}')">___(${part})___</span>`;
    }
    return part;
  }).join(" ");
  const bank = shuffle(CLOZE_BANK).map((w,i)=>`<button class="token" id="clozeToken${i}" onclick="selectClozeToken(this,'${w}')">${w}</button>`).join("");

  return `

    </div>

      <span></span>
      <button class="btn gold" onclick="checkSolve()">Check my case</button>
    </div>
  `;
}
function answerQuiz(i, chosenIdx){
  const box = document.getElementById('quiz'+i);
  if(box.dataset.done) return;
  box.dataset.done = "1";
  const correctIdx = Number(box.dataset.correct);
  const btns = box.querySelectorAll('.opt');
  btns.forEach((b,bi)=>{
    if(bi === correctIdx) b.classList.add('correct');
    else if(bi === chosenIdx) b.classList.add('wrong');
  });
  if(chosenIdx === correctIdx){ results.quiz.correct++; }
  else {
    mistakeLog.quiz.push('Solve It Q' + (i+1) + ' "' + QUIZ[i].q + '" → answered "' + QUIZ[i].opts[chosenIdx] + '", correct "' + QUIZ[i].opts[correctIdx] + '"');
  }
  results.quiz.done = true;
  updateScorePill();
}
function selectClozeToken(el, word){
  if(el.classList.contains('used')) return;
  if(selectedClozeToken) selectedClozeToken.el.classList.remove('selected');
  selectedClozeToken = {el, word};
  el.classList.add('selected');
}
function placeCloze(key){
  if(!selectedClozeToken) return;
  const blank = document.getElementById('clozeBlank'+key);
  blank.textContent = selectedClozeToken.word;
  blank.classList.add('filled');
  blank.dataset.filled = selectedClozeToken.word;
  selectedClozeToken.el.classList.add('used');
  selectedClozeToken.el.classList.remove('selected');
  selectedClozeToken = null;
}
function checkSolve(){
  let correctNow = 0;

  Object.keys(CLOZE_ANSWERS).forEach(key=>{
    const blank = document.getElementById('clozeBlank'+key);
    const filled = blank.dataset.filled || "";
    const ok = filled.toLowerCase() === CLOZE_ANSWERS[key].toLowerCase();
    blank.classList.toggle('ok', ok);
    blank.classList.toggle('bad', !ok);
    if(ok) correctNow++;
    else localMistakes.push('Final report blank (' + key + ') → answered "' + (filled || '(blank)') + '", correct "' + CLOZE_ANSWERS[key] + '"');
  });
  results.cloze.correct = correctNow;
  results.cloze.done = true;
  mistakeLog.cloze = localMistakes;
  updateScorePill();
}

}
function saveDiscussion(){
  discuss1Text = document.getElementById('discuss1').value;
  discuss2Text = document.getElementById('discuss2').value;
  const d1 = discuss1Text.trim();
  const d2 = discuss2Text.trim();
  const note = document.getElementById('savedNote');
  if(d1.split(/\s+/).length >= 4 && d2.split(/\s+/).length >= 4){
    note.textContent = "✓ Nice work, detective! Your answers are saved on this page.";
  } else {
    note.textContent = "Try to write a little more — at least a full sentence for each question.";
  }
  note.style.display = "block";
}

async function submitCase(){
  const nameInput = document.getElementById('studentName');
  const name = (nameInput ? nameInput.value : studentName).trim();
  const note = document.getElementById('submitNote');
  note.style.display = "block";
  if(!name){
    note.style.color = "var(--red)";
    note.textContent = "Please type your name above before submitting.";
    if(nameInput) nameInput.focus();
    return;
  }
  studentName = name;
  if(document.getElementById('discuss1')) discuss1Text = document.getElementById('discuss1').value;
  if(document.getElementById('discuss2')) discuss2Text = document.getElementById('discuss2').value;

  let totalCorrect = 0, totalPossible = 0;
  const breakdown = {};
  Object.entries(results).forEach(([key,val])=>{
    totalCorrect += val.correct; totalPossible += val.total;
    breakdown[key] = `${val.correct}/${val.total}`;
  });
  const pct = totalPossible ? Math.round((totalCorrect/totalPossible)*100) : 0;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = "Submitting...";
  note.style.color = "var(--muted)";
  note.textContent = "Sending your case file...";

  const fd = new FormData();
  fd.append('access_key', '8af30ecf-0d8b-4e1f-aa4b-2b3b76fe8234');
  fd.append('course', 'Academy Stars 5');
  fd.append('subject', ('Academy Stars 5 — ' + document.title) + ' — ' + (name));
  fd.append('name', name);
  fd.append('lesson', document.title);
  fd.append('timestamp', new Date().toISOString());
  fd.append('score_percent', pct + '%');
  fd.append('result_tier', getResultTier(pct).label);
  fd.append('score_breakdown', JSON.stringify(breakdown));
  fd.append('discussion_1', discuss1Text.trim());
  fd.append('discussion_2', discuss2Text.trim());

  const allMistakes = [].concat(
    mistakeLog.location, mistakeLog.reasons, mistakeLog.tf,
    mistakeLog.order, mistakeLog.quiz, mistakeLog.cloze
  );
  fd.append('mistakes', allMistakes.length ? allMistakes.join('\n') : 'No mistakes — all items correct.');

  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method:'POST',
      headers:{'Accept':'application/json'},
      body: fd
    });
    if(res.ok){
      note.style.color = "var(--green)";
      note.textContent = "✓ Sent! Your case file has been submitted to your teacher.";
      btn.textContent = "Submitted ✓";
    } else {
      throw new Error('Server responded with an error');
    }
  } catch(err){
    note.style.color = "var(--red)";
    note.textContent = "Something went wrong sending your case file. Check your internet connection and try again.";
    btn.disabled = false;
    btn.textContent = "Submit case file to teacher";
  }
}

/* ============ NAVIGATION ============ */
function buildNav(){
  const nav = document.getElementById('stagenav');
  nav.innerHTML = pages.map((p,i)=>`<button id="navbtn${i}" onclick="goToPage(${i})">${i+1}. ${p.label}</button>`).join("");
}
function goToPage(n){
  current = n;
  document.getElementById('stage').innerHTML = pages[current].render();
  document.querySelectorAll('#stagenav button').forEach((b,i)=>b.classList.toggle('active', i===current));
  document.getElementById('progressFill').style.width = `${((current+1)/pages.length)*100}%`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').textContent = current===pages.length-1 ? "Finish" : "Next →";
  const bigScore = document.querySelector('.final-score .big');
  if(bigScore){ renderResultSticker(parseInt(bigScore.textContent, 10) || 0); }
  window.scrollTo(0,0);
}
function nextPage(){ if(current < pages.length-1) goToPage(current+1); }
function prevPage(){ if(current > 0) goToPage(current-1); }

function updateScorePill(){
  let c=0,t=0;
  Object.values(results).forEach(r=>{ c+=r.correct; t+=r.total; });
  document.getElementById('scorePill').textContent = `${c} / ${t} clues found`;
}

buildNav();
goToPage(0);
updateScorePill();
