<script>


/* ============ DATA ============ */

const VOCAB = {
  payment: { pos:'noun', def:'money that you give someone for something you buy or owe.', example:"I don't have enough money to make this payment." },
  agreement: { pos:'noun', def:'when two or more people decide the same thing.', example:'We made an agreement to work together.' },
  arrangement: { pos:'noun', def:'a plan, or the way things are organised.', example:'The flower arrangement looks lovely on the table.' },
  excitement: { pos:'noun', def:'a strong feeling of happiness and energy.', example:'There was a lot of excitement when their team won.' },
  equipment: { pos:'noun', def:'the things you need for an activity.', example:'Safety equipment is expensive but necessary.' },
  statement: { pos:'noun', def:'something a person says or writes, especially officially.', example:'Inspector Fox took a statement from every suspect.' },
  movement: { pos:'noun', def:'the act of moving, or a physical action.', example:"I've broken my leg, so every little movement hurts!" },
  announcement: { pos:'noun', def:'a public statement that tells people about something.', example:'There was an announcement that the trains were delayed.' },
  advertisement: { pos:'noun', def:'a notice, picture or film that tells people about a product.', example:'We saw an advertisement for the new museum exhibition.' },
  entertainment: { pos:'noun', def:'things that amuse or interest people.', example:'There was a lot of entertainment at the football game.' },
  improvement: { pos:'noun', def:'the act of making something better.', example:'Her spelling has shown great improvement this term.' },
  achievement: { pos:'noun', def:'something you succeed in doing, usually after effort.', example:'Solving the mystery was a big achievement for Inspector Fox.' },
  disagreement: { pos:'noun', def:'when people do not have the same opinion.', example:'They had a disagreement about who stole the egg.' }
};

const ACT1_ITEMS = [
  { verb:'solve',    takesMent:false, noun:null },
  { verb:'agree',    takesMent:true,  noun:'agreement' },
  { verb:'arrange',  takesMent:true,  noun:'arrangement' },
  { verb:'perform',  takesMent:false, noun:null },
  { verb:'excite',   takesMent:true,  noun:'excitement' },
  { verb:'equip',    takesMent:true,  noun:'equipment' },
  { verb:'believe',  takesMent:false, noun:null },
  { verb:'research', takesMent:false, noun:null }
];

const ACT2_WORDS = ['believe','disagree','achieve','research','solve','perform','announce','state'];
const ACT2_CORRECT = new Set(['disagree','achieve','announce','state']);

const ACT3_STRING = "advertiseagreearrangeentertainequipexcitemovepay";
const ACT3_WORDS = ['advertise','agree','arrange','entertain','equip','excite','move','pay'];
const ACT3_BOUNDARIES = [9,14,21,30,35,41,45];

const ACT4_ITEMS = [
  { parts:["I need to ", {given:'pay'}, " for my books, but I don't have enough money to make this ", {blank:'payment', id:'a4-0'}, "."] },
  { parts:["Football games ", {blank:'entertain', id:'a4-1'}, " fans. There was a lot of ", {blank:'entertainment', id:'a4-2'}, " at the game."] },
  { parts:["We made an ", {blank:'arrangement', id:'a4-3'}, " to work together. She thinks sugar is healthy, but I don't ", {blank:'agree', id:'a4-4'}, "."] },

  { parts:["Safety ", {blank:'equipment', id:'a4-7'}, " is expensive but necessary. However, the school won't ", {blank:'equip', id:'a4-8'}, " the team with new shoes. Everyone has to buy their own."] }

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function normalise(s){ return (s||'').trim().toLowerCase(); }
function speak(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; u.rate = 0.92;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

function initAct1(){
  ACT1_ITEMS.forEach((it,i)=>{
    const p = state.act1.picks[i];

    document.getElementById(`a1-cross-${i}`).classList.toggle('active', p===false);
    const input = document.getElementById(`a1-input-${i}`);

    input.oninput = ()=>{ state.act1['val'+i] = input.value; };
  });

function a1Select(i,isYes){
  if (state.act1.checked) return;
  state.act1.picks[i] = isYes;
  const input = document.getElementById(`a1-input-${i}`);
  document.getElementById(`a1-tick-${i}`).classList.toggle('active', isYes===true);
  document.getElementById(`a1-cross-${i}`).classList.toggle('active', isYes===false);
  input.disabled = !isYes;
  if (!isYes){ input.value=''; state.act1['val'+i]=''; }
}
function checkAct1(){
  let score = 0;
  let localMistakes = [];
  ACT1_ITEMS.forEach((it,i)=>{
    const pick = state.act1.picks[i];
    const rawVal = document.getElementById(`a1-input-${i}`).value;
    const val = normalise(rawVal);
    let ok;
    if (it.takesMent){ ok = (pick===true) && (val === it.noun); }
    else { ok = (pick===false); }
    if (ok) score++;
    document.getElementById(`a1-row-${i}`).classList.toggle('correct', ok);
    document.getElementById(`a1-row-${i}`).classList.toggle('incorrect', !ok);
    document.getElementById(`a1-input-${i}`).classList.toggle('correct', ok && it.takesMent);
    document.getElementById(`a1-input-${i}`).classList.toggle('incorrect', !ok && it.takesMent && pick===true);
    if (!ok){
      const userDesc = pick===true ? ('✓ ' + (rawVal.trim() || '(blank)')) : pick===false ? '✗' : '(not answered)';
      const correctDesc = it.takesMent ? ('✓ ' + it.noun) : '✗ (does not take -ment)';
      localMistakes.push('Evidence 1 — "' + it.verb + '" → answered "' + userDesc + '", correct "' + correctDesc + '"');
    }
  });
  state.act1.checked = true;
  state.act1.score = score;
  mistakeLog.act1 = localMistakes;
  showAct1Result();
}
function showAct1Result(){

  el.textContent = `Score: ${state.act1.score} / ${ACT1_ITEMS.length}`;

}

}
function initAct3(){
  ACT3_BOUNDARIES.forEach(()=>{});
  for (let pos of state.act3.cuts){
    const g = document.getElementById(`a3-gap-${pos}`);
    if (g) g.classList.add('cut');
  }
  if (state.act3.checked) paintAct3Result();
}
function a3Toggle(pos){
  if (state.act3.checked) return;
  const g = document.getElementById(`a3-gap-${pos}`);
  if (state.act3.cuts.has(pos)){ state.act3.cuts.delete(pos); g.classList.remove('cut'); }
  else { state.act3.cuts.add(pos); g.classList.add('cut'); }
}
function resetAct3(){
  if (state.act3.checked) return;
  state.act3.cuts.clear();
  document.querySelectorAll('.gap').forEach(g=>g.classList.remove('cut'));
}
function checkAct3(){
  let score = 0;
  let localMistakes = [];
  const correctSet = new Set(ACT3_BOUNDARIES);
  correctSet.forEach(pos=>{ if (state.act3.cuts.has(pos)) score++; });
  for (let i=1;i<ACT3_STRING.length;i++){
    const has = state.act3.cuts.has(i);
    const should = correctSet.has(i);
    if (has !== should){
      const context = ACT3_STRING.slice(Math.max(0,i-4), i) + '‸' + ACT3_STRING.slice(i, i+4);
      const userDesc = has ? 'cut placed here' : 'no cut placed here';
      const correctDesc = should ? 'a word boundary belongs here' : 'no word boundary here';
      localMistakes.push('Evidence 3 — near "...' + context + '..." → answered "' + userDesc + '", correct "' + correctDesc + '"');
    }
  }
  state.act3.checked = true;
  state.act3.score = score;
  mistakeLog.act3 = localMistakes;
  paintAct3Result();
}
function paintAct3Result(){
  const correctSet = new Set(ACT3_BOUNDARIES);
  for (let i=1;i<ACT3_STRING.length;i++){
    const g = document.getElementById(`a3-gap-${i}`);
    if (!g) continue;
    g.classList.remove('cut');
    const has = state.act3.cuts.has(i);
    const should = correctSet.has(i);
    if (has && should) g.classList.add('g-correct');
    else if (has && !should) g.classList.add('g-wrong');
    else if (!has && should) g.classList.add('g-missed');
  }
  const el = document.getElementById('a3-result');
  el.textContent = `Score: ${state.act3.score} / ${ACT3_BOUNDARIES.length}`;
  el.classList.add('show');
}

function pageSort(){
  return `
  <div class="sheet">
    <span class="tag">Extra &middot; Reinforcement</span>
    <div class="sheet-head"><h2>Sort the clues</h2></div>
    <p class="instructions">All the verbs from this case are mixed up. Click a verb, then click the correct box to sort it.</p>
    <div class="sort-area">
      <div class="sort-bank" id="sort-bank"></div>
      <div class="buckets">
        <div class="bucket yes"><h4>&#10003; Takes -ment</h4><div class="bucket-body" id="bucket-yes" onclick="sortDrop('yes')"></div></div>
        <div class="bucket no"><h4>&#10007; No -ment</h4><div class="bucket-body" id="bucket-no" onclick="sortDrop('no')"></div></div>
      </div>
    </div>
    <div class="check-row">
      <button class="btn-check" onclick="checkSort()">Check my sorting</button>
      <button class="btn-secondary" onclick="resetSort()">Reset</button>
      <span class="result-pill" id="sort-result"></span>
    </div>
  </div>`;
}
function initSort(){ renderSort(); }
function renderSort(){
  const bank = document.getElementById('sort-bank');
  const yesB = document.getElementById('bucket-yes');
  const noB = document.getElementById('bucket-no');
  bank.innerHTML=''; yesB.innerHTML=''; noB.innerHTML='';
  SORT_VERBS.forEach(item=>{
    const chipHtml = `<span class="sort-chip" data-v="${item.v}" onclick="sortSelect(event,'${item.v}')">${item.v}</span>`;
    const place = state.sort.placement[item.v];
    if (!place) bank.insertAdjacentHTML('beforeend', chipHtml);
    else if (place==='yes') yesB.insertAdjacentHTML('beforeend', chipHtml);
    else noB.insertAdjacentHTML('beforeend', chipHtml);
  });
  document.querySelectorAll('.sort-chip').forEach(c=>{
    c.classList.toggle('selected', c.dataset.v === state.sort.selected);
    if (state.sort.checked){
      const item = SORT_VERBS.find(x=>x.v===c.dataset.v);
      const correctZone = item.yes ? 'yes' : 'no';
      const ok = state.sort.placement[c.dataset.v] === correctZone;
      c.classList.remove('right','wrong');
      if (state.sort.placement[c.dataset.v]) c.classList.add(ok ? 'right' : 'wrong');
    }
  });
}
function sortSelect(ev, v){
  ev.stopPropagation();
  if (state.sort.checked) return;
  state.sort.selected = (state.sort.selected===v) ? null : v;
  renderSort();
}
function sortDrop(zone){
  if (state.sort.checked || !state.sort.selected) return;
  state.sort.placement[state.sort.selected] = zone;
  state.sort.selected = null;
  renderSort();
}
function resetSort(){
  if (state.sort.checked) return;
  state.sort.placement = {}; state.sort.selected = null;
  renderSort();
}
function checkSort(){
  let score = 0;
  let localMistakes = [];
  SORT_VERBS.forEach(item=>{
    const zone = state.sort.placement[item.v];
    const correctZone = item.yes ? 'yes' : 'no';
    if (zone === correctZone) score++;
    else {
      const zoneLabel = z => z === 'yes' ? 'Takes -ment' : z === 'no' ? 'No -ment' : '(not sorted)';
      localMistakes.push('Sort the clues — "' + item.v + '" → answered "' + zoneLabel(zone) + '", correct "' + zoneLabel(correctZone) + '"');
    }
  });
  state.sort.checked = true;
  state.sort.score = score;
  mistakeLog.sort = localMistakes;
  renderSort();
  const el = document.getElementById('sort-result');
  el.textContent = `Score: ${score} / ${SORT_VERBS.length}`;
  el.classList.add('show');
}

    ['Evidence 3 — dividing words', state.act3.score, ACT3_BOUNDARIES.length, state.act3.checked],
    ['Evidence 4 — sentence completion', state.act4.score, state.act4.total||9, state.act4.checked],
    ['Sort the clues', state.sort.score, SORT_VERBS.length, state.sort.checked]
  ];
  const totalScore = rows.reduce((s,r)=>s+(r[3]?r[1]:0),0);
  const totalMax = rows.reduce((s,r)=>s+r[2],0);
  const pct = totalMax ? Math.round(totalScore/totalMax*100) : 0;
  const allDone = rows.every(r=>r[3]);
  lastPct = allDone ? pct : 0;
  let verdict = "Keep investigating &mdash; go back and complete every page of evidence.";
  if (allDone){
    if (pct>=90) verdict = "Master Detective! Outstanding case work.";
    else if (pct>=70) verdict = "Great detective work &mdash; the case is basically solved!";
    else verdict = "Case partly solved &mdash; review the evidence pages and try again.";
  }
  return `
  <div class="sheet">
    <span class="tag">Case Closed</span>
    <div class="sheet-head"><h2>Your investigation report</h2></div>
    <div class="stamp">CASE CLOSED</div>
    <div class="score-big">${allDone ? pct+'%' : '—'}</div>
    <p class="instructions">${verdict}</p>
    <table class="breakdown">
      <tr><th>Section</th><th>Score</th></tr>
      ${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[3] ? r[1]+' / '+r[2] : 'not completed'}</td></tr>`).join('')}
    </table>
    ${allDone ? `
    <div class="completion-stickers" id="completionStickers">
      <img class="completion-sticker" data-tier="eggcellent-a" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="eggcellent-b" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="perfect" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="excellent" hidden alt="">
      <img class="completion-sticker" data-tier="amazing_work" hidden alt="">
      <img class="completion-sticker" data-tier="i_love_it" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="awesome" hidden alt="">
      <img class="completion-sticker" data-tier="too_cool-a" hidden alt="">
      <img class="completion-sticker" data-tier="too_cool-b" hidden alt="">
      <img class="completion-sticker" data-tier="vzhukh" hidden alt="">
      <img class="completion-sticker" data-tier="fire" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="great_work" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="good_job" hidden alt="">
      <img class="completion-sticker" data-tier="good_vibes" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="nice" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="not_bad" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="strawberry-a" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="strawberry-b" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="keep_going" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="you_tried" hidden alt="">
      <img class="completion-sticker completion-sticker--icon" data-tier="plain" hidden alt="">
      <img class="completion-sticker completion-sticker--medium" data-tier="strawberry-full" hidden alt="">
      <img class="completion-sticker completion-sticker--bonus" data-tier="awesome_is_banned" hidden alt="">
    </div>
    <p id="resultCaption" class="result-caption"></p>` : ''}
    <div class="send-row">
      <button class="btn-check" onclick="sendCompletion()">Send my report to my teacher</button>
      <span class="send-status" id="sendStatus"></span>
    </div>
  </div>`;
}
let lastPct = 0;
function initResults(){ renderResultSticker(lastPct); }

function getStudentName(){
  const el = document.getElementById('studentName');
  const v = el ? el.value.trim() : '';
  return v || '(no name entered)';
}
async function sendCompletion(){
  const status = document.getElementById('sendStatus');
  status.textContent = 'Sending...';
  try{
    const fd = new FormData();
  fd.append('access_key', '8af30ecf-0d8b-4e1f-aa4b-2b3b76fe8234');
  fd.append('course', 'Academy Stars 5');
    fd.append('student', getStudentName());
  fd.append('subject', ('Academy Stars 5 — Unit 10 — Suffixes -ment (Detective Case File)') + ' — ' + (getStudentName()));
    fd.append('lesson', document.title);
    fd.append('exercise', 'Unit 10 — Suffixes -ment (Detective Case File)');
    fd.append('timestamp', new Date().toISOString());
    fd.append('act1_score', `${state.act1.score}/${ACT1_ITEMS.length}`);
    fd.append('act2_score', `${state.act2.score}/${ACT2_WORDS.length}`);
    fd.append('act3_score', `${state.act3.score}/${ACT3_BOUNDARIES.length}`);
    fd.append('act4_score', `${state.act4.score}/${state.act4.total||9}`);
    fd.append('sort_score', `${state.sort.score}/${SORT_VERBS.length}`);
    fd.append('result_tier', getResultTier(lastPct).label);
    fd.append('report_1', state.rep0 || '');
    fd.append('report_2', state.rep1 || '');
    fd.append('report_3', state.rep2 || '');
    const allMistakes = [].concat(
      mistakeLog.act1, mistakeLog.act2, mistakeLog.act3, mistakeLog.act4, mistakeLog.sort
    );
    fd.append('mistakes', allMistakes.length ? allMistakes.join('\n') : 'No mistakes — all items correct.');
    const res = await fetch('https://api.web3forms.com/submit', { method:'POST', headers:{'Accept':'application/json'}, body: fd });
    status.textContent = res.ok ? 'Sent to your teacher!' : "Couldn't send — check your connection.";
  }catch(e){
    status.textContent = "Couldn't send — check your connection.";
  }
}

/* ============ NAV ENGINE ============ */
function renderStage(){
  const p = PAGES[current];
  document.getElementById('stage').innerHTML = p.render();
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', i===current));
  document.getElementById('progressFill').style.width = `${(current+1)/PAGES.length*100}%`;
  document.getElementById('scorePill').textContent = `Page ${current+1} of ${PAGES.length}`;
  if (p.init) p.init();
  document.getElementById('prevBtn').disabled = (current===0);
  document.getElementById('nextBtn').textContent = (current===PAGES.length-1) ? 'Restart ⟲' : 'Next →';
  window.scrollTo({top:0, behavior:'smooth'});
}
function nextPage(){ current = (current===PAGES.length-1) ? 0 : current+1; renderStage(); }
function prevPage(){ if (current>0){ current--; renderStage(); } }
function goTo(i){ current=i; renderStage(); }

document.getElementById('tabs').innerHTML = PAGES.map((p,i)=>`<button class="tab" onclick="goTo(${i})">${p.tab}</button>`).join('');
renderStage();
