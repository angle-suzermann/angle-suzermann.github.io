<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#453458">
<meta name="robots" content="noindex, nofollow">
<title>ANGLE · Homework tracker · Empower B1+</title>
<meta name="ws:type" content="presentation">
<meta name="ws:course" content="Empower B1+">
<meta name="ws:course-id" content="empower-b1">
<meta name="ws:unit" content="0">
<meta name="ws:title" content="Homework tracker">
<meta name="ws:date" content="2026-10-23">
<meta name="ws:status" content="published">
<meta name="ws:audience" content="teacher">
<link rel="stylesheet" href="/assets/tracker/tracker.css?v=11">
</head>
<body>
<div class="bg-photo"></div><div class="bg-wash"></div>
<div class="app">
  <header class="topbar">
    <div class="brand-row">
      <div class="title">Homework tracker<small id="sub">Teacher panel</small></div>
      <div class="tools"><div class="sync" id="sync"><i></i><span id="syncTxt">Demo</span></div><button class="iconbtn" id="gear" title="Settings" aria-label="Settings">⚙</button></div>
    </div>
    <div class="pills" id="courses"></div>
  </header>
  <div id="banner"></div>
  <main>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </main>
</div>

<dialog id="cardDlg"><div class="sheet" id="cardBody"></div></dialog>
<dialog id="setDlg"><div class="sheet settings">
  <button class="iconbtn close" onclick="setDlg.close()">✕</button>
  <h2 style="margin:0;color:var(--purple)">Settings</h2>
  <p class="sub">Leave both fields empty to use demo data (nothing is saved to Google Sheets).</p>
  <label>Apps Script web app URL</label><input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <label>Teacher token</label><input type="text" id="cfgTok" placeholder="your secret phrase" autocomplete="off">
  <p style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="cfgSave">Save and reload data</button><button class="btn ghost" id="cfgDemo">Reset demo data</button></p>
</div></dialog>
<div class="toast" id="toast"></div>

<script>window.TRACKER_PLANS=["emp-2526", "emp-2627"];</script>
<script src="/assets/tracker/individual.js?v=9"></script>
</body>
</html>
