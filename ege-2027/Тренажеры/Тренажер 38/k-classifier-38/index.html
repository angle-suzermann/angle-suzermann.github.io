:root{

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; max-width:100%; overscroll-behavior-x:none; color-scheme:light; }
body{ font-family:'Apercu Pro','Helvetica Neue',Arial,sans-serif; color:var(--text); background:var(--card-tint); overflow-wrap:break-word; }
.app-shell{ position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; }
.bg-photo{ position:absolute; inset:0; z-index:0; background-image:url('img/bg-photo.jpg'); background-size:cover; background-position:center 40%; opacity:0.5; pointer-events:none; }
.bg-wash{ position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(20,14,25,.55), rgba(45,25,60,.9)); pointer-events:none; }
.scroll-area{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative; z-index:2; touch-action:pan-y; }
.topbar{ position:relative; flex:0 0 auto; z-index:60; background:#fff; border-bottom:3px solid var(--purple); box-shadow:0 2px 10px rgba(45,25,60,.08); }
.topbar-inner{ max-width:860px; margin:0 auto; padding:8px 16px 6px; }
.brand-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.lesson-title{ font-weight:800; color:var(--purple); font-size:1rem; }
.namebar{ display:flex; align-items:center; gap:6px; font-size:.82rem; flex-wrap:wrap; }
.namebar input{ border:1.5px solid var(--border); border-radius:8px; padding:5px 8px; font-family:inherit; font-size:.85rem; width:150px; }
.progress-row{ display:flex; align-items:center; gap:10px; margin-top:6px; }
.progress-track{ flex:1; height:8px; background:var(--card-tint); border-radius:6px; overflow:hidden; }
.progress-fill{ height:100%; width:0; background:var(--yellow); transition:width .3s; }
.progress-label{ font-size:.75rem; color:var(--muted); white-space:nowrap; }
.page-dots{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.page-dot{ min-width:26px; height:26px; padding:0 6px; border-radius:13px; background:var(--card-tint); color:var(--purple); font-size:.74rem; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--border); }
.page-dot.active{ background:var(--purple); color:#fff; border-color:var(--purple); }
.save-indicator{ font-size:.72rem; color:var(--correct); opacity:0; transition:opacity .3s ease; white-space:nowrap; }
.save-indicator.show{ opacity:1; }
.page-wrap{ max-width:860px; margin:0 auto; padding:16px 16px 150px; }
.page{ display:none; } .page.active{ display:block; animation:fadein .25s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
.card{ background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 4px 18px rgba(0,0,0,.15); }
.card h2{ margin:0 0 6px; color:var(--purple); font-size:1.15rem; }
.card h3{ margin:12px 0 4px; color:var(--purple-dark); font-size:.98rem; }
.card p{ margin:6px 0; line-height:1.5; font-size:.93rem; }
.muted{ color:var(--muted); }
.restore-note{ background:#fffbe6; border:1px solid #f0dd8a; border-radius:8px; padding:10px 14px; font-size:.88rem; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.restore-note[hidden]{ display:none !important; }
.restore-note button{ background:#fff; border:1.5px solid var(--purple); color:var(--purple); font-weight:700; font-size:.78rem; padding:6px 12px; border-radius:16px; cursor:pointer; font-family:inherit; }
.klegend{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px; margin-top:8px; }
.krow{ display:flex; gap:10px; align-items:flex-start; background:var(--card-tint); border-radius:10px; padding:8px 10px; font-size:.86rem; line-height:1.4; }
.kbadge{ flex:0 0 auto; background:var(--purple); color:#fff; font-weight:800; border-radius:8px; padding:2px 8px; font-size:.85rem; }
.tag{ display:inline-block; font-size:.68rem; font-weight:800; padding:2px 7px; border-radius:10px; margin-left:4px; vertical-align:middle; letter-spacing:.2px; }
.tag.fipi{ background:#e3f4ea; color:#1f6b41; }
.tag.expert{ background:#fff4c2; color:#6a5300; }
.tag.disputed{ background:#fde3df; color:#9b2c1f; }
.item{ border:2px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:12px; background:#fff; }
.item.ok{ border-color:var(--correct); background:#f3fbf6; }
.item.bad{ border-color:var(--wrong); background:#fff6f4; }
.item.shown{ border-color:var(--muted); background:#f7f5fa; }
.item .num{ font-size:.72rem; font-weight:800; color:var(--muted); letter-spacing:.4px; }
.ctx{ font-size:.8rem; color:var(--muted); margin:2px 0 4px; }
.stext{ font-family:Georgia,'Times New Roman',serif; font-size:1.02rem; line-height:1.5; background:var(--card-tint); border-left:4px solid var(--yellow); padding:9px 12px; border-radius:6px; margin:6px 0 10px; }
.kpick{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.kchip{ border:2px solid var(--purple); background:#fff; color:var(--purple); font-weight:800; font-family:inherit; font-size:.9rem; padding:6px 14px; border-radius:18px; cursor:pointer; }
.kchip.sel{ background:var(--purple); color:#fff; }
.kchip:disabled{ cursor:default; }
.kchip.right{ background:var(--correct); border-color:var(--correct); color:#fff; }
.kchip.miss{ background:#fff; border-color:var(--correct); color:var(--correct); border-style:dashed; }
.kchip.extra{ background:var(--wrong); border-color:var(--wrong); color:#fff; }
.cnt{ font-size:.78rem; color:var(--muted); margin-left:6px; }
.actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.btn{ border:none; border-radius:20px; padding:8px 18px; font-family:inherit; font-weight:800; font-size:.85rem; cursor:pointer; }
.btn.primary{ background:var(--yellow); color:var(--black); }
.btn.ghost{ background:#fff; color:var(--purple); border:1.5px solid var(--purple); }
.btn.cta{ background:var(--yellow); color:var(--black); font-size:1rem; padding:12px 26px; }
.btn:disabled{ opacity:.45; cursor:default; }
.fb{ margin-top:10px; font-size:.88rem; line-height:1.45; }
.fb .err{ border-top:1px dashed var(--border); padding:7px 0; }
.fb .err b{ color:var(--purple-dark); }
.verdict{ font-weight:800; margin-bottom:2px; }
.verdict.ok{ color:var(--correct); } .verdict.bad{ color:var(--wrong); }
.note{ font-size:.82rem; background:#fff4c2; border-radius:8px; padding:6px 10px; margin-top:6px; }
.nav-btns{ display:flex; justify-content:space-between; gap:10px; margin-top:16px; }
.nav-btns .btn{ background:var(--purple); color:#fff; }
.nav-btns .btn.next{ background:var(--yellow); color:var(--black); }
table.sum{ width:100%; border-collapse:collapse; font-size:.86rem; margin-top:8px; }
table.sum td, table.sum th{ border-bottom:1px solid var(--border); padding:6px 8px; text-align:left; vertical-align:top; }
.big{ font-size:2.4rem; font-weight:800; color:var(--purple); text-align:center; }
ul.rules{ margin:6px 0 6px 18px; padding:0; font-size:.88rem; line-height:1.5; }
ul.rules li{ margin-bottom:4px; }
.completion-stickers{text-align:center;}
.completion-sticker{display:block;max-width:260px;margin:12px auto 0;animation:stickerPop .45s cubic-bezier(.2,1.4,.4,1);}
.completion-sticker[hidden]{display:none;}
.completion-sticker--medium{max-width:170px;}
.completion-sticker--icon{max-width:110px;}
@keyframes stickerPop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}
.result-caption{text-align:center;font-size:.92rem;color:var(--muted);margin-top:6px;}
.results-panel{ display:none; }
.results-panel.show{ display:block; }
.results-panel h3{ margin-top:10px; }
.results-panel ul{ font-size:.82rem; line-height:1.4; padding-left:18px; }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tagHtml(src){ return `<span class="tag ${src}">${SRC[src]}</span>`; }
function isCorrect(item, sel){
  const union = new Set(); item.errs.forEach(e=>e.k.forEach(k=>union.add(k)));
  if(sel.some(k=>!union.has(k))) return false;
  return item.errs.every(e=>e.k.some(k=>sel.includes(k)));
}

function renderItem(id){
  const it = ITEMS.find(x=>x.id===id); const box = document.getElementById('it_'+id);
  if(!box) return;
  const sel = ans[id]||[], st = done[id];
  box.classList.remove('ok','bad','shown');
  box.querySelectorAll('.kchip').forEach(b=>{
    const k = b.dataset.k;
    b.classList.remove('sel','right','miss','extra'); b.disabled = !!st;
    if(!st){ if(sel.includes(k)) b.classList.add('sel'); }
    else{
      const hit = it.errs.some(e=>e.k.includes(k));
      if(sel.includes(k)) b.classList.add(hit?'right':'extra'); else if(hit) b.classList.add('miss');
    }
  });
  box.querySelectorAll('.actions .btn').forEach(b=>b.disabled=!!st);
  const fb = document.getElementById('fb_'+id);
  if(!st){ fb.innerHTML=''; return; }
  const ok = st==='checked' && isCorrect(it, sel);
  box.classList.add(st==='shown'?'shown':(ok?'ok':'bad'));
  let h = st==='checked' ? `<div class="verdict ${ok?'ok':'bad'}">${ok?'✓ Верно':'✗ Не совпало'}</div>` : `<div class="verdict">Ответ (не засчитан)</div>`;
  it.errs.forEach(e=>{ h += `<div class="err"><b>${e.k.join(' / ')}</b> · ${esc(e.what)} ${tagHtml(e.src)}<br>${esc(e.why)}</div>`; });
  if(it.note) h += `<div class="note">${esc(it.note)}</div>`;
  fb.innerHTML = h;
}

function computeScore(){
  let ok=0; const wrong=[]; const per={};
  PAGES.filter(p=>p.p).forEach(p=>per[p.p]={ok:0,n:0,label:p.title});
  ITEMS.forEach(it=>{
    per[it.p].n++;
    const sel = ans[it.id]||[];
    if(done[it.id]==='checked' ? isCorrect(it,sel) : false){ ok++; per[it.p].ok++; }
    else{
      const exp = it.errs.map(e=>e.k.join('/')).join(', ');
      wrong.push(`§${it.p} №${it.id} — «${it.text.slice(0,70)}${it.text.length>70?'…':''}» → выбрано ${sel.length?sel.join(','):'(пусто)'}, верно ${exp}`);
    }
  });
  return {ok, total:ITEMS.length, wrong, per, pct:Math.round(ok/ITEMS.length*100)};
}

function calcEstimate(){
  const v={}; document.querySelectorAll('[data-c]').forEach(e=>{ v[e.dataset.c]= e.type==='checkbox' ? e.checked : Math.max(0,parseInt(e.value)||0); });
  const st = v.k1st<=1?3:v.k1st<=3?2:v.k1st===4?1:0;
  let ct;
  if(v.k1nr===0) ct = v.k1in<=1?3:v.k1in<=3?2:v.k1in<=5?1:0;
  else if(v.k1nr===1) ct = v.k1in<=1?2:v.k1in<=3?1:0;
  else if(v.k1nr===2) ct = v.k1in<=1?1:0;
  else ct = 0;
  const k1 = Math.min(st,ct);
  let k2 = v.k2===0?3:v.k2<=3?2:v.k2<=5?1:0;
  if(v.noIntro && v.noConc) k2 = 0; else if(v.noIntro || v.noConc) k2 = Math.min(k2,1);
  const k3 = v.k3<=1?3:v.k3<=3?2:v.k3===4?1:0;
  const k4 = v.k4<=2?3:v.k4<=4?2:v.k4<=7?1:0;
  const tot5 = v.k5s+v.k5p;
  const k5 = (v.k5s<=1 && v.k5p<=1)?2:tot5<=4?1:0;
  const pts = [k1,k2,k3,k4,k5];
  const sum = k1===0 ? 0 : pts.reduce((a,b)=>a+b,0);
  document.getElementById('estRow').innerHTML = ['K1','K2','K3','K4','K5'].map((k,i)=>`<div class="est-cell"><b>${pts[i]}</b><span>${k} из ${i===4?2:3}</span></div>`).join('');
  document.getElementById('estTotal').textContent = (k1===0 ? 'K1 = 0, поэтому всё задание получает 0. ' : '') + `Ориентировочно: ${sum} из 14`;
}
document.addEventListener('input', e=>{ if(e.target.matches('[data-c]')) calcEstimate(); });

function updateSkill(){
  const per={K1:[0,0],K2:[0,0],K3:[0,0],K4:[0,0],K5:[0,0]};
  ITEMS.forEach(it=>{ if(done[it.id]!=='checked') return; const sel=ans[it.id]||[];
    it.errs.forEach(e=>{ const k=e.k[0]; per[k][1]++; if(e.k.some(x=>sel.includes(x))) per[k][0]++; }); });
  document.getElementById('skillBox').innerHTML = Object.entries(per).map(([k,[a,b]])=>`<div class="skill"><span><b>${k}</b> · ${KNAMES[k]}</span><b>${b?a+' из '+b:'—'}</b></div>`).join('');
}

function updateSummary(){
  updateSkill();
  const s = computeScore();
  const checked = Object.values(done).filter(v=>v==='checked').length;
  document.getElementById('sumBig').textContent = `${s.ok} / ${s.total}`;
  document.getElementById('sumSub').textContent = checked<s.total ? `Проверено ${checked} из ${s.total}. Неотвеченные засчитаются как ошибки при отправке.` : `Все проверены (${s.pct}%).`;
  document.getElementById('sumTable').innerHTML = '<tr><th>Раздел</th><th>Верно</th></tr>' + Object.values(s.per).map(r=>`<tr><td>${r.label}</td><td>${r.ok} / ${r.n}</td></tr>`).join('');
}

async function sendForm(fields){
  const fd = new FormData(); Object.entries(fields).forEach(([k,v])=>fd.append(k,v));
  const r = await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Accept':'application/json'},body:fd});
  if(!r.ok) throw new Error('HTTP '+r.status);
}
async function submitAll(){
  const nameInput = document.getElementById('studentName');
  if(!nameInput.value.trim()){ nameInput.focus(); alert('Please type your name at the top before submitting.'); return; }
  ITEMS.forEach(it=>{ if(!done[it.id]){ done[it.id]='checked'; } renderItem(it.id); });
  const s = computeScore(); updateSummary();
  const panel = document.getElementById('resultsPanel'); panel.classList.add('show');
  document.getElementById('resultsPercent').textContent = s.pct+'%';
  document.getElementById('resultsFraction').textContent = `${nameInput.value.trim()} — ${s.ok} / ${s.total} correct`;
  document.getElementById('resultsBreakdown').innerHTML = s.wrong.length ? '<h3>Items to review</h3><ul>'+s.wrong.map(w=>`<li>${esc(w)}</li>`).join('')+'</ul>' : '<p style="color:var(--correct);font-weight:700;text-align:center;">All items correct 🎉</p>';
  try{ if(typeof renderResultSticker==='function') renderResultSticker(s.pct); }catch(e){}
  const status = document.getElementById('submitStatus'); status.textContent='Sending…';
  const name = nameInput.value.trim(), topic = document.title;
  try{
    await sendForm({
      access_key: WEB3FORMS_ACCESS_KEY,
      subject: topic.startsWith(COURSE_NAME) ? `${topic} — ${name}` : `${COURSE_NAME} — ${topic} — ${name}`,
      course: COURSE_NAME, lesson: topic, student: name,
      score: `${s.ok} / ${s.total} (${s.pct}%)`,
      result_tier: (typeof getResultTier==='function') ? getResultTier(s.pct).label : '',
      mistakes: s.wrong.length ? s.wrong.join('\n') : 'No mistakes — all items correct.',
      timestamp: new Date().toISOString()
    });
    status.textContent='Sent to your teacher ✓'; submitted=true;
  }catch(e){ status.textContent='Could not send — check your internet connection and try again.'; }
  scheduleSave();
}

function buildDots(){
  const w = document.getElementById('pageDots');
  PAGES.forEach((p,i)=>{ const d=document.createElement('div'); d.className='page-dot'; d.textContent=p.label; d.title=p.title||p.label; d.onclick=()=>showPage(i); w.appendChild(d); });
}
function showPage(n){
  const pages = document.querySelectorAll('.page');
  current = Math.max(0, Math.min(pages.length-1, n));
  pages.forEach((p,i)=>p.classList.toggle('active', i===current));
  document.getElementById('progressFill').style.width = `${(current+1)/pages.length*100}%`;
  document.getElementById('progressLabel').textContent = `Page ${current+1} / ${pages.length}`;
  document.querySelectorAll('.page-dot').forEach((d,i)=>d.classList.toggle('active', i===current));
  const sa = document.getElementById('scrollArea'); if(sa) sa.scrollTo({top:0,behavior:'smooth'});
  if(PAGES[current].key==='sum') updateSummary();
  scheduleSave();
}
function nextPage(){ showPage(current+1); } function prevPage(){ showPage(current-1); }

document.addEventListener('click', e=>{
  const chip = e.target.closest('.kchip');
  if(chip && !chip.disabled){
    const id = +chip.closest('.kpick').dataset.id, k = chip.dataset.k;
    const cur = new Set(ans[id]||[]); cur.has(k)?cur.delete(k):cur.add(k);
    ans[id] = KS.filter(x=>cur.has(x)); renderItem(id); scheduleSave(); return;
  }
  const btn = e.target.closest('[data-act]');
  if(btn && !btn.disabled){
    const id = +btn.dataset.id;
    if(btn.dataset.act==='check'){
      if(!(ans[id]||[]).length){
        const c = document.querySelector(`#it_${id} .cnt`); const it = ITEMS.find(x=>x.id===id);
        c.textContent='Выбери хотя бы один критерий'; c.style.color='var(--wrong)';
        setTimeout(()=>{ c.textContent='Ошибок: '+it.errs.length; c.style.color=''; },1800); return;
      }
      done[id]='checked';
    } else done[id]='shown';
    renderItem(id); scheduleSave();
  }
});

function saveProgress(){
  if(isRestoring) return;
  try{
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({savedAt:new Date().toISOString(), page:current, name:document.getElementById('studentName').value||'', ans, done}));
    const el = document.getElementById('saveIndicator');
    el.textContent = '✓ Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    el.classList.add('show'); clearTimeout(saveProgress._t); saveProgress._t = setTimeout(()=>el.classList.remove('show'), 2200);
  }catch(e){}
}
let saveTimer=null; function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveProgress,400); }
function restoreProgress(){
  let raw; try{ raw = localStorage.getItem(PROGRESS_KEY); }catch(e){ return; }
  if(!raw) return; let st; try{ st = JSON.parse(raw); }catch(e){ return; }
  isRestoring = true;
  if(st.name) document.getElementById('studentName').value = st.name;
  Object.assign(ans, st.ans||{}); Object.assign(done, st.done||{});
  ITEMS.forEach(it=>renderItem(it.id));
  const has = Object.keys(st.done||{}).length || Object.values(st.ans||{}).some(a=>a.length);
  if(has){
    const when = st.savedAt ? new Date(st.savedAt).toLocaleString() : '';
    document.getElementById('restoreNoteText').textContent = `We found saved answers from ${when||'an earlier session'} — they've been filled back in.`;
    document.getElementById('restoreNote').hidden = false;
  }
  if(typeof st.page==='number') showPage(st.page);
  isRestoring = false;
}
function clearProgress(){
  if(!confirm('This will erase all your saved answers on this device. Continue?')) return;
  try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){}
  location.reload();
}
document.addEventListener('input', e=>{ if(e.target.id==='studentName') scheduleSave(); });

buildPages(); calcEstimate(); buildDots(); showPage(0); ITEMS.forEach(it=>renderItem(it.id)); restoreProgress();
</script>
</body>
</html>
