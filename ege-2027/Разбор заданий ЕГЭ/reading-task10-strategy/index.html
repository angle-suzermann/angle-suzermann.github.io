<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F7F6F4;color:#2D2926;font-family:'Apercu Pro',Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid #5E4877;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;text-transform:none;letter-spacing:0;text-align:left;font-size:17px;font-weight:700;color:#5E4877;flex:1 1 320px;line-height:1.3}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:700;border:1.5px solid #5E4877;background:#fff;color:#5E4877;border-radius:999px;padding:7px 16px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#5E4877;color:#fff}
.btn.y{background:#FED500;border-color:#FED500;color:#2D2926}
.btn.y:hover{background:#f0c900}
.count{font-size:14px;color:#6B6475;min-width:64px;text-align:center}
main{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
.stage{position:relative;background:#2D2926;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(45,41,38,.18);aspect-ratio:16/9}
.stage img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;padding:0 14px;color:#fff;font-size:34px;opacity:0;transition:opacity .2s}
.nav.prev{left:0;justify-content:flex-start} .nav.next{right:0;justify-content:flex-end}
.stage:hover .nav{opacity:.85}
.nav span{background:rgba(45,41,38,.55);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.nav:disabled{visibility:hidden}
.bar{height:4px;background:#e4e0e8;border-radius:4px;margin:14px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:#FED500;transition:width .25s}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;position:relative}
.thumbs button.on{border-color:#5E4877;box-shadow:0 0 0 3px rgba(94,72,119,.18)}
.thumbs img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.thumbs b{position:absolute;left:6px;bottom:6px;background:rgba(45,41,38,.75);color:#fff;font-size:11px;border-radius:4px;padding:1px 6px}
.hint{font-size:13px;color:#6B6475;margin:14px 0 0}
.badge{position:fixed;left:22px;bottom:18px;z-index:4;text-decoration:none;opacity:.9}
.badge img{width:96px;display:block}
.badge span{display:block;font-size:10px;color:#5E4877;margin-top:2px}
:fullscreen .stage, .stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
@media (max-width:720px){
  .top h1{font-size:15px} .nav{display:none}
  .thumbs{grid-template-columns:repeat(3,1fr);gap:8px} .badge{display:none}
  .hide-m{display:none}
}

<body>
<div class="top"><div class="top-in">
  <h1>Чтение, Задание 10: стратегия и разбор</h1>
  <div class="tools">
    <button class="btn" id="prevBtn" aria-label="Предыдущий слайд">←</button>
    <span class="count" id="count">1 / 15</span>
    <button class="btn" id="nextBtn" aria-label="Следующий слайд">→</button>
    <button class="btn hide-m" id="fsBtn">⛶ На весь экран</button>
    <a class="btn y" href="reading-task10-2027.pdf" download>⬇ PDF</a>
  </div>
</div></div>
<main>
  <div class="stage" id="stage">
    <img id="slide" src="img/slide-01.webp" alt="Слайд 1">
    <button class="nav prev" id="navPrev" aria-label="Назад"><span>‹</span></button>
    <button class="nav next" id="navNext" aria-label="Вперёд"><span>›</span></button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="thumbs" id="thumbs"></div>
  <p class="hint">Листайте стрелками ← → на клавиатуре, свайпом на телефоне или кликом по миниатюре.</p>
</main>
<script>
(function(){
  var N=15, i=0, key='angle-deck-'+location.pathname;
  var img=document.getElementById('slide'), count=document.getElementById('count'), bar=document.getElementById('bar');
  var src=function(k){return 'img/slide-'+String(k+1).padStart(2,'0')+'.webp';};
  var th=document.getElementById('thumbs');
  for(var k=0;k<N;k++){var b=document.createElement('button');b.type='button';b.dataset.k=k;b.innerHTML='<img loading="lazy" src="'+src(k)+'" alt="Слайд '+(k+1)+'"><b>'+(k+1)+'</b>';b.onclick=function(){go(+this.dataset.k,true)};th.appendChild(b);}
  function go(k,scroll){
    i=Math.max(0,Math.min(N-1,k)); img.src=src(i); img.alt='Слайд '+(i+1);
    count.textContent=(i+1)+' / '+N; bar.style.width=((i+1)/N*100)+'%';
    [].forEach.call(th.children,function(c,j){c.classList.toggle('on',j===i)});
    document.getElementById('navPrev').disabled=document.getElementById('prevBtn').disabled=i===0;
    document.getElementById('navNext').disabled=document.getElementById('nextBtn').disabled=i===N-1;
    if(i+1<N){var p=new Image();p.src=src(i+1);}
    try{localStorage.setItem(key,i)}catch(e){}
    if(scroll&&!document.fullscreenElement)document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'});
  }
  document.getElementById('prevBtn').onclick=document.getElementById('navPrev').onclick=function(){go(i-1)};
  document.getElementById('nextBtn').onclick=document.getElementById('navNext').onclick=function(){go(i+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home')go(0); else if(e.key==='End')go(N-1);
  });
  var stage=document.getElementById('stage'), x0=null;
  stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(i+(dx<0?1:-1));x0=null});
  document.getElementById('fsBtn').onclick=function(){
    if(document.fullscreenElement)document.exitFullscreen(); else if(stage.requestFullscreen)stage.requestFullscreen();
  };
  var saved=0; try{saved=+localStorage.getItem(key)||0}catch(e){}
  go(saved);
})();
</script>
<style>
#inkCanvas{ position:absolute; top:0; left:0; z-index:500; pointer-events:none; touch-action:none; }
.ink-toggle{
  position:fixed; left:16px; top:50%; transform:translateY(-50%); z-index:9999;
  width:52px; height:52px; border-radius:50%; border:none;
  background:var(--purple,#5E4877); color:#fff; font-size:1.3rem;
  box-shadow:0 4px 14px rgba(45,25,60,.35); cursor:pointer;
}
.ink-toggle.active{ background:var(--yellow,#FED500); color:var(--black,#2D2926); }
.ink-panel{
  position:fixed; left:76px; top:50%; transform:translateY(-50%); z-index:9999;
  background:#fff; border:1.5px solid var(--purple,#5E4877); border-radius:14px;
  padding:10px; box-shadow:0 8px 24px rgba(45,25,60,.3);
  display:flex; flex-direction:column; gap:10px; width:auto;
  max-height:86vh; overflow-y:auto;
}
.ink-panel[hidden]{ display:none; }
.ink-row{ display:flex; flex-direction:column; gap:6px; }
.ink-row.ink-colors{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.ink-tool{

}
.ink-tool.active{ border-color:var(--purple,#5E4877); background:#f3eef8; }
.ink-color{
  width:26px; height:26px; border-radius:50%; border:2px solid #fff;
  outline:1.5px solid var(--neutral-border,#e4e0e8); cursor:pointer; padding:0;
}
.ink-color.active{ outline:2.5px solid var(--black,#2D2926); }
.ink-action{

  border-radius:8px; padding:0; font-size:1.05rem; font-weight:700; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; justify-content:center;
}
.ink-action:hover{ background:#f3eef8; }
</style>
<canvas id="inkCanvas"></canvas>
<button type="button" class="ink-toggle" id="inkToggle" title="Рисование">✏️</button>
<div class="ink-panel" id="inkPanel" hidden>
  <div class="ink-row ink-tools">
    <button type="button" class="ink-tool active" data-tool="pen" title="Ручка">✏️</button>
    <button type="button" class="ink-tool" data-tool="highlighter" title="Маркер">🖍️</button>
    <button type="button" class="ink-tool" data-tool="line" title="Линия">╱</button>
    <button type="button" class="ink-tool" data-tool="arrow" title="Стрелка">➔</button>
    <button type="button" class="ink-tool" data-tool="rect" title="Прямоугольник">▭</button>
    <button type="button" class="ink-tool" data-tool="ellipse" title="Овал">◯</button>
    <button type="button" class="ink-tool" data-tool="eraser" title="Ластик">🧹</button>
  </div>
  <div class="ink-row ink-colors">
    <button type="button" class="ink-color active" data-color="#2D2926" style="background:#2D2926" title="Чёрный"></button>
    <button type="button" class="ink-color" data-color="#d6342c" style="background:#d6342c" title="Красный"></button>
    <button type="button" class="ink-color" data-color="#2e6fd6" style="background:#2e6fd6" title="Синий"></button>
    <button type="button" class="ink-color" data-color="#3fa66b" style="background:#3fa66b" title="Зелёный"></button>
    <button type="button" class="ink-color" data-color="#FED500" style="background:#FED500" title="Жёлтый"></button>
    <button type="button" class="ink-color" data-color="#5E4877" style="background:#5E4877" title="Фиолетовый"></button>
    <button type="button" class="ink-color" data-color="#e8578c" style="background:#e8578c" title="Розовый"></button>
    <button type="button" class="ink-color" data-color="#1f9e94" style="background:#1f9e94" title="Бирюзовый"></button>
    <button type="button" class="ink-color" data-color="#e8762c" style="background:#e8762c" title="Оранжевый"></button>
    <button type="button" class="ink-color" data-color="#8a5a3f" style="background:#8a5a3f" title="Коричневый"></button>
  </div>
  <div class="ink-row ink-actions">
    <button type="button" id="inkClear" class="ink-action" title="Очистить">🗑️</button>
    <button type="button" id="inkDone" class="ink-action" title="Готово">✓</button>
  </div>
</div>
<script>
(function(){
  var canvas = document.getElementById('inkCanvas');
  var ctx = canvas.getContext('2d');
  var toggle = document.getElementById('inkToggle');
  var panel = document.getElementById('inkPanel');
  var activeTool = 'pen';
  var activeColor = '#2D2926';
  var drawing = false;
  var current = null;
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  var hostEl = document.querySelector('.scroll-area') || document.body;
  if(canvas.parentElement !== hostEl) hostEl.appendChild(canvas);

  var STORE_KEY = 'angle_ink::' + location.pathname;
  var allStrokes = {};
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) allStrokes = JSON.parse(raw) || {};
  }catch(e){}

  function pageKey(){
    var p = document.querySelector('.page.active[data-page]');
    return p ? ('p' + p.getAttribute('data-page')) : 'single';
  }
  function strokesFor(key){
    if(!allStrokes[key]) allStrokes[key] = [];
    return allStrokes[key];
  }
  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(allStrokes)); }catch(e){}
  }

  function hostSize(){
    return { w: hostEl.scrollWidth, h: hostEl.scrollHeight };
  }

  function resizeCanvas(){
    var size = hostSize();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.style.width = size.w + 'px';
    canvas.style.height = size.h + 'px';
    canvas.width = Math.round(size.w * dpr);
    canvas.height = Math.round(size.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawInk();
  }

  function strokeStyleFor(tool){
    if(tool === 'highlighter') return { width: 16, alpha: .35, cap: 'butt', comp: 'source-over' };
    if(tool === 'eraser') return { width: 22, alpha: 1, cap: 'round', comp: 'destination-out' };
    return { width: 3, alpha: 1, cap: 'round', comp: 'source-over' };
  }

  function drawPath(s){
    if(!s.points || s.points.length < 2) return;
    var st = strokeStyleFor(s.tool);
    ctx.save();
    ctx.globalCompositeOperation = st.comp;
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = st.width;
    ctx.lineCap = st.cap;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i][0], s.points[i][1]); }
    ctx.stroke();
    ctx.restore();
  }

  function drawShape(s){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(s.tool === 'rect'){
      var x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
      var w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      ctx.strokeRect(x, y, w, h);
    } else if(s.tool === 'ellipse'){
      var cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
      var rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(rx,1), Math.max(ry,1), 0, 0, Math.PI*2);
      ctx.stroke();
    } else if(s.tool === 'line' || s.tool === 'arrow'){
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
      if(s.tool === 'arrow'){
        var ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        var ah = 12;
        ctx.beginPath();
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang - Math.PI/7), s.y2 - ah*Math.sin(ang - Math.PI/7));
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang + Math.PI/7), s.y2 - ah*Math.sin(ang + Math.PI/7));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function redrawInk(){
    var size = hostSize();
    ctx.clearRect(0, 0, size.w, size.h);
    var list = strokesFor(pageKey());
    list.forEach(function(s){
      if(s.type === 'path') drawPath(s);
      else drawShape(s);
    });
    if(current){
      if(current.type === 'path') drawPath(current);
      else drawShape(current);
    }
  }
  window.redrawInk = redrawInk;

  function pt(e){
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  function onDown(e){
    if(canvas.style.pointerEvents === 'none') return;
    drawing = true;
    var p = pt(e);
    if(activeTool === 'pen' || activeTool === 'highlighter' || activeTool === 'eraser'){
      current = { type:'path', tool:activeTool, color:activeColor, points:[p] };
    } else {
      current = { type:'shape', tool:activeTool, color:activeColor, x1:p[0], y1:p[1], x2:p[0], y2:p[1] };
    }
    redrawInk();
  }
  function onMove(e){
    if(!drawing || !current) return;
    var p = pt(e);
    if(current.type === 'path'){ current.points.push(p); }
    else { current.x2 = p[0]; current.y2 = p[1]; }
    redrawInk();
  }
  function onUp(){
    if(!drawing || !current) return;
    drawing = false;
    strokesFor(pageKey()).push(current);
    current = null;
    redrawInk();
    persist();
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  function setToolActive(on){
    canvas.style.pointerEvents = on ? 'auto' : 'none';
    toggle.classList.toggle('active', on);
    panel.hidden = !on;
  }

  toggle.addEventListener('click', function(){ setToolActive(panel.hidden); });
  document.getElementById('inkDone').addEventListener('click', function(){ setToolActive(false); });
  document.getElementById('inkClear').addEventListener('click', function(){
    if(!confirm('Стереть пометки на этой странице?')) return;
    allStrokes[pageKey()] = [];
    redrawInk();
    persist();
  });
  document.querySelectorAll('.ink-tool').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.ink-tool').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeTool = btn.dataset.tool;
    });
  });
  document.querySelectorAll('.ink-color').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.ink-color').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeColor = btn.dataset.color;
    });
  });

  var resizeTimer = null;
  function scheduleResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeCanvas, 150); }
  window.addEventListener('resize', scheduleResize);
  if(window.ResizeObserver){ new ResizeObserver(scheduleResize).observe(hostEl); }

  var pageObserver = new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      if(muts[i].attributeName === 'class'){ scheduleResize(); return; }
    }
  });
  pageObserver.observe(hostEl, { attributes:true, attributeFilter:['class'], subtree:true });

  resizeCanvas();
})();
</script>
