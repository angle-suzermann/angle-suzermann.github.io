<script>
(function(){
  var N=19, i=0, key='angle-deck-'+location.pathname;
  var img=document.getElementById('slide'), count=document.getElementById('count'), bar=document.getElementById('bar');
  var src=function(k){return 'img/slide-'+String(k+1).padStart(2,'0')+'.webp';};
  var th=document.getElementById('thumbs');
  for(var k=0;k<N;k++){var b=document.createElement('button');b.type='button';b.dataset.k=k;b.innerHTML='<img loading="lazy" src="'+src(k)+'" alt="Слайд '+(k+1)+'"><b>'+(k+1)+'</b>';b.onclick=function(){go(+this.dataset.k,true)};th.appendChild(b);}
  function go(k,scroll){
    i=Math.max(0,Math.min(N-1,k)); img.src=src(i); img.alt='Слайд '+(i+1);
    count.textContent=(i+1)+' / '+N; bar.style.width=((i+1)/N*100)+'%';
    [].forEach.call(th.children,function(c,j){c.classList.toggle('on',j===i)});
    document.getElementById('navPrev').disabled=document.getElementById('prevBtn').disabled=i===0;
    document.getElementById('navNext').disabled=document.getElementById('nextBtn').disabled=i===N-1;
    if(i+1<N){var p=new Image();p.src=src(i+1);}
    try{localStorage.setItem(key,i)}catch(e){}
    if(scroll&&!document.fullscreenElement)document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'});
  }
  document.getElementById('prevBtn').onclick=document.getElementById('navPrev').onclick=function(){go(i-1)};
  document.getElementById('nextBtn').onclick=document.getElementById('navNext').onclick=function(){go(i+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home')go(0); else if(e.key==='End')go(N-1);
  });
  var stage=document.getElementById('stage'), x0=null;
  stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(i+(dx<0?1:-1));x0=null});
  document.getElementById('fsBtn').onclick=function(){
    if(document.fullscreenElement)document.exitFullscreen(); else if(stage.requestFullscreen)stage.requestFullscreen();
  };
  var saved=0; try{saved=+localStorage.getItem(key)||0}catch(e){}
  go(saved);
})();
</script>

<script>
(function(){
  var canvas = document.getElementById('inkCanvas');
  var ctx = canvas.getContext('2d');
  var laserCanvas = document.getElementById('laserCanvas');
  var lctx = laserCanvas.getContext('2d');
  var toggle = document.getElementById('inkToggle');
  var panel = document.getElementById('inkPanel');
  var undoBtn = document.getElementById('inkUndo');
  var redoBtn = document.getElementById('inkRedo');
  var activeTool = 'pen';
  var activeColor = '#2D2926';
  var activeStamp = null;
  var drawing = false;
  var current = null;
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  var hostEl = document.querySelector('.scroll-area') || document.body;
  if(canvas.parentElement !== hostEl) hostEl.appendChild(canvas);
  if(laserCanvas.parentElement !== hostEl) hostEl.appendChild(laserCanvas);

  var STORE_KEY = 'angle_ink::' + location.pathname;
  var allStrokes = {};
  var redoStacks = {};
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) allStrokes = JSON.parse(raw) || {};
  }catch(e){}

  function pageKey(){
    var p = document.querySelector('.page.active[data-page]');
    return p ? ('p' + p.getAttribute('data-page')) : 'single';
  }
  function strokesFor(key){
    if(!allStrokes[key]) allStrokes[key] = [];
    return allStrokes[key];
  }
  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(allStrokes)); }catch(e){}
  }
  function updateUndoRedoButtons(){
    var key = pageKey();
    undoBtn.disabled = !(allStrokes[key] && allStrokes[key].length);
    redoBtn.disabled = !(redoStacks[key] && redoStacks[key].length);
  }

  function hostSize(){
    return { w: hostEl.scrollWidth, h: hostEl.scrollHeight };
  }

  function resizeCanvas(){
    var size = hostSize();
    dpr = Math.max(1, window.devicePixelRatio || 1);
    [canvas, laserCanvas].forEach(function(cv){
      cv.style.width = size.w + 'px';
      cv.style.height = size.h + 'px';
      cv.width = Math.round(size.w * dpr);
      cv.height = Math.round(size.h * dpr);
    });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawInk();
    updateUndoRedoButtons();
  }

  function strokeStyleFor(tool){
    if(tool === 'highlighter') return { width: 16, alpha: .35, cap: 'butt', comp: 'source-over' };
    if(tool === 'eraser') return { width: 22, alpha: 1, cap: 'round', comp: 'destination-out' };
    return { width: 3, alpha: 1, cap: 'round', comp: 'source-over' };
  }

  function drawPath(s){
    if(!s.points || s.points.length < 2) return;
    var st = strokeStyleFor(s.tool);
    ctx.save();
    ctx.globalCompositeOperation = st.comp;
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = st.width;
    ctx.lineCap = st.cap;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(s.points[0][0], s.points[0][1]);
    for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i][0], s.points[i][1]); }
    ctx.stroke();
    ctx.restore();
  }

  function drawShape(s){
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(s.tool === 'rect'){
      var x = Math.min(s.x1, s.x2), y = Math.min(s.y1, s.y2);
      var w = Math.abs(s.x2 - s.x1), h = Math.abs(s.y2 - s.y1);
      ctx.strokeRect(x, y, w, h);
    } else if(s.tool === 'ellipse'){
      var cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
      var rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(rx,1), Math.max(ry,1), 0, 0, Math.PI*2);
      ctx.stroke();
    } else if(s.tool === 'line' || s.tool === 'arrow'){
      ctx.beginPath();
      ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x2, s.y2);
      ctx.stroke();
      if(s.tool === 'arrow'){
        var ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
        var ah = 12;
        ctx.beginPath();
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang - Math.PI/7), s.y2 - ah*Math.sin(ang - Math.PI/7));
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - ah*Math.cos(ang + Math.PI/7), s.y2 - ah*Math.sin(ang + Math.PI/7));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  var stickerImageCache = {};
  function getStickerImage(key){
    if(stickerImageCache[key]) return stickerImageCache[key];
    if(typeof STICKER_DATA === 'undefined' || !STICKER_DATA[key]) return null;
    var im = new Image();
    im.onload = function(){ redrawInk(); };
    im.src = STICKER_DATA[key];
    stickerImageCache[key] = im;
    return im;
  }
  function drawStamp(s){
    ctx.save();
    if(s.img){
      var im = getStickerImage(s.img);
      if(im && im.complete && im.naturalWidth){
        var k = Math.min(s.size/im.naturalWidth, s.size/im.naturalHeight), dw = im.naturalWidth*k, dh = im.naturalHeight*k;
        ctx.drawImage(im, s.x - dw/2, s.y - dh/2, dw, dh);
      }
    } else if(s.emoji){
      ctx.font = Math.round(s.size*0.9) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.emoji, s.x, s.y);
    }
    ctx.restore();
  }

  function redrawInk(){
    var size = hostSize();
    ctx.clearRect(0, 0, size.w, size.h);
    var list = strokesFor(pageKey());
    list.forEach(function(s){
      if(s.type === 'path') drawPath(s);
      else if(s.type === 'stamp') drawStamp(s);
      else drawShape(s);
    });
    if(current){
      if(current.type === 'path') drawPath(current);
      else drawShape(current);
    }
  }
  window.redrawInk = redrawInk;

  function pt(e){
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  function onDown(e){
    if(canvas.style.pointerEvents === 'none') return;
    if(activeTool === 'laser') return;
    var p = pt(e);
    if(activeTool === 'sticker'){
      if(!activeStamp) return;
      var stamp = { type:'stamp', x:p[0], y:p[1], size:40 };
      if(activeStamp.emoji) stamp.emoji = activeStamp.emoji; else stamp.img = activeStamp.img;
      strokesFor(pageKey()).push(stamp);
      redoStacks[pageKey()] = [];
      redrawInk();
      persist();
      updateUndoRedoButtons();
      return;
    }
    drawing = true;
    if(activeTool === 'pen' || activeTool === 'highlighter' || activeTool === 'eraser'){
      current = { type:'path', tool:activeTool, color:activeColor, points:[p] };
    } else {
      current = { type:'shape', tool:activeTool, color:activeColor, x1:p[0], y1:p[1], x2:p[0], y2:p[1] };
    }
    redrawInk();
  }
  function onMove(e){
    if(activeTool === 'laser' && canvas.style.pointerEvents !== 'none'){
      var lp = pt(e);
      laserTrail.push({x:lp[0], y:lp[1], t:Date.now()});
    }
    if(!drawing || !current) return;
    var p = pt(e);
    if(current.type === 'path'){ current.points.push(p); }
    else { current.x2 = p[0]; current.y2 = p[1]; }
    redrawInk();
  }
  function onUp(){
    if(!drawing || !current) return;
    drawing = false;
    strokesFor(pageKey()).push(current);
    redoStacks[pageKey()] = [];
    current = null;
    redrawInk();
    persist();
    updateUndoRedoButtons();
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  var laserTrail = [];
  function laserLoop(){
    var size = hostSize();
    lctx.clearRect(0, 0, size.w, size.h);
    var now = Date.now();
    laserTrail = laserTrail.filter(function(p){ return now - p.t < 450; });
    laserTrail.forEach(function(p){
      var age = (now - p.t) / 450;
      var alpha = 1 - age;
      var r = Math.max(8 * (1 - age * 0.5), 1);
      lctx.beginPath();
      lctx.fillStyle = 'rgba(214,52,44,' + (alpha * 0.85) + ')';
      lctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      lctx.fill();
    });
    requestAnimationFrame(laserLoop);
  }
  requestAnimationFrame(laserLoop);

  function setToolActive(on){
    canvas.style.pointerEvents = on ? 'auto' : 'none';
    toggle.classList.toggle('active', on);
    panel.hidden = !on;
    if(on) positionPanel();
  }

  var dragging = false, dragMoved = false, dragStartX = 0, dragStartY = 0, dragOrigLeft = 0, dragOrigTop = 0;
  function clampPos(left, top, w, h){
    left = Math.max(4, Math.min(window.innerWidth - w - 4, left));
    top = Math.max(4, Math.min(window.innerHeight - h - 4, top));
    return [left, top];
  }
  function positionPanel(){
    var r = toggle.getBoundingClientRect();
    var pw = panel.offsetWidth || 110;
    var ph = panel.offsetHeight || 200;
    var left = r.right + 8;
    if(left + pw > window.innerWidth - 8) left = r.left - pw - 8;
    var top = r.top + r.height / 2 - ph / 2;
    var clamped = clampPos(left, top, pw, ph);
    panel.style.left = clamped[0] + 'px';
    panel.style.top = clamped[1] + 'px';
    panel.style.transform = 'none';
  }
  toggle.addEventListener('pointerdown', function(e){
    dragging = true; dragMoved = false;
    dragStartX = e.clientX; dragStartY = e.clientY;
    var r = toggle.getBoundingClientRect();
    dragOrigLeft = r.left; dragOrigTop = r.top;
    try{ toggle.setPointerCapture(e.pointerId); }catch(err){}
  });
  toggle.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if(dragMoved){
      var pos = clampPos(dragOrigLeft + dx, dragOrigTop + dy, toggle.offsetWidth, toggle.offsetHeight);
      toggle.style.left = pos[0] + 'px';
      toggle.style.top = pos[1] + 'px';
      toggle.style.transform = 'none';
      if(!panel.hidden) positionPanel();
    }
  });
  function endDrag(){ dragging = false; }
  toggle.addEventListener('pointerup', endDrag);
  toggle.addEventListener('pointercancel', endDrag);
  toggle.addEventListener('click', function(e){
    if(dragMoved){ dragMoved = false; e.preventDefault(); return; }
    setToolActive(panel.hidden);
  });
  window.addEventListener('resize', function(){ if(!panel.hidden) positionPanel(); });

  document.getElementById('inkDone').addEventListener('click', function(){ setToolActive(false); });
  document.getElementById('inkClear').addEventListener('click', function(){
    if(!confirm('Стереть пометки на этой странице?')) return;
    allStrokes[pageKey()] = [];
    redoStacks[pageKey()] = [];
    redrawInk();
    persist();
    updateUndoRedoButtons();
  });
  undoBtn.addEventListener('click', function(){
    var key = pageKey();
    var list = strokesFor(key);
    if(!list.length) return;
    var popped = list.pop();
    if(!redoStacks[key]) redoStacks[key] = [];
    redoStacks[key].push(popped);
    redrawInk();
    persist();
    updateUndoRedoButtons();
  });
  redoBtn.addEventListener('click', function(){
    var key = pageKey();
    var rs = redoStacks[key];
    if(!rs || !rs.length) return;
    strokesFor(key).push(rs.pop());
    redrawInk();
    persist();
    updateUndoRedoButtons();
  });

  document.querySelectorAll('.ink-tool').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.ink-tool').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.ink-sticker-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeTool = btn.dataset.tool;
    });
  });
  document.querySelectorAll('.ink-color').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.ink-color').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      activeColor = btn.dataset.color;
    });
  });

  function selectSticker(stamp, btnEl){
    activeTool = 'sticker';
    activeStamp = stamp;
    document.querySelectorAll('.ink-tool').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.ink-sticker-btn').forEach(function(b){ b.classList.remove('active'); });
    if(btnEl) btnEl.classList.add('active');
  }
  document.querySelectorAll('.ink-sticker-btn[data-sticker-emoji]').forEach(function(btn){
    btn.addEventListener('click', function(){ selectSticker({ emoji: btn.dataset.stickerEmoji }, btn); });
  });

  (function loadEggdogStickers(){
    var EGGDOG_KEYS = ['strawberry-sparkle', 'vzhukh', 'nice', 'not_bad', 'angle-flower', 'angle-stars', 'fire'];
    function populate(){
      if(typeof STICKER_DATA === 'undefined') return;
      var row = document.getElementById('inkStickers');
      EGGDOG_KEYS.forEach(function(key){
        if(!STICKER_DATA[key]) return;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'ink-sticker-btn';
        b.title = 'eggdog';
        b.style.backgroundImage = 'url(' + STICKER_DATA[key] + ')';
        b.addEventListener('click', function(){ selectSticker({ img: key }, b); });
        row.appendChild(b);
      });
    }
    if(typeof STICKER_DATA !== 'undefined'){ populate(); return; }
    var s = document.createElement('script');
    s.src = '/assets/sticker-data.js';
    s.onload = populate;
    document.head.appendChild(s);
  })();

  var resizeTimer = null;
  function scheduleResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeCanvas, 150); }
  window.addEventListener('resize', scheduleResize);
  if(window.ResizeObserver){ new ResizeObserver(scheduleResize).observe(hostEl); }

  var pageObserver = new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      if(muts[i].attributeName === 'class'){ scheduleResize(); return; }
    }
  });
  pageObserver.observe(hostEl, { attributes:true, attributeFilter:['class'], subtree:true });

  resizeCanvas();
})();
</script>
</body>
</html>
