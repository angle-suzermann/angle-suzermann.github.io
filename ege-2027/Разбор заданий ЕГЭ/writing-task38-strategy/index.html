<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Письмо, Задание 38: стратегия и разбор</title>
<meta name="ws:type"      content="presentation">
<meta name="ws:course"    content="ЕГЭ 2027">
<meta name="ws:course-id" content="ege-2027">
<meta name="ws:unit"      content="Разбор заданий ЕГЭ">
<meta name="ws:title"     content="16. Письмо, Задание 38 (проект по данным) — презентация">
<meta name="ws:emoji"     content="🖥️">
<meta name="ws:date"      content="2026-10-05">
<meta name="ws:status"    content="published">
<meta name="ws:formspree" content="mnjekjvq">

<meta name="robots"       content="noindex, nofollow">
<link rel="stylesheet" href="/assets/angle.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F7F6F4;color:#2D2926;font-family:'Apercu Pro',Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid #5E4877;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;text-transform:none;letter-spacing:0;text-align:left;font-size:17px;font-weight:700;color:#5E4877;flex:1 1 320px;line-height:1.3}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:700;border:1.5px solid #5E4877;background:#fff;color:#5E4877;border-radius:999px;padding:7px 16px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#5E4877;color:#fff}
.btn.y{background:#FED500;border-color:#FED500;color:#2D2926}
.btn.y:hover{background:#f0c900}
.count{font-size:14px;color:#6B6475;min-width:64px;text-align:center}
main{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
.stage{position:relative;background:#2D2926;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(45,41,38,.18);aspect-ratio:16/9}
.stage img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;padding:0 14px;color:#fff;font-size:34px;opacity:0;transition:opacity .2s}
.nav.prev{left:0;justify-content:flex-start} .nav.next{right:0;justify-content:flex-end}
.stage:hover .nav{opacity:.85}
.nav span{background:rgba(45,41,38,.55);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.nav:disabled{visibility:hidden}
.bar{height:4px;background:#e4e0e8;border-radius:4px;margin:14px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:#FED500;transition:width .25s}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;position:relative}
.thumbs button.on{border-color:#5E4877;box-shadow:0 0 0 3px rgba(94,72,119,.18)}
.thumbs img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.thumbs b{position:absolute;left:6px;bottom:6px;background:rgba(45,41,38,.75);color:#fff;font-size:11px;border-radius:4px;padding:1px 6px}
.hint{font-size:13px;color:#6B6475;margin:14px 0 0}
.badge{position:fixed;left:22px;bottom:18px;z-index:4;text-decoration:none;opacity:.9}
.badge img{width:96px;display:block}
.badge span{display:block;font-size:10px;color:#5E4877;margin-top:2px}
:fullscreen .stage, .stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
@media (max-width:720px){
  .top h1{font-size:15px} .nav{display:none}
  .thumbs{grid-template-columns:repeat(3,1fr);gap:8px} .badge{display:none}
  .hide-m{display:none}
}
/* FULL-HEIGHT */ html{background:#F7F6F4;min-height:100%;}body{min-height:100vh;min-height:100dvh;}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <h1>Письмо, Задание 38: стратегия и разбор</h1>
  <div class="tools">
    <button class="btn" id="prevBtn" aria-label="Предыдущий слайд">←</button>
    <span class="count" id="count">1 / 14</span>
    <button class="btn" id="nextBtn" aria-label="Следующий слайд">→</button>
    <button class="btn hide-m" id="fsBtn">⛶ На весь экран</button>
    <a class="btn y" href="writing-task38-2027.pdf" download>⬇ PDF</a>
  </div>
</div></div>
<main>
  <div class="stage" id="stage">
    <img id="slide" src="img/slide-01.webp" alt="Слайд 1">
    <button class="nav prev" id="navPrev" aria-label="Назад"><span>‹</span></button>
    <button class="nav next" id="navNext" aria-label="Вперёд"><span>›</span></button>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="thumbs" id="thumbs"></div>
  <p class="hint">Листайте стрелками ← → на клавиатуре, свайпом на телефоне или кликом по миниатюре.</p>
</main>
<script>
(function(){
  var N=14, i=0, key='angle-deck-'+location.pathname;
  var img=document.getElementById('slide'), count=document.getElementById('count'), bar=document.getElementById('bar');
  var src=function(k){return 'img/slide-'+String(k+1).padStart(2,'0')+'.webp';};
  var th=document.getElementById('thumbs');
  for(var k=0;k<N;k++){var b=document.createElement('button');b.type='button';b.dataset.k=k;b.innerHTML='<img loading="lazy" src="'+src(k)+'" alt="Слайд '+(k+1)+'"><b>'+(k+1)+'</b>';b.onclick=function(){go(+this.dataset.k,true)};th.appendChild(b);}
  function go(k,scroll){
    i=Math.max(0,Math.min(N-1,k)); img.src=src(i); img.alt='Слайд '+(i+1);
    count.textContent=(i+1)+' / '+N; bar.style.width=((i+1)/N*100)+'%';
    [].forEach.call(th.children,function(c,j){c.classList.toggle('on',j===i)});
    document.getElementById('navPrev').disabled=document.getElementById('prevBtn').disabled=i===0;
    document.getElementById('navNext').disabled=document.getElementById('nextBtn').disabled=i===N-1;
    if(i+1<N){var p=new Image();p.src=src(i+1);}
    try{localStorage.setItem(key,i)}catch(e){}
    if(scroll&&!document.fullscreenElement)document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'center'});
  }
  document.getElementById('prevBtn').onclick=document.getElementById('navPrev').onclick=function(){go(i-1)};
  document.getElementById('nextBtn').onclick=document.getElementById('navNext').onclick=function(){go(i+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home')go(0); else if(e.key==='End')go(N-1);
  });
  var stage=document.getElementById('stage'), x0=null;
  stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(i+(dx<0?1:-1));x0=null});
  document.getElementById('fsBtn').onclick=function(){
    if(document.fullscreenElement)document.exitFullscreen(); else if(stage.requestFullscreen)stage.requestFullscreen();
  };
  var saved=0; try{saved=+localStorage.getItem(key)||0}catch(e){}
  go(saved);
})();
</script>
</body>
</html>
